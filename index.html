<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WhaleTool · 工具合辑</title>
<meta name="description" content="一个轻量的在线工具合辑，纯前端、免安装、开箱即用。">
<meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1">
<meta name="theme-color" content="#f5f5f7">
<link rel="canonical" href="https://imalasong.github.io/whaletool/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="WhaleTool">
<meta property="og:title" content="WhaleTool · 工具合辑">
<meta property="og:description" content="一个轻量的在线工具合辑，纯前端、免安装、开箱即用。">
<meta property="og:url" content="https://imalasong.github.io/whaletool/">
<meta property="og:locale" content="zh_CN">
<meta property="og:image" content="https://imalasong.github.io/whaletool/assets/og-calendar.png">
<meta name="twitter:card" content="summary_large_image">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": "WhaleTool",
  "url": "https://imalasong.github.io/whaletool/",
  "inLanguage": "zh-CN",
  "description": "轻量的在线工具合辑，纯前端、免安装、开箱即用。"
}
</script>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐳</text></svg>">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<!-- ================= 顶部导航 ================= -->
<nav class="nav">
  <div class="nav-inner">
    <a class="brand" href="./">
      <span class="brand-mark">🐳</span>
      <span class="brand-name">WhaleTool<small>工具合辑</small></span>
    </a>
    <span class="nav-spacer"></span>
    <a class="nav-link" id="repoLink" href="#" target="_blank" rel="noopener">GitHub ↗</a>
  </div>
</nav>

<!-- ================= Hero ================= -->
<header class="hero">
  <span class="hero-pill">✦ 纯前端 · 免安装 · 数据不出本地</span>
  <h1>工具箱都在这儿了，<span class="grad">打开就能用</span></h1>
  <p>不装客户端、不传服务器。所有计算都在浏览器本地完成，关掉网页什么都不留。</p>

  <div class="search-wrap">
    <span class="ico">🔍</span>
    <input id="search" type="search" placeholder="搜工具名、描述或标签…" autocomplete="off" spellcheck="false">
    <span class="kbd">/</span>
  </div>
</header>

<!-- ================= 分类 ================= -->
<div class="filters" id="filters"></div>

<!-- ================= 工具网格 ================= -->
<main class="main">
  <div class="result-line">
    <b id="resultCount">0 个工具</b>
    <span id="resultHint"></span>
    <span class="sort-wrap">
      <select id="sort" aria-label="排序方式">
        <option value="default">默认排序</option>
        <option value="pop">最常用</option>
        <option value="new">最新上线</option>
        <option value="name">按名称</option>
      </select>
    </span>
  </div>
  <div class="grid" id="grid"></div>
</main>

<footer class="footer">
  <p>纯前端工具合辑 · 所有计算都在你的浏览器里完成</p>
  <p style="margin-top:6px"><a href="https://github.com/imalasong/whaletool" target="_blank" rel="noopener">GitHub 仓库</a></p>
</footer>

<script src="assets/tools.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
