<noscript><p class="noscript">请开启浏览器的 JavaScript 后进入回声之城。</p></noscript>
<script>/* Four Mirrors — a dependency-free, softly animated city on reflective water. */
(() => {
  'use strict';

  const TAU = Math.PI * 2;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const rgba = (hex, alpha) => {
    const h = hex.replace('#', '');
    return `rgba(${parseInt(h.slice(0, 2), 16)},${parseInt(h.slice(2, 4), 16)},${parseInt(h.slice(4, 6), 16)},${alpha})`;
  };
  const seeded = seed => () => {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t ^= t + Math.imul(t ^ t >>> 7, 61 | t);
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };

  const REALMS = {
    fog:     { name: '雾港',     color: '#98c3c8', position: [-7.15, 1.1],  icon: 0 },
    echo:    { name: '回声议厅', color: '#b2a5d6', position: [-1.05, -7.15], icon: 1 },
    archive: { name: '旧日档案', color: '#d2af82', position: [1.05, 7.15],   icon: 2 },
    engine:  { name: '齿轮工坊', color: '#91baa0', position: [7.15, -1.05], icon: 3 }
  };

  class MirrorWorld {
    constructor(canvas, { onSelect, mode = 'map' } = {}) {
      if (!canvas || typeof canvas.getContext !== 'function') {
        throw new TypeError('MirrorWorld requires a canvas element.');
      }
      this.canvas = canvas;
      this.ctx = canvas.getContext('2d', { alpha: false });
      if (!this.ctx) throw new Error('A 2D canvas context is unavailable.');
      this.onSelect = typeof onSelect === 'function' ? onSelect : () => {};
      this.mode = ['map', 'mission', 'hero'].includes(mode) ? mode : 'map';
      this.realm = 'fog';
      this.progress = { fog: 0, echo: 0, archive: 0, engine: 0 };
      this.hover = null;
      this.focused = false;
      this.destroyed = false;
      this._raf = 0;
      this._resizeRaf = 0;
      this._lastFrame = -1000;
      this._clock = 0;
      this._driftX = this._driftY = 0;
      this._gates = {};
      this._media = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
      this._reducedMotion = !!(this._media && this._media.matches);
      this._background = document.createElement('canvas');
      this._architecture = document.createElement('canvas');
      this._foreground = document.createElement('canvas');
      const rng = seeded(0x47B24);
      this._particles = Array.from({ length: 60 }, (_, i) => ({
        x: rng(), y: .17 + rng() * .76, radius: .38 + rng() * 1.3,
        phase: rng() * TAU, speed: .1 + rng() * .3, warm: i % 4 === 0
      }));

      this._boundPointerMove = e => this._pointerMove(e);
      this._boundPointerLeave = () => this._setHover(null);
      this._boundClick = e => this._click(e);
      this._boundKey = e => this._key(e);
      this._boundFocus = () => { this.focused = true; if (this.mode === 'map' && !this.hover) this._setHover('fog'); this._requestPaint(); };
      this._boundBlur = () => { this.focused = false; this._setHover(null); };
      this._boundVisible = () => { document.hidden ? this._stop() : this._start(); };
      this._boundMotion = e => this.setReducedMotion(e.matches);
      this._boundFonts = () => { if(!this.destroyed){this._build();this._requestPaint();} };
      this._boundResize = () => {
        if (this._resizeRaf) cancelAnimationFrame(this._resizeRaf);
        this._resizeRaf = requestAnimationFrame(() => { this._resizeRaf = 0; this._resize(); });
      };
      this._boundTick = time => this._tick(time);

      this._originalTabIndex = canvas.getAttribute('tabindex');
      this._originalLabel = canvas.getAttribute('aria-label');
      this._originalRole = canvas.getAttribute('role');
      if (!canvas.hasAttribute('tabindex')) canvas.tabIndex = this.mode === 'map' ? 0 : -1;
      canvas.setAttribute('role', 'img');
      canvas.setAttribute('aria-label', '四镜之城。雾港、回声议厅、旧日档案与齿轮工坊围绕中央灯塔。地图模式可点击镜门，或用方向键选择并按回车进入。');
      canvas.addEventListener('pointermove', this._boundPointerMove, { passive: true });
      canvas.addEventListener('pointerleave', this._boundPointerLeave, { passive: true });
      canvas.addEventListener('click', this._boundClick);
      canvas.addEventListener('keydown', this._boundKey);
      canvas.addEventListener('focus', this._boundFocus);
      canvas.addEventListener('blur', this._boundBlur);
      document.addEventListener('visibilitychange', this._boundVisible);
      if(document.fonts) {
        document.fonts.ready.then(this._boundFonts);
        if(document.fonts.addEventListener)document.fonts.addEventListener('loadingdone',this._boundFonts);
      }
      if (this._media) {
        if (this._media.addEventListener) this._media.addEventListener('change', this._boundMotion);
        else if (this._media.addListener) this._media.addListener(this._boundMotion);
      }
      if (window.ResizeObserver) {
        this._observer = new ResizeObserver(this._boundResize);
        this._observer.observe(canvas);
      } else window.addEventListener('resize', this._boundResize, { passive: true });
      this._resize();
      this._start();
    }

    setMode(mode, realm) {
      if (this.destroyed) return;
      const next = ['map', 'mission', 'hero'].includes(mode) ? mode : 'map';
      const nextRealm = REALMS[realm] ? realm : this.realm;
      if (this.mode === next && this.realm === nextRealm) return;
      this.mode = next;
      this.realm = nextRealm;
      this._setHover(null);
      if (this._originalTabIndex === null) this.canvas.tabIndex = this.mode === 'map' ? 0 : -1;
      this._build();
      this._requestPaint();
    }

    setProgress(values = {}) {
      if (this.destroyed) return;
      let changed = false;
      Object.keys(REALMS).forEach(key => {
        if (!Object.prototype.hasOwnProperty.call(values, key)) return;
        const value = Number(values[key]);
        if (!Number.isFinite(value)) return;
        const normalized = clamp(value > 1 ? value / 100 : value, 0, 1);
        if (this.progress[key] !== normalized) { this.progress[key] = normalized; changed = true; }
      });
      if (changed) { this._build(); this._requestPaint(); }
    }

    setReducedMotion(value) {
      if (this.destroyed) return;
      this._reducedMotion = !!value;
      this._driftX = this._driftY = 0;
      this._stop();
      this._requestPaint();
      this._start();
    }

    destroy() {
      if (this.destroyed) return;
      this.destroyed = true;
      this._stop();
      if (this._resizeRaf) cancelAnimationFrame(this._resizeRaf);
      if (this._observer) this._observer.disconnect();
      else window.removeEventListener('resize', this._boundResize);
      this.canvas.removeEventListener('pointermove', this._boundPointerMove);
      this.canvas.removeEventListener('pointerleave', this._boundPointerLeave);
      this.canvas.removeEventListener('click', this._boundClick);
      this.canvas.removeEventListener('keydown', this._boundKey);
      this.canvas.removeEventListener('focus', this._boundFocus);
      this.canvas.removeEventListener('blur', this._boundBlur);
      document.removeEventListener('visibilitychange', this._boundVisible);
      if(document.fonts&&document.fonts.removeEventListener)document.fonts.removeEventListener('loadingdone',this._boundFonts);
      if (this._media) {
        if (this._media.removeEventListener) this._media.removeEventListener('change', this._boundMotion);
        else if (this._media.removeListener) this._media.removeListener(this._boundMotion);
      }
      const restore = (name, value) => value === null ? this.canvas.removeAttribute(name) : this.canvas.setAttribute(name, value);
      restore('tabindex', this._originalTabIndex);
      restore('aria-label', this._originalLabel);
      restore('role', this._originalRole);
      this.canvas.style.cursor = '';
      [this._background, this._architecture, this._foreground].forEach(c => { c.width = c.height = 1; });
      this._gates = {};
    }

    _resize() {
      if (this.destroyed) return;
      const rect = this.canvas.getBoundingClientRect();
      const width = Math.max(1, Math.round(rect.width || this.canvas.clientWidth || 960));
      const height = Math.max(1, Math.round(rect.height || this.canvas.clientHeight || 600));
      const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
      if (width === this.width && height === this.height && dpr === this.dpr) return;
      this.width = width; this.height = height; this.dpr = dpr;
      [this.canvas, this._background, this._architecture, this._foreground].forEach(c => {
        c.width = Math.round(width * dpr); c.height = Math.round(height * dpr);
      });
      this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      this._build();
      this._requestPaint();
    }

    _buffer(canvas) {
      const ctx = canvas.getContext('2d');
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
      return ctx;
    }

    _build() {
      if (!this.width || !this.height || this.destroyed) return;
      const { width: w, height: h } = this;
      const isMission = this.mode === 'mission';
      this.scale = Math.min(w / (w < 580 ? 27 : 30), h / 21.2);
      if (this.mode === 'hero') this.scale *= 1.08;
      this.center = { x: w * .5, y: h * (this.mode === 'hero' ? .57 : .545) };
      this._gates = {};
      this._light = null;
      this._drawBackground(this._buffer(this._background));
      const ctx = this._buffer(this._architecture);
      if (isMission) {
        const key = this.realm;
        this.scale = Math.min(w / 15.4, h / 10.5);
        this.center = { x: w * (w < 650 ? .69 : .79), y: h * .65 };
        ctx.save();
        ctx.globalAlpha = .58;
        this._drawIslandReflection(ctx, key, 0, 0);
        this._drawIsland(ctx, key, 0, 0, false);
        ctx.restore();
      } else {
        Object.keys(REALMS).forEach(key => this._drawBridge(ctx, ...REALMS[key].position, key));
        const objects = Object.keys(REALMS).map(key => ({ key, x: REALMS[key].position[0], z: REALMS[key].position[1] }));
        objects.forEach(o => this._drawIslandReflection(ctx, o.key, o.x, o.z));
        objects.push({ key: 'lighthouse', x: 0, z: 0 });
        objects.sort((a, b) => a.x + a.z - b.x - b.z).forEach(o => {
          if (o.key === 'lighthouse') this._drawLighthouse(ctx);
          else this._drawIsland(ctx, o.key, o.x, o.z, false);
        });
        if(this.mode==='map')Object.keys(REALMS).forEach(key=>this._drawLabel(ctx,key,...REALMS[key].position));
      }
      const front = this._buffer(this._foreground);
      if (isMission) {
        const shade = front.createLinearGradient(0, 0, w, 0);
        shade.addColorStop(0, 'rgba(7,17,19,.68)');
        shade.addColorStop(.5, 'rgba(7,17,19,.44)');
        shade.addColorStop(1, 'rgba(7,17,19,.10)');
        front.fillStyle = shade; front.fillRect(0, 0, w, h);
      }
      const bottom = front.createLinearGradient(0, h * .66, 0, h);
      bottom.addColorStop(0, 'rgba(7,19,21,0)'); bottom.addColorStop(1, 'rgba(7,17,19,.66)');
      front.fillStyle = bottom; front.fillRect(0, h * .66, w, h * .34);
      const vignette = front.createRadialGradient(w * .5, h * .46, Math.min(w, h) * .22, w * .5, h * .46, Math.max(w, h) * .7);
      vignette.addColorStop(0, 'rgba(3,10,12,0)'); vignette.addColorStop(1, 'rgba(3,10,12,.40)');
      front.fillStyle = vignette; front.fillRect(0, 0, w, h);
    }

    _p(x, y, z) {
      return { x: this.center.x + (x - z) * this.scale, y: this.center.y + (x + z) * this.scale * .405 - y * this.scale };
    }

    _polygon(ctx, points, fill, stroke, lineWidth = .7) {
      ctx.beginPath();
      points.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
      ctx.closePath();
      if (fill) { ctx.fillStyle = fill; ctx.fill(); }
      if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lineWidth; ctx.stroke(); }
    }

    _line(ctx, a, b, color, width = 1) {
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
      ctx.strokeStyle = color; ctx.lineWidth = width; ctx.stroke();
    }

    _box(ctx, x, y, z, width, height, depth, material = {}) {
      const left = material.left || '#24423e';
      const right = material.right || '#142f2e';
      const top = material.top || '#44605a';
      const edge = material.edge || 'rgba(192,219,199,.12)';
      const corners = [ [x-width/2,z-depth/2], [x+width/2,z-depth/2], [x+width/2,z+depth/2], [x-width/2,z+depth/2] ];
      const up = corners.map(([a,b]) => this._p(a,y+height,b));
      const low = corners.map(([a,b]) => this._p(a,y,b));
      this._polygon(ctx, [up[1],up[2],low[2],low[1]], right, edge);
      this._polygon(ctx, [up[2],up[3],low[3],low[2]], left, edge);
      this._polygon(ctx, up, top, edge);
      return { up, low };
    }

    _slab(ctx, x, z, rx, rz, y, height, color = '#38534b') {
      const corners = [[-.62,-1],[.62,-1],[1,-.62],[1,.62],[.62,1],[-.62,1],[-1,.62],[-1,-.62]];
      const up = corners.map(([a,b]) => this._p(x+a*rx,y+height,z+b*rz));
      const low = corners.map(([a,b]) => this._p(x+a*rx,y,z+b*rz));
      for (let i=0;i<8;i++) {
        const j=(i+1)%8;
        this._polygon(ctx,[up[i],up[j],low[j],low[i]],i<3 ? '#142f2d' : '#1d3935','rgba(146,180,157,.10)');
      }
      this._polygon(ctx,up,color,'rgba(170,194,165,.26)',.9);
      return up;
    }

    _cylinder(ctx, x, y, z, radius, height, sides, colors = {}) {
      const top = [], low = [];
      for (let i=0;i<sides;i++) {
        const a=TAU*i/sides;
        top.push(this._p(x+Math.cos(a)*radius,y+height,z+Math.sin(a)*radius));
        low.push(this._p(x+Math.cos(a)*radius,y,z+Math.sin(a)*radius));
      }
      const faces=[];
      for(let i=0;i<sides;i++) {
        const j=(i+1)%sides;
        faces.push({i,j,depth:top[i].y+top[j].y});
      }
      faces.sort((a,b)=>a.depth-b.depth).forEach(({i,j})=>{
        this._polygon(ctx,[top[i],top[j],low[j],low[i]],(i<Math.ceil(sides/2) ? colors.light : colors.dark) || (i<Math.ceil(sides/2) ? '#486050' : '#273f36'),'rgba(194,211,172,.13)');
      });
      this._polygon(ctx,top,colors.top || '#81917a','rgba(210,217,184,.24)');
      return top;
    }

    _drawBackground(ctx) {
      const { width:w,height:h }=this;
      const sky=ctx.createLinearGradient(0,0,0,h);
      sky.addColorStop(0,'#0b181d'); sky.addColorStop(.3,'#263e3e');
      sky.addColorStop(.48,'#1b3635'); sky.addColorStop(.7,'#142e2e'); sky.addColorStop(1,'#0b2024');
      ctx.fillStyle=sky;ctx.fillRect(0,0,w,h);
      const atmosphere=ctx.createRadialGradient(w*.53,h*.32,0,w*.53,h*.32,w*.52);
      atmosphere.addColorStop(0,'rgba(181,191,151,.13)');atmosphere.addColorStop(.4,'rgba(113,158,143,.055)');atmosphere.addColorStop(1,'rgba(80,130,123,0)');
      ctx.fillStyle=atmosphere;ctx.fillRect(0,0,w,h);
      const random=seeded(71643);
      // A distant inhabited coast, kept soft by several atmospheric depths.
      for(let layer=0;layer<3;layer++) {
        const baseline=h*(.305+layer*.036);
        ctx.fillStyle=['rgba(130,158,143,.065)','rgba(105,137,127,.10)','rgba(63,97,88,.17)'][layer];
        for(let i=0;i<64;i++) {
          const x=(i/63)*w+random()*9;
          const bw=3+random()*w*.013;
          const bh=h*(.012+random()*.065)*(1-layer*.14);
          ctx.fillRect(x,baseline-bh,bw,bh);
          if(i%5===0) {ctx.beginPath();ctx.moveTo(x,baseline-bh);ctx.lineTo(x+bw*.5,baseline-bh-h*.016);ctx.lineTo(x+bw,baseline-bh);ctx.fill();}
          if(layer===2 && i%3===0) {
            ctx.fillStyle='rgba(218,199,141,.13)';ctx.fillRect(x+bw*.4,baseline-bh*.6,1,2);ctx.fillStyle='rgba(63,97,88,.17)';
          }
        }
      }
      // The moon and its broad, almost invisible mist halo.
      const mx=w*.73,my=h*.137,mr=Math.max(1.5,Math.min(w,h)*.006);
      const moon=ctx.createRadialGradient(mx,my,0,mx,my,mr*19);
      moon.addColorStop(0,'rgba(223,217,183,.14)');moon.addColorStop(1,'rgba(223,217,183,0)');
      ctx.fillStyle=moon;ctx.fillRect(mx-mr*19,my-mr*19,mr*38,mr*38);
      ctx.fillStyle='rgba(223,221,191,.6)';ctx.beginPath();ctx.arc(mx,my,mr,0,TAU);ctx.fill();
      // Long bands hold the scene together as a body of water, not a flat canvas.
      for(let i=0;i<140;i++) {
        const y=h*(.35+random()*.64),x=random()*w;
        const perspective=(y/h-.3)*1.4;
        const length=(3+random()*46)*perspective;
        ctx.strokeStyle=`rgba(161,186,159,${.018+random()*.055})`;
        ctx.lineWidth=.45+perspective*.3;
        ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+length,y);ctx.stroke();
      }
      for(let i=0;i<3;i++) {
        const y=h*(.38+i*.07);
        const mist=ctx.createLinearGradient(0,y-h*.045,0,y+h*.045);
        mist.addColorStop(0,'rgba(147,173,151,0)');mist.addColorStop(.5,'rgba(147,173,151,.025)');mist.addColorStop(1,'rgba(147,173,151,0)');
        ctx.fillStyle=mist;ctx.fillRect(0,y-h*.045,w,h*.09);
      }
      // Small moored boats provide scale; they never compete with the gates.
      [[.12,.66],[.86,.56],[.79,.84]].forEach(([bx,by],index)=>{
        const x=w*bx,y=h*by,size=clamp(w*.018,7,23)*(index===2?1.2:.7);
        this._polygon(ctx,[{x:x-size,y},{x:x+size,y:y-1},{x:x+size*.5,y:y+size*.18},{x:x-size*.45,y:y+size*.22}],'#0b2023','rgba(167,177,137,.18)');
        this._line(ctx,{x,y:y-size*.65},{x,y:y+2},'rgba(159,179,153,.25)',.6);
        this._line(ctx,{x:x-size*1.2,y:y+size*.5},{x:x+size*1.2,y:y+size*.5},'rgba(148,174,151,.06)',1);
      });
    }

    _drawBridge(ctx, x, z, key) {
      const len=Math.hypot(x,z),ux=x/len,uz=z/len;
      const from=1.95,to=len-2.4;
      const steps=Math.max(1,Math.ceil((to-from)/.52));
      const color=REALMS[key].color;
      // Raised, segmented stone causeways with slender brass guide rails.
      for(let i=0;i<steps;i++) {
        const t=from+(to-from)*(i+.5)/steps;
        const cx=ux*t,cz=uz*t,half=.31,halfL=(to-from)/steps*.44;
        const points=[[-half,-halfL],[half,-halfL],[half,halfL],[-half,halfL]].map(([a,b])=>this._p(cx-uz*a+ux*b,.10,cz+ux*a+uz*b));
        const lower=points.map(p=>({x:p.x,y:p.y+this.scale*.19}));
        this._polygon(ctx,[points[2],points[3],lower[3],lower[2]],'#132c2b','rgba(136,165,147,.12)');
        this._polygon(ctx,points,'#355047','rgba(155,179,150,.13)');
        if(i%3===0) this._box(ctx,cx,-.82,cz,.15,.9,.15,{top:'#536451',left:'#263e36',right:'#17322d'});
      }

    _start() {

    _stop() {if(this._raf)cancelAnimationFrame(this._raf);this._raf=0;}

    _requestPaint() {

    _pointerPosition(event) {

    _key(event) {

      } else if(event.key==='Enter'||event.key===' ') {
        if(this.hover){event.preventDefault();this.onSelect(this.hover);}
      } else if(event.key==='Escape')this._setHover(null);

  }

<script>(() => {

const DAY = 86400000;

const modal = document.getElementById('modal');
const e = s => String(s == null ? '' : s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const shuffle = arr => {const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const num = x => String(x).padStart(2,'0');
const isoDay = (d=new Date()) => [d.getFullYear(),num(d.getMonth()+1),num(d.getDate())].join('-');

const safeText = (v,max=2500)=>typeof v==='string'?v.slice(0,max):'';
let storageAvailable=true, toastTimer, world=null, route='home', currentRealm='fog', reviewSession=null, audioContext=null, audioGain=null, audioNodes=[], audioOn=false, saveTimer;
const fresh = ()=>({version:1,createdAt:Date.now(),visits:[],completed:{},reviews:{},reflections:[],habits:[],settings:{reduced:window.matchMedia('(prefers-reduced-motion: reduce)').matches},active:null,lastRun:null,seenIntro:false});
function sanitize(raw,allowActive=false){
 if(!raw || raw.version!==1 || typeof raw!=='object')throw Error('存档格式或版本不匹配。');
 const s=fresh();s.createdAt=clamp(raw.createdAt,1,Date.now())||Date.now();s.seenIntro=!!raw.seenIntro;
 s.visits=Array.isArray(raw.visits)?raw.visits.filter(v=>/^\d{4}-\d{2}-\d{2}$/.test(v)).slice(-500):[];
 if(raw.completed && typeof raw.completed==='object')for(const c of CASES){const x=raw.completed[c.id];if(x && typeof x==='object')s.completed[c.id]={stars:clamp(x.stars,0,3),quality:clamp(x.quality,0,2),attempts:clamp(x.attempts,1,100000),firstAt:clamp(x.firstAt,1,Date.now()),lastAt:clamp(x.lastAt,1,Date.now()),choice:c.choices.some(q=>q.id===x.choice)?x.choice:'',exercise:clamp(x.exercise,0,1),recall:x.recall&&typeof x.recall==='object'?{rate:clamp(x.recall.rate,0,2),level:clamp(x.recall.level,0,5),due:clamp(x.recall.due,1,Date.now()+DAY*400),count:clamp(x.recall.count,0,100000),at:clamp(x.recall.at,0,Date.now())}:null};}
 if(raw.reviews && typeof raw.reviews==='object')for(const card of DECK){const x=raw.reviews[card.id];if(x&&typeof x==='object')s.reviews[card.id]={level:clamp(Math.floor(x.level),0,5),due:clamp(x.due,1,Date.now()+DAY*400),count:clamp(x.count,0,100000),lastAt:clamp(x.lastAt,0,Date.now()),lapses:clamp(x.lapses,0,100000),answer:safeText(x.answer,1800)};}
 if(Array.isArray(raw.reflections))s.reflections=raw.reflections.filter(x=>x&&typeof x==='object'&&byId[x.caseId]).slice(-250).map(x=>({caseId:x.caseId,text:safeText(x.text),rate:clamp(x.rate,0,2),at:clamp(x.at,1,Date.now())}));
 if(Array.isArray(raw.habits))s.habits=raw.habits.filter(x=>x&&typeof x==='object').slice(-100).map((x,i)=>({id:/^h[\d-]+$/.test(x.id)?x.id:'h'+Date.now()+'-'+i,realm:realms.includes(x.realm)?x.realm:'fog',trigger:safeText(x.trigger,450),action:safeText(x.action,700),check:safeText(x.check,600),result:safeText(x.result,1200),at:clamp(x.at,1,Date.now()),done:!!x.done}));
 s.settings.reduced=raw.settings&&typeof raw.settings.reduced==='boolean'?raw.settings.reduced:s.settings.reduced;

 if(raw.lastRun && Array.isArray(raw.lastRun.history))s.lastRun={kind:['journey','quick','daily','free','tower'].includes(raw.lastRun.kind)?raw.lastRun.kind:'journey',history:raw.lastRun.history.filter(x=>byId[x.id]).slice(0,4).map(x=>({id:x.id,quality:clamp(x.quality,0,2),stars:clamp(x.stars,0,3),choice:safeText(x.choice,3),exercise:clamp(x.exercise,0,1)})),light:clamp(raw.lastRun.light,0,30),trust:clamp(raw.lastRun.trust,0,20),time:clamp(raw.lastRun.time,0,20),at:clamp(raw.lastRun.at,1,Date.now())};

function validRun(a){
 try {
  if(!a||!Array.isArray(a.queue)||!a.queue.length||a.queue.length>4||!a.queue.every(id=>typeof id==='string'&&byId[id])||new Set(a.queue).size!==a.queue.length||!Number.isInteger(a.index)||a.index<0||a.index>=a.queue.length||!['journey','quick','daily','free','tower'].includes(a.kind))return false;
  if(!['lens','investigate','exercise','decision','result','reflect'].includes(a.phase)||!a.step||a.step.id!==a.queue[a.index])return false;
  const t=a.step,c=byId[t.id],ex=c.exercise;
  if(!Array.isArray(t.opened)||t.opened.length>3||new Set(t.opened).size!==t.opened.length||!t.opened.every(x=>c.clues.some(q=>q.id===x))||t.budget!==Math.max(0,2-t.opened.length))return false;
  if(!Array.isArray(t.order)||t.order.length!==3||new Set(t.order).size!==3||!t.order.every(x=>c.choices.some(q=>q.id===x)))return false;
  if(!Array.isArray(a.history)||a.history.length!==a.index||!a.history.every((x,i)=>x&&x.id===a.queue[i]&&byId[x.id].choices.some(q=>q.id===x.choice&&q.quality===x.quality)&&typeof x.exercise==='number'&&x.exercise>=0&&x.exercise<=1&&x.stars===(x.quality===2?2:x.quality===1?1:0)+(x.exercise===1?1:0)))return false;
  if(![a.light,a.trust,a.time].every(x=>Number.isInteger(x)&&x>=0&&x<=30)||typeof t.confidence!=='number'||!Number.isFinite(t.confidence)||t.confidence<0||t.confidence>100)return false;
  if(!t.answers||typeof t.answers!=='object'||Array.isArray(t.answers)||!Array.isArray(t.pool)||!Array.isArray(t.chain)||typeof t.answer!=='string'||t.answer.length>1800)return false;
  if(!Array.isArray(t.exEvidence)||new Set(t.exEvidence).size!==t.exEvidence.length||!t.exEvidence.every(id=>t.opened.includes(id)))return false;
  if(typeof t.exerciseChecked!=='boolean'||typeof t.revealed!=='boolean'||typeof t.committed!=='boolean')return false;
  if(t.selected!==null&&!c.choices.some(q=>q.id===t.selected))return false;
  if(t.lens!==null&&!realms.includes(t.lens))return false;
  const permutation=(arr,values)=>arr.length===values.length&&new Set(arr).size===values.length&&arr.every(x=>values.includes(x));
  if(ex.type==='mechanism'){const addon=window.MIRROR_EXPERIMENTS?.[c.id];if(!permutation(t.pool,[...ex.chain,...ex.decoys])||t.chain.length>3||new Set(t.chain).size!==t.chain.length||!t.chain.every(i=>Number.isInteger(i)&&i>=0&&i<t.pool.length)||Object.keys(t.answers).some(k=>k!=='experiment')||('experiment' in t.answers&&(!addon||!addon.options.some(x=>x.id===t.answers.experiment))))return false;if(!Array.isArray(t.experimentOrder)||!permutation(t.experimentOrder,(addon?.options||[]).map(x=>x.id)))return false;}
  else if(ex.type==='listening'){if(!permutation(t.pool,ex.statements.map((_,i)=>i))||Object.keys(t.answers).some(k=>k!=='listen')||('listen' in t.answers&&(!Number.isInteger(t.answers.listen)||!t.pool.includes(t.answers.listen))))return false;}
  else if(ex.type==='attribution'){if(!permutation(t.pool,ex.items.map((_,i)=>i))||Object.entries(t.answers).some(([k,v])=>!t.pool.includes(Number(k))||!['control','external','unknown'].includes(v)))return false;}
  else if(ex.type==='uncertainty'){const source=[...ex.known.map(text=>({text,category:'known'})),{text:ex.unknown,category:'unknown'}];if(t.pool.length!==source.length||new Set(t.pool.map(x=>x?.text)).size!==source.length||!t.pool.every(x=>x&&source.some(y=>x.text===y.text&&x.category===y.category))||Object.entries(t.answers).some(([k,v])=>!Number.isInteger(Number(k))||Number(k)<0||Number(k)>=t.pool.length||!['known','unverified','unknown'].includes(v)))return false;}

  if(ex.type!=='mechanism'&&t.chain.length)return false;

  else if(t.committed)return false;
  return true;
 }catch(_){return false;}
}

let S;

function nextCase(realm){const items=regular.filter(c=>c.realm===realm);return items.find(c=>!S.completed[c.id])||items.slice().sort((a,b)=>(S.completed[a.id]?.stars||0)-(S.completed[b.id]?.stars||0)||(S.completed[a.id]?.lastAt||0)-(S.completed[b.id]?.lastAt||0))[0];}
function dailyQueue(){const seed=[...isoDay()].reduce((n,c)=>n*31+c.charCodeAt(0),7)>>>0;const priority=c=>{const x=S.completed[c.id];if(x?.recall?.due<=Date.now())return x.recall.rate-5;if(!x)return -1;return x.stars;};const ranked=regular.slice().sort((a,b)=>priority(a)-priority(b)||((hash(a.id)+seed)%1009)-((hash(b.id)+seed)%1009));const used=new Set();return ranked.filter(c=>{if(used.has(c.realm))return false;used.add(c.realm);return true;}).slice(0,3).map(c=>c.id);}

function hash(s){let n=0;for(const c of s)n=(n*31+c.charCodeAt(0))>>>0;return n;}
function startRun(kind,id){
 if(S.active){showModal('一盏尚未走完的灯',`<p>你还有一段旅程停在「${e(byId[S.active.step.id]?.title)}」。开始新旅程会替换这段进行中的行程，已经收入镜册的记录会保留。</p><div class="modal-actions"><button class="btn" data-action="resume-modal">继续原旅程</button><button class="btn primary" data-action="replace-run" data-kind="${kind}" data-id="${e(id||'')}">开始新旅程</button></div>`);return;}
 beginRun(kind,id);
}
function beginRun(kind,id){
 closeModal();let queue;
 if(kind==='tower'){if(!eligibleTower()){toast('四座镜门各走过一幕后，再来登塔。');return;}queue=window.FINALE_CASES.map(c=>c.id);}
 else if(kind==='free'&&byId[id])queue=[id];
 else if(kind==='quick')queue=[nextCase(realms.slice().sort((a,b)=>realmCount(a)-realmCount(b))[0]).id];
 else if(kind==='daily')queue=dailyQueue();
 else {kind='journey';queue=realms.map(r=>nextCase(r).id);}
 S.active={kind,queue,index:0,phase:kind==='tower'?'lens':'investigate',light:8,trust:5,time:queue.length+(queue.length>1?Math.ceil(queue.length/2):1),history:[],step:makeStep(queue[0])};S.seenIntro=true;visit();save();navigate('play');
}
function makeStep(id){const c=byId[id],ex=c.exercise;const pool=ex.type==='mechanism'?shuffle([...ex.chain,...ex.decoys]):ex.type==='listening'?shuffle(ex.statements.map((s,i)=>i)):ex.type==='uncertainty'?shuffle([...ex.known.map(text=>({text,category:'known'})),{text:ex.unknown,category:'unknown'}]):shuffle(ex.items.map((_,i)=>i));return{id,opened:[],budget:2,order:shuffle(c.choices.map(x=>x.id)),answers:{},pool,chain:[],experimentOrder:shuffle((window.MIRROR_EXPERIMENTS?.[id]?.options||[]).map(x=>x.id)),confidence:50,initialConfidence:50,confidenceTouched:false,selected:null,exerciseChecked:false,exerciseScore:0,exerciseFirst:null,exEvidence:[],answer:'',revealed:false,committed:false,lens:null};}
function phase(n){S.active.phase=n;save();navigate('play');}
function renderRunbar(a){return `<div class="runbar"><div class="runpath">${a.queue.map((id,i)=>`<span class="node ${i===a.index?'current':i<a.index?'done':''}"><i>${i<a.index?'✓':i+1}</i><span>${a.kind==='tower'?'第'+(i+1)+'幕':R[byId[id].realm].name}</span></span>${i<a.queue.length-1?'<span class="dash"></span>':''}`).join('')}</div><div class="run-stats"><span title="故事中的照明状态，不是人的能力分">灯火<b>${a.light}</b></span><span title="故事中团队的信任状态">信任<b>${a.trust}</b></span><span class="time-stat" title="调查和推进消耗的故事时机">时机<b>${a.time}</b></span></div></div>`;}
function renderPlay(){const a=S.active;if(!a)return renderMap();const t=a.step,c=byId[t.id],r=R[c.realm],isLens=a.phase==='lens';let body='';const fns={lens:renderLens,investigate:renderInvestigate,exercise:renderExercise,decision:renderDecision,result:renderResult,reflect:renderReflect};body=fns[a.phase](c,t,a);return `<section class="play-page page" style="--realm:${isLens?'#dfc497':r.color}">${backdrop('mission')}<div class="play-inner">${renderRunbar(a)}${storeWarning()}<div class="mission-layout"><aside class="mission-aside"><div class="eyebrow">${a.kind==='tower'?'THE LAST LIGHT · 联合试炼':`MIRROR ${r.roman} · ${r.label}`}</div><h1 class="serif">${e(c.title)}</h1><div class="setting">${e(c.setting)}</div><p class="brief">${e(c.brief)}</p><div class="stakes"><span>此刻的代价</span>${e(c.stakes)}</div><div class="speaker"><div class="who">${e(c.speaker)}</div>“${e(c.line)}”</div></aside><section class="stage-panel" aria-label="当前游戏操作">${body}</section></div><div class="game-content-note">合成情境 · ${a.kind==='tower'?'灯塔之夜':'回声之城'}<span aria-hidden="true">　/　</span><button class="text-btn" data-action="pause" style="font-size:10px">暂离，保留进度</button></div></div></section>`;}
function renderLens(c,t){return `<div class="stage-kicker">先认出这一刻</div><h2>你先举起哪一面镜子？</h2><p class="stage-description">四面镜子可能同时有用。先找出当前最需要处理的压力，再进入现场。</p><div class="lens-grid">${realms.map(r=>`<button class="lens-btn" style="--realm:${R[r].color}" data-action="lens" data-realm="${r}"><span class="realm-symbol">${R[r].symbol}</span><span class="label">${R[r].label}<small>${r==='fog'?'信息缺口与行动边界':r==='echo'?'主张、依据与自我分离':r==='archive'?'当时的信息与可控动作':'变量、过程与验证'}</small></span></button>`).join('')}</div><p class="subtle" style="margin-top:22px">没有人需要在所有时刻都完美。这里只练“认出这个时刻”。</p>`;}
function renderInvestigate(c,t){return `<div class="stage-kicker"><span>01 / 走近现场</span><span class="counter">查证机会 ${t.budget}${[0,1].map(i=>`<i class="${i<t.budget?'on':''}"></i>`).join('')}</span></div><h2>先看什么，再作判断？</h2><p class="stage-description">点开你认为关键的线索。每幕前两条不额外消耗时机；多查一条占用一格余量。至少核对一条，再带着仍有的缺口进入下一步。</p><div class="clue-grid">${c.clues.map((q,i)=>`<button class="clue ${t.opened.includes(q.id)?'opened':''}" data-action="clue" data-id="${q.id}" aria-pressed="${t.opened.includes(q.id)}"><span class="clue-symbol">${['▱','⌕','⌘'][i]}</span><b>${e(q.label)}</b><small>${t.opened.includes(q.id)?'已收入现场记录':t.budget>0?'查看线索':'查看 · 时机 −1'}</small></button>`).join('')}</div>${t.opened.length?t.opened.map(id=>{const q=c.clues.find(x=>x.id===id);return `<article class="evidence-note"><h3>${e(q.headline)}</h3><p>${e(q.body)}</p></article>`;}).join(''):'<div class="empty-evidence">此刻，你拥有的是故事的第一面。<br>点一张线索卡，看看另一面。</div>'}<div class="panel-footer"><span class="subtle">已看 ${t.opened.length}/3 条线索<br>知道缺什么，也是调查的一部分。</span><button class="btn primary" data-action="to-exercise" ${t.opened.length?'':'disabled'}>整理我的判断 <span>→</span></button></div>`;}
function readClue(id){const a=S.active,t=a.step,c=byId[t.id];if(t.opened.includes(id)){document.querySelectorAll('.evidence-note').forEach(x=>x.classList.remove('flash'));toast('这条线索已经在下方记录中。');return;}if(!c.clues.some(x=>x.id===id))return;if(t.budget>0)t.budget--;else if(a.time>a.queue.length-a.index){a.time--;toast('多查一条线索，额外时机 −1。');}else{toast('额外查证时机已用完。为后面的行动留一格，把未知如实保留下来。');return;}t.opened.push(id);save();navigate('play',{keepScroll:true});}
function renderExercise(c,t){const ex=c.exercise;let content='';
 if(ex.type==='uncertainty')content=`<h2>给判断留出边界</h2><p class="stage-description">先看这句话是核实过的事实、尚未核对的转述，还是一个未解问题。依据来自你实际打开的线索。</p>${t.pool.map((item,i)=>`<div class="exercise-item"><p>${e(item.text)}</p>${renderEvidenceSources(c,t,item)}<div class="chip-row">${[['known','已核实事实'],['unverified','待核对说法'],['unknown','未解问题']].map(([v,l])=>`<button class="chip ${t.answers[i]===v?'selected':''} ${t.exerciseChecked&&expectedCategory(c,t,item)===v?'correct':''} ${t.exerciseChecked&&t.answers[i]===v&&expectedCategory(c,t,item)!==v?'wrong':''}" data-action="sort" data-index="${i}" data-value="${v}" ${t.exerciseChecked?'disabled':''}>${l}</button>`).join('')}</div></div>`).join('')}<div class="calibration"><p class="claim">你觉得这句话成立的可能性有多大？<br><span class="gold">“${e(ex.claim)}”</span></p><div class="range-line"><input type="range" min="0" max="100" step="5" value="${t.confidence}" id="confidence" aria-label="对当前结论的主观把握" ${t.exerciseChecked?'disabled':''}><output id="confidence-output">${t.confidence}%</output></div><div class="range-labels"><span>很难成立</span><span>很可能成立</span></div><p class="subtle" style="margin-top:12px;font-size:10px">主观把握练习，数字不是实测概率。不会因选择某个百分比获得镜片。</p></div>`;
 else if(ex.type==='listening')content=`<h2>先让对方认出自己</h2><p class="stage-description">${e(ex.prompt)}<br>不是替对方加码，也不是悄悄把他变成一个标签。</p><div class="option-list">${t.pool.map((index,i)=>`<button class="option ${t.answers.listen===index?'selected':''}" data-action="listen" data-index="${index}" ${t.exerciseChecked?'disabled':''}><span class="letter">${String.fromCharCode(65+i)}</span><span class="option-text">${e(ex.statements[index].text)}</span></button>`).join('')}</div>`;
 else if(ex.type==='attribution')content=`<h2>把过去放回原位</h2><p class="stage-description">${e(ex.prompt)}<br>根据现在拿到的记录回看当时：区分自己能改的动作、已确认的外部条件，以及至今仍缺证据的结论。</p>${t.pool.map((index,i)=>`<div class="exercise-item"><p>${e(ex.items[index].text)}</p><div class="chip-row">${[['control','当时能改变'],['external','已确认外因'],['unknown','仍缺证据']].map(([v,l])=>`<button class="chip ${t.answers[index]===v?'selected':''} ${t.exerciseChecked&&ex.items[index].category===v?'correct':''} ${t.exerciseChecked&&t.answers[index]===v&&ex.items[index].category!==v?'wrong':''}" data-action="sort" data-index="${index}" data-value="${v}" ${t.exerciseChecked?'disabled':''}>${l}</button>`).join('')}</div></div>`).join('')}`;
 else if(ex.type==='mechanism')content=`<h2>让齿轮真正连起来</h2><p class="stage-description">${e(ex.prompt)}<br>依次点选三个节点，组成“条件 → 过程 → 结果”。点已放入的节点可撤回。</p><div class="chain-slots">${[0,1,2].map((_,i)=>`<button class="chain-slot ${t.chain[i]!==undefined?'filled':''}" data-action="chain-remove" data-index="${i}" ${t.exerciseChecked?'disabled':''}><small>${num(i+1)}</small>${t.chain[i]!==undefined?e(t.pool[t.chain[i]]):['什么条件','怎样影响','什么结果'][i]}</button>${i<2?'<span class="chain-arrow">→</span>':''}`).join('')}</div><div class="node-pool">${t.pool.map((text,i)=>`<button class="node-pill" data-action="chain-add" data-index="${i}" ${t.chain.includes(i)||t.exerciseChecked?'disabled':''}>${e(text)}</button>`).join('')}</div>${renderExperiment(c,t)}`;
 const count=exerciseComplete(c,t);let feedback='';if(t.exerciseChecked){let explanation=ex.explanation||'把已经确认的事实与缺失信息分开。没有证据填补的部分，不必用笃定语气填上。';if(ex.type==='uncertainty'){explanation+=` 你记下了 ${t.confidence}% 的主观把握。这不是一道猜标准概率的题：请问自己，哪一条证据支撑它？出现什么新信息时，你会改变把握？证据已经充分的部分，也可以明确行动。`;}feedback=`<div class="exercise-feedback"><strong>${t.exerciseScore===1?'这一块，拼得清楚。':'这里有一处值得再看。'}</strong>${e(explanation)}${ex.type==='mechanism'?`<div style="margin-top:12px;color:var(--gold)">参考链条：${ex.chain.map(e).join(' → ')}</div><div style="margin-top:12px">下一步验证：${e(ex.experiment)}</div>`:''}${ex.type==='mechanism'?experimentFeedback(c,t):''}${ex.type==='listening'&&t.exerciseScore!==1?`<div style="margin-top:12px;color:var(--gold)">准确复述：${e(ex.statements.find(x=>x.correct).text)}</div>`:''}</div>`;}
 return `<div class="stage-kicker">02 / 把道理做一遍</div>${content}${feedback}<div class="panel-footer"><button class="text-btn" data-action="back-investigate">← 回看线索</button><button class="btn primary" data-action="${t.exerciseChecked?'to-decision':'check-exercise'}" ${!t.exerciseChecked&&!count?'disabled':''}>${t.exerciseChecked?'现在作出决定 →':'检查这一步 →'}</button></div>`;
}
function renderExperiment(c,t){const addon=window.MIRROR_EXPERIMENTS?.[c.id];if(!addon)return '';return `<div class="experiment-box"><h3>再走一步：你怎么检验它？</h3><p class="stage-description">${e(addon.question)}</p>${addon.hypotheses.map((h,i)=>`<div class="hypothesis">解释 ${i+1} · ${e(h)}</div>`).join('')}<div class="option-list">${t.experimentOrder.map((id,i)=>{const o=addon.options.find(x=>x.id===id);return `<button class="option ${t.answers.experiment===id?'selected':''}" data-action="experiment" data-id="${id}" ${t.exerciseChecked?'disabled':''}><span class="letter">${String.fromCharCode(65+i)}</span><span class="option-text">${e(o.text)}</span></button>`;}).join('')}</div></div>`;}
function experimentFeedback(c,t){const addon=window.MIRROR_EXPERIMENTS?.[c.id];if(!addon)return '';const chosen=addon.options.find(x=>x.id===t.answers.experiment),best=addon.options.find(x=>x.correct);return `<div style="margin-top:17px;padding-top:15px;border-top:1px solid var(--line)"><strong>你选择的检验${chosen?.correct?'抓住了区分条件':'还需要补上条件'}</strong>${e(chosen?.why||'')}${!chosen?.correct?`<p style="margin-top:10px">更有区分力的做法：${e(best.text)}</p>`:''}</div>`;}
function sourceIds(c,item){const i=c.exercise.known?.indexOf(item.text);return i>=0?(window.MIRROR_EVIDENCE_SOURCES?.[c.id]?.[i]||[]):[];}
function expectedCategory(c,t,item){if(item.category==='unknown')return 'unknown';const opened=t.exerciseChecked?t.exEvidence:t.opened;return sourceIds(c,item).every(id=>opened.includes(id))?'known':'unverified';}
function renderEvidenceSources(c,t,item){if(item.category==='unknown')return '';const ids=sourceIds(c,item);if(!ids.length)return '<p class="subtle" style="font-size:10px;margin-top:-5px">来自现场已经说明的记录</p>';return '<div class="chip-row" style="margin-bottom:12px">'+ids.map(id=>{const q=c.clues.find(x=>x.id===id),seen=t.opened.includes(id);return `<button class="chip ${seen?'selected':''}" data-action="exercise-clue" data-id="${id}" ${seen||t.exerciseChecked?'disabled':''}>${seen?'✓ 已核对':'⌕ 核对来源'} · ${e(q.label)}${!seen?(t.budget>0?'':' · 时机 −1'):''}</button>`;}).join('')+'</div>';}
function exerciseComplete(c,t){const ex=c.exercise;if(ex.type==='listening')return Number.isInteger(t.answers.listen);if(ex.type==='mechanism')return t.chain.length===3&&(!window.MIRROR_EXPERIMENTS?.[c.id]||window.MIRROR_EXPERIMENTS[c.id].options.some(x=>x.id===t.answers.experiment));if(ex.type==='uncertainty')return t.pool.every((_,i)=>['known','unverified','unknown'].includes(t.answers[i]));return ex.items.every((_,i)=>['control','external','unknown'].includes(t.answers[i]));}
function evaluateExercise(c,t){const ex=c.exercise;if(ex.type==='listening')return ex.statements[t.answers.listen]?.correct?1:0;if(ex.type==='mechanism'){const addon=window.MIRROR_EXPERIMENTS?.[c.id];return (t.chain.filter((index,i)=>t.pool[index]===ex.chain[i]).length+(addon?(addon.options.find(x=>x.id===t.answers.experiment)?.correct?1:0):0))/(addon?4:3);}if(ex.type==='uncertainty')return t.pool.filter((item,i)=>t.answers[i]===expectedCategory(c,t,item)).length/t.pool.length;return ex.items.filter((item,i)=>t.answers[i]===item.category).length/ex.items.length;}
function checkExercise(){const a=S.active,t=a.step,c=byId[t.id];if(!exerciseComplete(c,t)){toast('先把这一步完成，再展开反馈。');return;}t.exEvidence=t.opened.slice();t.exerciseScore=evaluateExercise(c,t);if(t.exerciseFirst===null)t.exerciseFirst=t.exerciseScore;t.exerciseChecked=true;save();tone(t.exerciseScore===1?'success':'soft');navigate('play',{keepScroll:true});}
function renderDecision(c,t){return `<div class="stage-kicker">03 / 选择会留下回声</div><h2>接下来，你怎么做？</h2><p class="stage-description">选一项你愿意承担后果的行动。你已经看过 ${t.opened.length} 条线索；漂亮的措辞，不能代替具体做法。</p><div class="option-list">${t.order.map((id,i)=>{const q=c.choices.find(x=>x.id===id);return `<button class="option ${t.selected===id?'selected':''}" data-action="choose" data-id="${id}" aria-pressed="${t.selected===id}"><span class="letter">${String.fromCharCode(65+i)}</span><span class="option-text">${e(q.text)}</span><span class="arrow">↗</span></button>`;}).join('')}</div><p class="choice-warning">先选，再确认。故事中的后果将随这次决定展开。</p><div class="panel-footer"><button class="text-btn" data-action="back-exercise">← 回看刚才的练习</button><button class="btn primary" data-action="commit" ${!t.selected?'disabled':''}>就这样做 <span>→</span></button></div>`;}
function commitChoice(){const a=S.active,t=a.step,c=byId[t.id],q=c.choices.find(x=>x.id===t.selected);if(!q||t.committed)return;t.committed=true;const precision=t.exerciseFirst??0;const shards=(q.quality===2?2:q.quality===1?1:0)+(precision===1?1:0);t.stars=shards;a.light=clamp(a.light+(q.quality===2?2:q.quality===0?-2:0),0,30);a.trust=clamp(a.trust+(q.quality===2?1:q.quality===0?-1:0),0,20);a.time=Math.max(0,a.time-1);const old=S.completed[c.id];S.completed[c.id]={stars:Math.max(old?.stars||0,shards),quality:q.quality,attempts:(old?.attempts||0)+1,firstAt:old?.firstAt||Date.now(),lastAt:Date.now(),choice:q.id,exercise:precision,recall:old?.recall||null};unlockCards(c);save();tone(q.quality===2?'success':'soft');phase('result');}
function renderResult(c,t){const q=c.choices.find(x=>x.id===t.selected),title=q.quality===2?'灯光比刚才稳了一些。':q.quality===1?'光进来了，也留下了缝隙。':'回声，暂时盖过了现场。';return `<div class="stage-kicker">04 / 世界回应了你</div><div class="result-seal">${q.quality===2?'✧':q.quality===1?'◐':'◌'}</div><h2 class="serif">${title}</h2><p class="result-narrative">${e(q.consequence)}</p><div class="feedback-box"><b>这一幕真正发生的事</b>${e(q.why)}</div><div class="result-tags"><span class="result-tag">这次收集 ${t.stars} / 3 枚镜片</span><span class="result-tag">灯火 ${q.quality===2?'+2':q.quality===0?'−2':'不变'}</span><span class="result-tag">信任 ${q.quality===2?'+1':q.quality===0?'−1':'不变'}</span></div><div class="tip"><b>下次可以做得更具体：</b>${e(q.next)}</div><details class="branch-details"><summary>如果当时换一个选择，会怎样？</summary>${c.choices.filter(x=>x.id!==q.id).map(x=>`<article><h3>${e(x.text)}</h3><p>${e(x.consequence)}</p><p style="margin-top:8px">${e(x.why)}</p></article>`).join('')}</details><div class="panel-footer"><span class="subtle">故事后果用于练习，不是现实预测。<br>镜片来自行动与练手，不评价你这个人。</span><button class="btn primary" data-action="to-reflect">把这盏灯带走 <span>→</span></button></div>`;}
function renderReflect(c,t,a){return `<div class="stage-kicker">05 / 收起选项，还剩下什么？</div><h2>现在，换你来说。</h2><p class="stage-description">用自己的话说一次。写下来，或先在心里完整说完，再打开参照。</p><p class="reflection-prompt serif">${e(c.mirror.prompt)}</p><label class="sr-only" for="reflection-answer">我的回忆与现实用法</label><textarea id="reflection-answer" placeholder="不用复述原句。说一个你下次真的能做出来的动作……" maxlength="1800">${e(t.answer)}</textarea>${!t.revealed?`<div class="panel-footer"><span class="subtle">答案由你对照，不做自动文字评分。</span><button class="btn primary" data-action="reveal-reflect">我先想过了，展开参照 →</button></div>`:`<div class="answer-panel"><div class="anchor serif">${e(c.mirror.anchor)}</div><p>${e(c.mirror.answer)}</p></div><p class="subtle" style="margin-top:18px">诚实选一个，会影响它下次出现的时间。</p>${ratingButtons('rate-reflect')}<p class="rating-note">${a.index<a.queue.length-1?'对照完成后，将进入下一面镜子。':'对照完成后，收入镜册并结束这一程。'} 此幕初次「能说清」安排到明天，模糊的更早回看。概念镜卡另做独立回忆。</p>`}`;}
function ratingButtons(action){return `<div class="rate-row"><button class="rate-btn" data-action="${action}" data-rate="0">还没想起来<small>很快再遇见</small></button><button class="rate-btn" data-action="${action}" data-rate="1">想起来一部分<small>约 6 小时后再练</small></button><button class="rate-btn" data-action="${action}" data-rate="2">能说清、能举例<small>拉开时间再练</small></button></div>`;}
function unlockCards(c){const list=DECK.filter(x=>x.realm===c.realm||x.realm==='core');for(const card of list)if(!S.reviews[card.id])S.reviews[card.id]={level:0,due:Date.now(),count:0,lastAt:0,lapses:0,answer:''};}
function scheduleCard(id,rate,answer=''){const x=S.reviews[id]||{level:0,due:Date.now(),count:0,lastAt:0,lapses:0,answer:''};const oldDue=x.due,now=Date.now();x.count++;x.lastAt=now;if(answer)x.answer=safeText(answer,1800);if(rate===0){x.level=0;x.due=oldDue>now?Math.min(oldDue,now+10*60000):now+10*60000;x.lapses++;}else if(rate===1){x.level=Math.max(0,x.level-1);x.due=oldDue>now?Math.min(oldDue,now+6*3600000):now+6*3600000;}else if(x.count===1||oldDue<=now){x.level=Math.min(5,x.level+1);x.due=now+[1,1,3,7,14,30][x.level]*DAY;}else{x.due=oldDue;}S.reviews[id]=x;}
function finishReflect(rate){const a=S.active,t=a.step,c=byId[t.id];if(!t.revealed)return;S.reflections.push({caseId:c.id,text:safeText(t.answer),rate,at:Date.now()});S.reflections=S.reflections.slice(-250);scheduleCaseRecall(c.id,rate);a.history.push({id:c.id,quality:c.choices.find(x=>x.id===t.selected).quality,stars:t.stars,choice:t.selected,exercise:t.exerciseFirst});if(a.index<a.queue.length-1){a.index++;a.step=makeStep(a.queue[a.index]);a.phase=a.kind==='tower'?'lens':'investigate';save();navigate('play');}else{S.lastRun={kind:a.kind,history:a.history,light:a.light,trust:a.trust,time:a.time,at:Date.now()};S.active=null;save();tone('finish');navigate('ending');}}

function unlockedCards(){return DECK.filter(c=>S.reviews[c.id]);}
function dueCards(){return unlockedCards().filter(c=>S.reviews[c.id].due<=Date.now());}
function dueLabel(x){if(!x||x.count===0)return'第一次回忆';const d=x.due-Date.now();if(d<=0)return'现在可以复习';if(d<3600000)return Math.max(1,Math.ceil(d/60000))+'分钟后';if(d<DAY)return Math.ceil(d/3600000)+'小时后';return Math.ceil(d/DAY)+'天后';}
function cardRealm(c){return R[c.realm]||{name:'四镜之心',symbol:'◇',color:'#dfc497'};}
function streak(){const set=new Set(S.visits);let count=0,d=new Date();if(!set.has(isoDay(d)))d.setDate(d.getDate()-1);for(let i=0;i<500&&set.has(isoDay(d));i++){count++;d.setDate(d.getDate()-1);}return count;}
function renderMemory(){const cards=unlockedCards(),due=dueCards(),trained=cards.filter(c=>S.reviews[c.id].count>0),future=cards.filter(c=>S.reviews[c.id].due>Date.now());return `<section class="page-wrap page"><div class="page-heading"><div><div class="eyebrow">THE MEMORY CORRIDOR</div><h1 class="serif">让它在需要时，想得起来。</h1><p>先从记忆里取出做法，再看参照。模糊的早点重逢，清楚的隔一段时间再见。</p></div><button class="btn small" data-action="map">返回城图 ↗</button></div>${storeWarning()}<div class="memory-grid"><div class="memory-stat"><div class="value">${num(due.length)}</div><h2>现在可以回忆</h2></div><div class="memory-stat"><div class="value">${num(trained.length)}</div><h2>已亲自对照过的镜卡</h2></div><div class="memory-stat"><div class="value">${num(streak())}</div><h2>连续来过的天数</h2></div><div class="memory-stat"><div class="value">${num(S.habits.filter(h=>h.done).length)}</div><h2>记录过结果的现实尝试</h2></div></div><div class="memory-start"><article class="card"><div class="eyebrow">CLOSE THE OPTIONS</div><h2 class="serif">没有选项的时候，<br>你还会怎样回答？</h2><p>${cards.length?'每次取出最多五张。先完整说一遍或写下来，再自己对照。这里不根据文采给你打分。':'先走过一幕故事，镜卡就会进入这条回廊。每座镜门都有四张练习卡，还有四张文章主线卡。'}</p><button class="btn primary" data-action="start-review" ${cards.length?'':'disabled'}>${due.length?'开始回忆 · '+Math.min(5,due.length)+' 张':cards.length?'提前练习 · 3 张':'先去经历一个故事'} <span>→</span></button>${!cards.length?'<button class="text-btn" data-action="quick" style="margin-left:20px">先玩一幕 ↗</button>':''}</article><article class="card"><div class="eyebrow">A NEW CONTEXT</div><h2 class="serif">道理不变，<br>换一个现场试试。</h2><p>三幕交错练习优先挑选已到回看时间的故事，以及你还没练稳的应对。认出“这次该怎么做”，比认出一个熟悉答案更有用。</p><button class="btn" data-action="daily">今日混合挑战 →</button></article></div><div class="section-title">随时间重逢的镜卡 <span class="subtle">${cards.length}/20 已收集</span></div>${cards.length?`<div class="memory-list">${cards.slice().sort((a,b)=>S.reviews[a.id].due-S.reviews[b.id].due).map(c=>{const r=cardRealm(c),s=S.reviews[c.id];return `<div class="memory-row" style="--realm:${r.color}"><span class="realm-symbol">${r.symbol}</span><div class="card-info"><h3>${e(c.title)}</h3><p>${r.name} · 已对照 ${s.count} 次</p></div><span class="due-label">${dueLabel(s)}</span><button data-action="review-card" data-id="${c.id}">回忆 ↗</button></div>`;}).join('')}</div>`:'<div class="empty-state">这条回廊还很安静。<br>你在城里点亮的第一面镜子，会在这里留下记忆。</div>'}<div class="tip" style="margin-top:25px"><b>不用等通知：</b>到期镜卡会在你打开游戏时出现。当前进度保存在这个浏览器中；换设备时，用设置里的导出／导入存档。重复提前练习不会不断推远已经安排的复习。</div><details class="learning-details"><summary>这里的记忆安排是怎么回事？</summary><div class="detail-body"><p>游戏把主动回忆、答案对照、隔时再练和换情境应用组合起来。默认安排是：没想起，约10分钟后；有点模糊，约6小时后；能说清，依练习记录逐步安排到1、3、7、14、30天后。这是一套便于使用的游戏规则，不是为你测出的最优记忆周期。</p><p>它的目标是帮助你反复提取和使用文章中的做法，不能保证永久不忘；复习记录也不能代替现实中的应用效果。</p><p>研究线索：<a href="https://pubmed.ncbi.nlm.nih.gov/16507066/" target="_blank" rel="noopener noreferrer">Roediger & Karpicke（2006），主动回忆与延迟保持</a>；<a href="https://pubmed.ncbi.nlm.nih.gov/17576148/" target="_blank" rel="noopener noreferrer">Karpicke & Roediger（2007），提取间隔的实验比较</a>。具体天数安排由本游戏设计，并非上述论文直接验证。</p></div></details></section>`;}
function startReview(id){const cards=id?DECK.filter(c=>c.id===id&&S.reviews[c.id]):dueCards().slice().sort((a,b)=>S.reviews[a.id].due-S.reviews[b.id].due).slice(0,5);const use=cards.length?cards:unlockedCards().slice().sort((a,b)=>S.reviews[a.id].due-S.reviews[b.id].due).slice(0,3);if(!use.length){toast('先走过一幕故事，再到回廊里回忆。');return;}reviewSession={queue:use.map(x=>x.id),index:0,answer:'',revealed:false,ratings:[],promptIndex:Math.floor(Math.random()*2)};visit();save();navigate('review');}
function renderReview(){const v=reviewSession;if(!v)return renderMemory();const c=DECK.find(x=>x.id===v.queue[v.index]),r=cardRealm(c);return `<section class="page-wrap page" style="--realm:${r.color}"><div class="recall-layout"><div class="recall-bar"><button class="text-btn" data-action="memory">← 回到回廊</button><span>第 ${v.index+1} / ${v.queue.length} 张</span></div><div class="recall-progress"><div style="width:${v.index/v.queue.length*100}%"></div></div><div class="stage-panel"><div class="stage-kicker">${r.symbol} ${r.name} · 先回忆，再对照</div><h2>${e(c.title)}</h2><p class="reflection-prompt serif">${e(c.prompts[(v.promptIndex+v.index)%c.prompts.length])}</p><p class="stage-description">先用自己的话回答，最好加一个现实例子。写下来或在心里完整说一遍，都可以。</p><label class="sr-only" for="review-answer">我的回忆答案</label><textarea id="review-answer" maxlength="1800" placeholder="先别看答案。此时此刻，你记得的做法是……">${e(v.answer)}</textarea>${v.revealed?`<div class="answer-panel"><div class="anchor serif">${e(c.anchor)}</div><p>${e(c.answer)}</p></div><p class="subtle" style="margin-top:19px">和参照比较后，诚实选一项。不是让模型给你打分。</p>${ratingButtons('rate-review')}<p class="rating-note">先前安排：${dueLabel(S.reviews[c.id])}。到期再练清楚，才会拉长间隔。</p>`:`<div class="panel-footer"><span class="subtle">不要求原句，重点是关键动作。</span><button class="btn primary" data-action="reveal-review">展开参照 →</button></div>`}</div></div></section>`;}
function rateReview(rate){const v=reviewSession;if(!v||!v.revealed)return;const id=v.queue[v.index];scheduleCard(id,rate,v.answer);v.ratings.push(rate);save();if(v.index<v.queue.length-1){v.index++;v.answer='';v.revealed=false;navigate('review');}else{const n=v.queue.length,clear=v.ratings.filter(x=>x===2).length;reviewSession=null;navigate('memory');showModal('记忆的灯，添过油了。',`<p>刚才亲自回忆了 <span class="gold">${n} 张</span>镜卡，其中 ${clear} 张，你自评能说清并举例。还模糊的内容已经安排早点再见。</p><p style="margin-top:14px">下一步可以换个场景使用它，或者离开游戏，在现实里做一个小动作。</p><div class="modal-actions"><button class="btn" data-action="close">留在回廊</button><button class="btn primary" data-action="habit-new">写一个现实动作 →</button></div>`);}}
function renderJournal(){return `<section class="page-wrap page"><div class="page-heading"><div><div class="eyebrow">YOUR POCKET MIRRORS</div><h1 class="serif">读过的，慢慢长成自己的。</h1><p>这里放着文章的主线、你亲口说出的理解，以及准备带进现实的下一步。</p></div><button class="btn small" data-action="export-journal">导出镜册 ↗</button></div><div class="journal-intro"><article class="quote-card"><div class="eyebrow">THE HEART OF THE ARTICLE</div><h2 class="serif">话术让你复述。<br><span class="gold">认知让你应对。</span></h2><p>读过什么书、记住多少概念，能说明一部分经历，却不能直接证明判断与行动的质量。文章把注意力转向四种有压力的时刻：未知、异见、过去，以及一件具体的事。</p></article><article class="quote-card"><div class="eyebrow">THE MIRROR FACES YOU</div><h2 class="serif">这四面镜子，<br><span class="gold">先照向自己。</span></h2><p>你正在练的是一种应对，而不是证明自己属于某种“认知等级”。也不要把一场争论、一句回答变成对整个人的定论。能发现自己需要修正的地方，就有了继续练的入口。</p></article></div><div class="mirror-summary">${realms.map(r=>`<article class="summary-card" style="--realm:${R[r].color}"><div class="stage-kicker">${R[r].symbol} MIRROR ${R[r].roman}</div><h2>${R[r].label} · ${R[r].verb}</h2><p>${R[r].core}</p><p class="phrase">${R[r].phrase}</p><div class="boundary">${R[r].boundary}</div></article>`).join('')}</div><section class="journal-section"><div class="section-heading"><h2 class="serif">把它带到现实里</h2><button class="btn small" data-action="habit-new">＋ 写一个小动作</button></div><p class="subtle" style="margin-bottom:18px">写明“遇到什么时，先做什么”，发生以后回来留一句结果。只有你能确认是否真的做过。</p>${S.habits.length?S.habits.slice().reverse().map(h=>`<article class="note-card"><div class="date"><span>${dateText(h.at)} · ${R[h.realm].label}</span><span>${h.done?'已记录结果':'等待一个现实的时刻'}</span></div><h3>当 ${e(h.trigger)}</h3><p>我先 ${e(h.action)}</p>${h.check?`<p class="subtle">怎样检查：${e(h.check)}</p>`:''}${h.result?`<div class="divider" style="margin:13px 0"></div><p>${e(h.result)}</p>`:''}<button class="small-action" data-action="habit-result" data-id="${h.id}">${h.done?'修改这次记录':'事情发生了，记下结果'} ↗</button></article>`).join(''):'<div class="empty-state">例如：当我又想说“他根本不懂”时，<br>我先用一句话复述他真正担心的事。</div>'}</section><section class="journal-section"><div class="section-heading"><h2 class="serif">你自己的说法</h2><span class="subtle">${S.reflections.filter(x=>x.text.trim()).length} 条文字记录</span></div>${S.reflections.filter(x=>x.text.trim()).length?S.reflections.filter(x=>x.text.trim()).slice(-20).reverse().map(n=>`<article class="note-card"><div class="date"><span>${dateText(n.at)} · ${R[byId[n.caseId].realm].name}</span><span>${['还没想起','部分想起','能说清楚'][n.rate]}</span></div><h3>${e(byId[n.caseId].title)}</h3><p>${e(n.text)}</p></article>`).join(''):'<div class="empty-state">每一幕结束时，写下你自己的理解。<br>它会留在这里，而不只是留在选项里。</div>'}</section><details class="learning-details"><summary>改编说明、计分与学习边界</summary><div class="detail-body"><p>内容根据你提供的文章改编，人物、城市与剧情均为合成。游戏保留四种应对的主线，并补上适用边界：理解不等于同意、未知不等于停摆、认错不等于全盘自责、机制不等于已经证实的因果。</p><p>每幕最多三枚镜片：操作练习的首次完整判断获得一枚，具体行动按题设的证据与代价获得零至两枚。重玩保留最高镜片，最新决定仍进入复盘。灯火、信任、时机仅是这一程的故事状态，不是心理测量或对人的分级。</p><p>开放文字采用自我对照，没有后台模型评分。存档在当前浏览器，页面不发送你的复盘文字。游戏没有永久记忆保证，真正掌握还要看隔一段时间能否想起，以及现实中能否做出来。</p><p>文章里的几个词，可以这样落地：“模糊耐受”是缺信息时不急着填答案；“自我服务偏差”提醒我们别把成功都归自己、失败都归环境；“认知颗粒度”是从评价走向事实，再解释变量如何影响结果。游戏把它们当作自查入口，不当作给人定级的量表。</p><p>学习设计参考：<a href="https://pubmed.ncbi.nlm.nih.gov/16507066/" target="_blank" rel="noopener noreferrer">主动回忆与延迟保持（2006）</a>；<a href="https://pubmed.ncbi.nlm.nih.gov/17576148/" target="_blank" rel="noopener noreferrer">提取练习间隔的比较（2007）</a>。游戏的具体间隔和积分规则是设计选择。</p></div></details><p class="footer-note">四镜 · 回声之城　/　V1.0　/　为晓斌的阅读与实践而作</p></section>`;}
function renderEnding(){const v=S.lastRun;if(!v)return renderMap();const score=v.history.reduce((n,x)=>n+x.quality,0),max=v.history.length*2,good=score>=max*.75;const title=v.kind==='tower'?(good?'今夜，城灯重新亮起。':'灯还没有全亮，路已经看见。'):v.history.length===1?'你带回来一小束光。':good?'这一程，灯光比来时更稳。':'带着还没想清的部分，继续走。';const copy=v.kind==='tower'?'你经历了催促、质疑、旧日失误与混乱现象。留下来的不该只有四句漂亮话，而是在这些时刻先做哪一步。':v.history.length===1?'刚才的选择有了后果，文章里的一个做法也有了具体的样子。下次在另一个场景里认出它，才会慢慢变成自己的应对。':`同一篇文章，刚才变成了 ${v.history.length} 次不同的应对。你不用永远正确；让证据进来，愿意修正，并且记得下一步怎么做。`;return `<section class="ending page"><div class="eyebrow">THE LIGHT YOU CARRY</div><h1 class="serif">${title}</h1><p class="ending-copy">${copy}</p><div class="ending-tokens">${realms.map(r=>`<div class="ending-token" style="--realm:${R[r].color};opacity:${v.history.some(x=>byId[x.id].realm===r)?1:.3}"><div class="realm-symbol"><span>${R[r].symbol}</span></div>${R[r].verb}</div>`).join('')}</div><div class="recap-grid">${v.history.map(x=>{const c=byId[x.id],r=R[c.realm],q=c.choices.find(o=>o.id===x.choice);return `<article class="recap-item" style="--realm:${r.color}"><h3>${r.name} · ${e(c.title)}</h3><p>${e(q?.next||c.mirror.answer)}</p><div style="margin-top:13px">${stars(x.stars)}</div></article>`;}).join('')}</div><p class="subtle">这一程的城灯 ${v.light} · 团队信任 ${v.trust} · 已收集镜片保留最高记录</p><div class="ending-actions"><button class="btn primary" data-action="${v.history.length===1?'journey':'memory'}">${v.history.length===1?'走一次完整的四镜巡游':'到记忆回廊再取出一次'} →</button><button class="btn" data-action="map">回到城图 ↗</button>${eligibleTower()&&v.kind!=='tower'?'<button class="btn" data-action="tower">进入灯塔之夜 ↗</button>':''}</div><div class="habit-cta"><h2 class="serif">明天，在哪个时刻用一次？</h2><p>把一句理解写成一件小事。事情发生后，再看看自己有没有做出来。</p><button class="text-btn gold" data-action="habit-new" style="margin-top:12px">写下我的下一步 ⟶</button></div><p class="footer-note">四面镜子是用来照见自己的。旅程没有终点，也不需要给别人排名。</p></section>`;}
function showModal(title,body){document.getElementById('modal-content').innerHTML=`<div class="modal-wrap"><div class="modal-head"><h2 class="serif">${e(title)}</h2><button class="close" data-action="close" aria-label="关闭弹窗">×</button></div>${body}</div>`;if(!modal.open)modal.showModal();}
function closeModal(){if(modal.open)modal.close();}
function showIntro(){showModal('今夜，城里只剩下回声。',`<p class="story-lede serif">人们仍会说漂亮的话。<br>但在需要判断的时刻，灯熄灭了。</p><p>你接过一盏灯，穿过四座镜门。每一幕，先查线索，再动手整理，最后作出决定。城市会回应你的选择。</p><div class="modal-list"><div class="item"><span class="count">01</span><div><h3>把道理变成操作</h3><p>整理未知、听懂异见、归位档案、拼接机制。</p></div></div><div class="item"><span class="count">02</span><div><h3>选择有后果，也能重来</h3><p>看懂为什么比一次选对更重要。每幕都能查看另一条路。</p></div></div><div class="item"><span class="count">03</span><div><h3>离开选项，带走一个动作</h3><p>自己说一遍；隔一段时间，再到记忆回廊里取出来。</p></div></div></div><div class="modal-actions"><button class="btn" data-action="intro-map">先看看城图</button><button class="btn primary" data-action="intro-start">接过这盏灯 →</button></div>`);}
function showHow(){showModal('怎么把这一程玩进心里',`<ol class="tutorial-list"><li><span class="gold">查现场：</span>选择两条最重要的线索；再多看一条，消耗一格故事时机。</li><li><span class="gold">动手练：</span>未知分清事实和缺口，异见准确复述，过去分清责任，机制连接三个节点。</li><li><span class="gold">作决定：</span>先选再确认。结果会解释这项行动的好处与漏洞，还能展开其他分支。</li><li><span class="gold">自己说：</span>收起选项以后回忆做法，自我对照。写下的话会进入随身镜册。</li><li><span class="gold">换时换地：</span>记忆回廊安排再练；今日挑战交错场景；四门各过一幕后可以登塔。</li></ol><div class="tip">所有节点都可点击，手机无需拖拽。桌面可用 Tab、Enter 操作，Esc 关闭弹窗。没有倒计时催你回答。</div><div class="modal-actions"><button class="btn primary" data-action="close">知道了，继续 →</button></div>`);}
function showSettings(){showModal('把这盏灯留好',`<p>进度自动保存在当前浏览器。换浏览器或换设备前，先导出存档。</p><div class="setting-row"><div><h3>环境声音</h3><p>轻声的和弦与操作回响，可随时关闭。</p></div><button class="switch ${audioOn?'on':''}" data-action="audio-settings" role="switch" aria-checked="${audioOn}" aria-label="环境声音"></button></div><div class="setting-row"><div><h3>减少动态</h3><p>让镜门与雾停下来，保留全部玩法。</p></div><button class="switch ${S.settings.reduced?'on':''}" data-action="reduced" role="switch" aria-checked="${S.settings.reduced}" aria-label="减少动态"></button></div><div class="setting-row"><div><h3>专注一会儿</h3><p>切换浏览器全屏显示。</p></div><button class="btn small" data-action="fullscreen">全屏 ↗</button></div><div class="modal-actions" style="justify-content:flex-start"><button class="btn" data-action="export-save">导出存档 ↓</button><button class="btn" data-action="import-save">导入存档 ↑</button><button class="btn" data-action="download-game">下载离线游戏 ↓</button></div><p class="subtle" style="margin-top:18px">${doneCount()} / 24 幕已走过 · ${S.habits.length} 个现实动作 · ${storageAvailable?'自动存档可用':'自动存档暂不可用，请导出备份'}</p><div class="divider"></div><button class="text-btn danger" data-action="reset-dialog">重新开始，清空本浏览器的全部记录</button>`);}
function habitNew(){closeModal();showModal('给明天留一个具体动作',`<p>小到能做出来，也清楚到能够检查。无需写成漂亮的格言。</p><form id="habit-form"><label class="field">我想练哪面镜子<select id="habit-realm">${realms.map(r=>`<option value="${r}">${R[r].label}</option>`).join('')}</select></label><label class="field">当什么情况发生时？<input class="text-input" id="habit-trigger" placeholder="例如：同事说我的方案有问题" maxlength="450" required></label><label class="field">我先做哪一个动作？<textarea id="habit-action" placeholder="例如：先复述他指出的具体问题，请他确认我有没有理解错" maxlength="700" required style="min-height:82px"></textarea></label><label class="field">事后怎么检查自己做到了？<input class="text-input" id="habit-check" placeholder="例如：我是否真的让对方讲完，并记录了一条新依据" maxlength="600"></label><div class="modal-actions"><button type="button" class="btn" data-action="close">先不写</button><button type="submit" class="btn primary">放进随身镜册 →</button></div></form>`);}
function habitResult(id){const h=S.habits.find(x=>x.id===id);if(!h)return;showModal('这件事，后来怎么样了？',`<p>当 ${e(h.trigger)}，你准备先 ${e(h.action)}。</p><form id="habit-result-form" data-id="${h.id}"><label class="field">实际做了什么？什么还没做到？<textarea id="habit-result" placeholder="记一次真实发生的尝试，也可以诚实写“这次还是急着反驳了”……" maxlength="1200" required>${e(h.result)}</textarea></label><p class="subtle">由你确认实际结果。写“没做到”也能成为下次的线索。</p><div class="modal-actions"><button type="button" class="btn" data-action="close">取消</button><button type="submit" class="btn primary">保存这次真实记录 →</button></div></form>`);}
function download(blob,name){const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);}
function exportSave(){const out={...S,active:null,lastRun:S.lastRun,exportedAt:new Date().toISOString(),app:'四镜·回声之城'};download(new Blob([JSON.stringify(out,null,2)],{type:'application/json;charset=utf-8'}),'四镜_游戏存档_'+isoDay()+'.json');toast('存档已导出。换设备后，在设置中导入。');}
function exportJournal(){const lines=['四镜 · 回声之城 | 我的随身镜册','导出日期：'+isoDay(),''];for(const r of realms)lines.push(R[r].label,R[r].core,R[r].phrase,'边界：'+R[r].boundary,'');lines.push('—— 我的现实动作 ——');for(const h of S.habits){lines.push(dateText(h.at)+' · '+R[h.realm].label,'当 '+h.trigger,'我先 '+h.action,'检查：'+h.check,'实际结果：'+(h.result||'尚未记录'),'');}lines.push('—— 我自己的说法 ——');for(const n of S.reflections.filter(x=>x.text.trim()))lines.push(dateText(n.at)+' · '+byId[n.caseId].title,n.text,'');lines.push('内容根据用户提供文章改编。情境均为合成。四面镜子先照自己，不为人分级。');download(new Blob([lines.join('\n')],{type:'text/plain;charset=utf-8'}),'四镜_我的随身镜册_'+isoDay()+'.txt');toast('随身镜册已导出。');}
async function downloadGame(){
 try{if(location.protocol==='file:'){toast('你已打开离线版。保留当前 HTML 文件，就能随时再玩。');return;}const response=await fetch(location.pathname+'?offline='+Date.now(),{cache:'no-store'});if(!response.ok)throw Error('download');const html=await response.text();if(!html.includes('four-mirrors-echo-city-v1')||!html.includes('FOG_ECHO_CASES'))throw Error('content');download(new Blob([html],{type:'text/html;charset=utf-8'}),'四镜_回声之城_V1.0.html');toast('离线游戏已下载。存档需要另行导出后带过去。');}catch(err){toast('下载没有完成。可以使用交付中的 HTML 文件。');}}
function setAudio(on){
 if(on){try{if(!audioContext){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)throw Error('audio unsupported');audioContext=new AC();audioGain=audioContext.createGain();audioGain.gain.value=.022;audioGain.connect(audioContext.destination);[130.813,195.998,261.626].forEach((f,i)=>{const o=audioContext.createOscillator(),g=audioContext.createGain();o.type='sine';o.frequency.value=f;o.detune.value=(i-1)*3;g.gain.value=[.7,.36,.21][i];o.connect(g);g.connect(audioGain);o.start();audioNodes.push(o,g);});}audioContext.resume().catch(()=>{});audioOn=true;}catch(err){toast('当前浏览器暂不支持播放声音。');audioOn=false;}}
 else{audioOn=false;if(audioContext)audioContext.suspend().catch(()=>{});}
 document.getElementById('audio-label').textContent=audioOn?'开':'关';document.getElementById('audio-button').setAttribute('aria-label',audioOn?'关闭声音':'开启声音');
}
function tone(type){if(!audioOn||!audioContext||audioContext.state!=='running')return;const notes=type==='success'?[523.25,659.25,783.99]:type==='finish'?[392,523.25,659.25,1046.5]:[293.66];notes.forEach((f,i)=>{const o=audioContext.createOscillator(),g=audioContext.createGain();const t=audioContext.currentTime+i*.13;o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.022,t+.025);g.gain.exponentialRampToValueAtTime(.0001,t+.8);o.connect(g);g.connect(audioContext.destination);o.start(t);o.stop(t+.82);o.onended=()=>{o.disconnect();g.disconnect();};});}
function rerenderPlay(){save();navigate('play',{keepScroll:true});}
document.addEventListener('click',event=>{
 const el=event.target.closest('[data-action]');if(!el||el.disabled)return;const action=el.dataset.action;const a=S.active,t=a?.step,c=t?byId[t.id]:null;
 switch(action){
 case'home':navigate('home');break;
 case'map':navigate('map');break;
 case'chapter':if(realms.includes(el.dataset.realm))navigate('chapter',{realm:el.dataset.realm});break;
 case'memory':reviewSession=null;navigate('memory');break;
 case'journal':navigate('journal');break;
 case'enter':S.seenIntro?startRun('journey'):showIntro();break;
 case'intro-start':closeModal();startRun('journey');break;
 case'intro-map':S.seenIntro=true;save();closeModal();navigate('map');break;
 case'journey':startRun('journey');break;
 case'quick':startRun('quick');break;
 case'daily':startRun('daily');break;
 case'tower':startRun('tower');break;
 case'case':if(byId[el.dataset.id])startRun('free',el.dataset.id);break;
 case'replace-run':beginRun(el.dataset.kind,el.dataset.id);break;
 case'resume':if(S.active)navigate('play');else navigate('map');break;
 case'resume-modal':closeModal();if(S.active)navigate('play');else navigate('map');break;
 case'pause':save();navigate('map');toast('这一程已保留。点“继续旅程”回来。');break;
 case'clue':if(a?.phase==='investigate')readClue(el.dataset.id);break;
 case'lens':if(a?.phase==='lens'){t.lens=el.dataset.realm;const match=t.lens===c.realm;showModal(match?'你认出了眼前的压力。':'这面镜子也有用，再看眼前这一层。',`<p>这一幕最先需要练习的是<span class="gold">${R[c.realm].label}</span>。${e(R[c.realm].core)}</p><p style="margin-top:14px">先认出情境，再看具体证据。这个辨认步骤不扣镜片。</p><div class="modal-actions"><button class="btn primary" data-action="lens-continue">进入现场 →</button></div>`);}break;
 case'lens-continue':closeModal();if(a)phase('investigate');break;
 case'to-exercise':if(a&&t.opened.length)phase('exercise');else toast('先核对至少一条线索。');break;
 case'exercise-clue':if(a?.phase==='exercise'&&!t.exerciseChecked)readClue(el.dataset.id);break;
 case'back-investigate':if(a)phase('investigate');break;
 case'back-exercise':if(a)phase('exercise');break;
 case'sort':if(a?.phase==='exercise'&&!t.exerciseChecked){t.answers[Number(el.dataset.index)]=el.dataset.value;rerenderPlay();}break;
 case'listen':if(a?.phase==='exercise'&&!t.exerciseChecked){t.answers.listen=Number(el.dataset.index);rerenderPlay();}break;
 case'experiment':if(a?.phase==='exercise'&&!t.exerciseChecked&&window.MIRROR_EXPERIMENTS?.[c.id]?.options.some(x=>x.id===el.dataset.id)){t.answers.experiment=el.dataset.id;rerenderPlay();}break;
 case'chain-add':if(a?.phase==='exercise'&&!t.exerciseChecked&&t.chain.length<3){const index=Number(el.dataset.index);if(index>=0&&index<t.pool.length&&!t.chain.includes(index))t.chain.push(index);rerenderPlay();}break;
 case'chain-remove':if(a?.phase==='exercise'&&!t.exerciseChecked){const i=Number(el.dataset.index);if(i<t.chain.length)t.chain.splice(i,1);rerenderPlay();}break;
 case'check-exercise':if(a?.phase==='exercise'&&!t.exerciseChecked)checkExercise();break;
 case'to-decision':if(a&&t.exerciseChecked)phase('decision');break;
 case'choose':if(a?.phase==='decision'&&!t.committed&&c.choices.some(x=>x.id===el.dataset.id)){t.selected=el.dataset.id;rerenderPlay();}break;
 case'commit':if(a?.phase==='decision')commitChoice();break;
 case'to-reflect':if(a?.phase==='result')phase('reflect');break;
 case'reveal-reflect':if(a?.phase==='reflect'){t.revealed=true;rerenderPlay();}break;
 case'rate-reflect':if(a?.phase==='reflect')finishReflect(clamp(el.dataset.rate,0,2));break;
 case'start-review':startReview();break;
 case'review-card':startReview(el.dataset.id);break;
 case'reveal-review':if(reviewSession){reviewSession.revealed=true;navigate('review',{keepScroll:true});}break;
 case'rate-review':rateReview(clamp(el.dataset.rate,0,2));break;
 case'how':showHow();break;
 case'settings':showSettings();break;
 case'audio':setAudio(!audioOn);break;
 case'audio-settings':setAudio(!audioOn);showSettings();break;
 case'reduced':S.settings.reduced=!S.settings.reduced;save();if(world)world.setReducedMotion(S.settings.reduced);showSettings();break;
 case'fullscreen':{const p=document.fullscreenElement?document.exitFullscreen?.():document.documentElement.requestFullscreen?.();if(p?.catch)p.catch(()=>toast('当前浏览器不允许全屏；可以使用浏览器自带的全屏按钮。'));else if(!p)toast('请使用浏览器自带的全屏按钮。');break;}
 case'close':closeModal();break;
 case'habit-new':habitNew();break;
 case'habit-result':habitResult(el.dataset.id);break;
 case'export-save':exportSave();break;
 case'export-journal':exportJournal();break;
 case'import-save':document.getElementById('import-file').click();break;
 case'download-game':downloadGame();break;
 case'reset-dialog':showModal('要让城里的记录重新开始吗？',`<p>这会清空当前浏览器中的关卡进度、镜卡安排、文字复盘与现实动作。你可以先导出存档，再重新出发。</p><div class="modal-actions"><button class="btn" data-action="export-save">先导出存档</button><button class="btn" data-action="close">保留记录</button><button class="btn danger" data-action="reset-confirm">确认清空并重新开始</button></div>`);break;
 case'reset-confirm':S=fresh();reviewSession=null;visit();save();closeModal();navigate('home');toast('城图已重新开始。');break;
 }
});
document.addEventListener('input',event=>{
 const el=event.target;if(el.id==='confidence'&&S.active){S.active.step.confidence=clamp(el.value,0,100);S.active.step.confidenceTouched=true;document.getElementById('confidence-output').textContent=el.value+'%';deferSave();}
 else if(el.id==='reflection-answer'&&S.active){S.active.step.answer=el.value;deferSave();}
 else if(el.id==='review-answer'&&reviewSession)reviewSession.answer=el.value;
});
document.addEventListener('submit',event=>{
 const f=event.target;if(f.id==='habit-form'){event.preventDefault();const trigger=document.getElementById('habit-trigger').value.trim(),action=document.getElementById('habit-action').value.trim();if(!trigger||!action){toast('先写清触发的时刻和一个动作。');return;}S.habits.push({id:'h'+Date.now(),realm:document.getElementById('habit-realm').value,trigger:safeText(trigger,450),action:safeText(action,700),check:safeText(document.getElementById('habit-check').value.trim(),600),result:'',at:Date.now(),done:false});S.habits=S.habits.slice(-100);visit();save();closeModal();navigate('journal');toast('这个动作已经放进随身镜册。');}
 else if(f.id==='habit-result-form'){event.preventDefault();const h=S.habits.find(x=>x.id===f.dataset.id),text=document.getElementById('habit-result').value.trim();if(!h||!text)return;h.result=safeText(text,1200);h.done=true;visit();save();closeModal();navigate('journal');toast('真实的尝试已经留下记录。');}
});
document.getElementById('import-file').addEventListener('change',async event=>{
 const input=event.target,file=input.files[0];if(!file)return;input.value='';if(file.size>3*1024*1024){toast('这个文件太大，不像四镜的游戏存档。');return;}
 try{const imported=sanitize(JSON.parse(await file.text()),false);showModal('导入这份存档？',`<p>文件里有 <span class="gold">${Object.keys(imported.completed).length} 幕</span>练习记录、${imported.habits.length} 个现实动作。导入会替换本浏览器当前的进度；进行中的行程不迁移。</p><div class="modal-actions"><button class="btn" data-action="export-save">先备份当前存档</button><button class="btn" data-action="close">取消</button><button class="btn primary" id="confirm-import">确认导入 →</button></div>`);document.getElementById('confirm-import').addEventListener('click',()=>{S=imported;visit();save();closeModal();navigate('map');toast('存档已导入，你的镜册也一起回来了。');},{once:true});}
 catch(err){toast('没有识别出有效的四镜存档，当前记录没有改变。');}
});
modal.addEventListener('click',event=>{if(event.target===modal){const r=modal.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)closeModal();}});
document.addEventListener('visibilitychange',()=>{if(document.hidden){save();if(audioContext)audioContext.suspend().catch(()=>{});}else if(audioOn&&audioContext)audioContext.resume().catch(()=>{});});
window.addEventListener('pagehide',save);
window.addEventListener('error',event=>{console.error('四镜运行提示：',event.message);});
visit();save();render();

})();
</script>
</body></html>
