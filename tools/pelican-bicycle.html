<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d4352">
<title>鹈鹕环岛</title>
<link rel="icon" href="data:,">
<style>
:root {
  --ink: #fff6e6; --dim: rgba(255, 246, 230, .72); --glass: rgba(14, 38, 48, .5); --line: rgba(255, 246, 230, .16); --sun: #ffb65c; --coral: #ff8560;
  --serif: "Songti SC", "STSong", "Source Han Serif SC", "Noto Serif SC", "SimSun", serif;
  --sans: "PingFang SC", "HarmonyOS Sans SC", "MiSans", "Microsoft YaHei UI", "Microsoft YaHei", system-ui, sans-serif;
  --gap: max(18px, env(safe-area-inset-left));
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; overflow: hidden; background: #1d4352; color: var(--ink); font: 13px/1.5 var(--sans); -webkit-tap-highlight-color: transparent; }
#stage, #stage canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
#stage canvas { cursor: grab; }
#ui { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity .9s .5s; }
.ready #ui { opacity: 1; }
#ui button, #ui input, #ui label { pointer-events: auto; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--sun); outline-offset: 2px; }

.hud { position: absolute; left: var(--gap); top: max(16px, env(safe-area-inset-top)); display: flex; align-items: center; gap: 14px; padding: 10px 18px 10px 10px; border-radius: 48px; background: var(--glass); backdrop-filter: blur(14px) saturate(1.25); -webkit-backdrop-filter: blur(14px) saturate(1.25); box-shadow: inset 0 0 0 1px var(--line); }
.hud h1 { font: 600 19px/1.2 var(--serif); letter-spacing: .22em; margin-bottom: 5px; }
.hud dl { display: flex; gap: 14px; }
.hud dl div { min-width: 34px; }
.hud dt { font-size: 10.5px; line-height: 1.2; color: var(--dim); letter-spacing: .08em; }
.hud dd { font-size: 14px; line-height: 1.35; font-variant-numeric: tabular-nums; white-space: nowrap; }
#dial { --v: 0; position: relative; flex: none; width: 72px; height: 72px; border-radius: 50%; background: conic-gradient(from 220deg, var(--sun) calc(var(--v) * 280deg), rgba(255, 246, 230, .14) 0 280deg, transparent 0); }
#dial::after { content: ""; position: absolute; inset: 4px; border-radius: 50%; background: rgba(12, 32, 41, .86); }
#dial span { position: absolute; inset: 0; z-index: 1; display: grid; place-content: center; text-align: center; }
#dial strong { font-size: 19px; line-height: 1.05; font-weight: 600; font-variant-numeric: tabular-nums; }
#dial em { font-size: 9.5px; font-style: normal; color: var(--dim); }
#needle { position: absolute; inset: -1px; z-index: 1; will-change: transform; }
#needle b { position: absolute; top: 50%; width: 6px; height: 6px; margin-top: -3px; border-radius: 50%; background: var(--coral); }
#needle b:first-child { right: 0; } #needle b:last-child { left: 0; background: rgba(255, 246, 230, .55); }

.corner { position: absolute; right: var(--gap); top: max(16px, env(safe-area-inset-top)); display: flex; gap: 6px; }
.corner button, #bShow { padding: 8px 13px; min-height: 36px; border-radius: 18px; background: var(--glass); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); box-shadow: inset 0 0 0 1px var(--line); transition: background .2s, color .2s; white-space: nowrap; }
.corner button:hover, #bShow:hover { background: rgba(14, 38, 48, .72); }
.corner button[aria-pressed=true], .corner button[aria-expanded=true] { background: var(--ink); color: #173842; }
#help { position: absolute; right: var(--gap); top: calc(max(16px, env(safe-area-inset-top)) + 46px); width: min(390px, calc(100vw - 2 * var(--gap))); padding: 14px 16px; border-radius: 16px; background: rgba(12, 34, 43, .8); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); box-shadow: inset 0 0 0 1px var(--line); opacity: 0; transform: translateY(-6px); transition: .25s; line-height: 2.1; }
#help.on { opacity: 1; transform: none; }
#help p + p { margin-top: 2px; }
kbd { display: inline-block; padding: 0 7px; margin: 0 5px 0 0; border-radius: 5px; font: 11.5px/1.75 var(--sans); background: rgba(255, 246, 230, .16); }
#help kbd:not(:first-child) { margin-left: 8px; } #help kbd + kbd { margin-left: 0 !important; }

.dock { position: absolute; left: 0; right: 0; bottom: max(18px, env(safe-area-inset-bottom)); margin-inline: auto; width: max-content; max-width: calc(100vw - 24px); display: flex; flex-direction: column; align-items: center; gap: 8px; }
#cams { display: flex; gap: 2px; padding: 3px; border-radius: 18px; background: var(--glass); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); box-shadow: inset 0 0 0 1px var(--line); max-width: 100%; overflow-x: auto; scrollbar-width: none; pointer-events: auto; }
#cams::-webkit-scrollbar { display: none; }
#cams button { padding: 5px 13px; min-height: 30px; border-radius: 15px; color: var(--dim); white-space: nowrap; transition: .2s; }
#cams button:hover { color: var(--ink); }
#cams button[aria-pressed=true] { background: var(--ink); color: #173842; }
.panel { display: flex; align-items: center; gap: 20px; padding: 10px 12px 10px 20px; border-radius: 30px; background: var(--glass); backdrop-filter: blur(14px) saturate(1.25); -webkit-backdrop-filter: blur(14px) saturate(1.25); box-shadow: inset 0 0 0 1px var(--line); }
.sl { display: block; width: 150px; }
.sl span { display: flex; justify-content: space-between; font-size: 12px; color: var(--dim); letter-spacing: .06em; }
.sl output { color: var(--ink); font-variant-numeric: tabular-nums; letter-spacing: 0; }
input[type=range] { --p: .5; -webkit-appearance: none; appearance: none; display: block; width: 100%; height: 22px; background: none; cursor: pointer; touch-action: none; }
input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: linear-gradient(90deg, var(--sun) calc(var(--p) * 100%), rgba(255, 246, 230, .22) 0); }
input[type=range]::-moz-range-track { height: 4px; border-radius: 2px; background: linear-gradient(90deg, var(--sun) calc(var(--p) * 100%), rgba(255, 246, 230, .22) 0); }
.day input[type=range]::-webkit-slider-runnable-track { background: linear-gradient(90deg, #3a4f86, #ffb98a 8%, #8fd0f2 22%, #bfe6f7 45%, #ffd08a 64%, #ff8f5e 73%, #6b4a86 80%, #16224a 90%); }
.day input[type=range]::-moz-range-track { background: linear-gradient(90deg, #3a4f86, #ffb98a 8%, #8fd0f2 22%, #bfe6f7 45%, #ffd08a 64%, #ff8f5e 73%, #6b4a86 80%, #16224a 90%); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; margin-top: -6px; border-radius: 50%; background: var(--ink); box-shadow: 0 1px 6px rgba(0, 0, 0, .35); }
input[type=range]::-moz-range-thumb { width: 16px; height: 16px; border: 0; border-radius: 50%; background: var(--ink); box-shadow: 0 1px 6px rgba(0, 0, 0, .35); }
.acts { display: flex; gap: 5px; }
.acts button { min-width: 50px; min-height: 40px; padding: 0 12px; border-radius: 20px; background: rgba(255, 246, 230, .1); transition: background .2s, transform .12s, color .2s; white-space: nowrap; }
.acts button:hover { background: rgba(255, 246, 230, .2); } .acts button:active { transform: scale(.95); }
.acts button[aria-pressed=true] { background: var(--ink); color: #173842; }
.acts .hot { background: var(--sun); color: #3a2208; font-weight: 600; } .acts .hot:hover { background: #ffc67e; }

#bShow { position: fixed; right: var(--gap); bottom: max(18px, env(safe-area-inset-bottom)); display: none; opacity: .75; }
.bare #ui { display: none; } .bare #bShow { display: block; } .bare #tip { display: none; }
#tip { position: fixed; left: 0; top: 0; padding: 4px 10px; border-radius: 12px; font-size: 12px; background: rgba(12, 34, 43, .82); pointer-events: none; opacity: 0; transition: opacity .15s; white-space: nowrap; }
#tip.on { opacity: 1; }
#toast { position: fixed; left: 50%; top: 17%; transform: translate(-50%, 8px); padding: 7px 20px; border-radius: 22px; font: 600 16px/1.6 var(--serif); letter-spacing: .14em; background: rgba(12, 34, 43, .62); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); opacity: 0; transition: .3s; pointer-events: none; white-space: nowrap; }
#toast.on { opacity: 1; transform: translate(-50%, 0); }

#loader { position: fixed; inset: 0; display: grid; place-content: center; justify-items: center; gap: 10px; background: linear-gradient(#173a4a, #2d6674 46%, #e9a873 82%, #f5cf9a); transition: opacity 1.2s .1s; z-index: 9; }
.ready #loader { opacity: 0; pointer-events: none; }
#loader h2 { font: 600 34px/1.3 var(--serif); letter-spacing: .34em; text-indent: .34em; }
#loader p { color: var(--dim); letter-spacing: .12em; }
#loadBar { --p: 0; width: 190px; height: 3px; margin-top: 6px; border-radius: 2px; background: linear-gradient(90deg, var(--ink) calc(var(--p) * 100%), rgba(255, 246, 230, .25) 0); }
.sunrise { width: 96px; height: 48px; overflow: hidden; border-bottom: 2px solid var(--ink); }
.sunrise i { display: block; width: 60px; height: 60px; margin: 14px auto 0; border-radius: 50%; background: var(--sun); animation: rise 2.4s ease-in-out infinite alternate; }
@keyframes rise { from { transform: translateY(26px); } to { transform: translateY(2px); } }

@media (max-width: 820px) and (min-height: 461px) {
  .panel { flex-wrap: wrap; justify-content: center; gap: 8px 18px; padding: 10px 14px 12px; border-radius: 24px; }
  .sl { flex: 1 1 130px; width: auto; }
  .acts { flex-wrap: wrap; justify-content: center; flex: 1 1 100%; }
}
@media (max-width: 560px) {
  :root { --gap: 12px; }
  .hud { padding: 7px 16px 7px 7px; gap: 10px; } .hud h1 { font-size: 15px; margin-bottom: 2px; } .hud dl { gap: 9px; } .hud dl div { min-width: 28px; } .hud dd { font-size: 12.5px; } .hud dl div:nth-child(3) { display: none; }
  #dial { width: 60px; height: 60px; } #dial strong { font-size: 16px; }
  .corner { top: calc(max(16px, env(safe-area-inset-top)) + 84px); left: 12px; right: auto; flex-wrap: wrap; max-width: 92px; } .corner button { padding: 6px 11px; min-height: 34px; font-size: 12px; } #bHelp { display: none; }
  .dock { width: calc(100vw - 16px); bottom: max(10px, env(safe-area-inset-bottom)); } .panel { width: 100%; }
  .acts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; } .acts button { min-width: 0; padding: 0 4px; } .acts .hot { grid-column: span 2; }
  #cams button { padding: 5px 9px; }
}
@media (max-height: 460px) {
  .hud dl, .hud h1 { display: none; } .hud { padding: 5px; } .hud > div:last-child { display: none; } #dial { width: 58px; height: 58px; } #dial strong { font-size: 15px; }
  #cams { position: fixed; left: calc(var(--gap) + 82px); right: calc(var(--gap) + 292px); top: max(16px, env(safe-area-inset-top)); width: fit-content; max-width: calc(100vw - 2 * var(--gap) - 374px); margin-inline: auto; }
  #cams button { padding: 5px 9px; }
  .dock { bottom: 8px; } .panel { gap: 14px; padding: 5px 8px 5px 16px; } .sl { width: 112px; } .sl span { line-height: 1.2; } input[type=range] { height: 18px; }
  .acts button { min-height: 34px; min-width: 44px; padding: 0 9px; }
}
@media (max-height: 460px) and (max-width: 700px) { #cams { display: none; } .sl { width: 84px; } .acts button:nth-child(n+6) { display: none; } }
@media (prefers-reduced-motion: reduce) { .sunrise i { animation: none; } * { transition-duration: .01ms !important; } }
</style>
</head>
<body>
<noscript>这个三维场景需要启用 JavaScript。</noscript>
<div id="stage" role="img" aria-label="一只鹈鹕骑着红色自行车沿海岛公路前行的三维场景"></div>

<div id="ui">
  <header class="hud">
    <div id="dial" aria-hidden="true"><i id="needle"><b></b><b></b></i><span><strong id="sSpeed">0.0</strong><em>km/h</em></span></div>
    <div>
      <h1>鹈鹕环岛</h1>
      <dl>
        <div><dt>踏频</dt><dd id="sRpm">0</dd></div>
        <div><dt>坡度</dt><dd id="sGrade">0%</dd></div>
        <div><dt>里程</dt><dd id="sDist">0.00</dd></div>
        <div><dt>小鱼</dt><dd id="sFish">0</dd></div>
      </dl>
    </div>
  </header>

  <div class="corner">
    <button type="button" id="bSound" aria-pressed="false">声音 关</button>
    <button type="button" id="bPause" aria-pressed="false">暂停</button>
    <button type="button" id="bHelp" aria-expanded="false" aria-controls="help">操作</button>
    <button type="button" id="bHide">隐藏</button>
  </div>
  <div id="help">
    <p><kbd>拖动</kbd>环绕<kbd>滚轮 / 双指</kbd>远近<kbd>右键拖</kbd>平移</p>
    <p><kbd>W</kbd><kbd>S</kbd>加力 / 收力刹车<kbd>A</kbd><kbd>D</kbd>左右换道</p>
    <p><kbd>空格</kbd>按住展翅滑行<kbd>F</kbd>抛鱼<kbd>B</kbd>按铃<kbd>G</kbd>逗它</p>
    <p><kbd>V</kbd>换车漆<kbd>T</kbd>慢放<kbd>P</kbd>暂停<kbd>1</kbd>–<kbd>8</kbd>机位<kbd>H</kbd>隐藏界面<kbd>Q</kbd>画质</p>
    <p>直接点画面：鹈鹕、车铃、车筐、车架、海面都有反应。</p>
  </div>

  <footer class="dock">
    <div id="cams" role="group" aria-label="机位"></div>
    <div class="panel">
      <label class="sl"><span>踩踏<output id="oEffort">巡航</output></span><input id="rEffort" type="range" min="0" max="100" value="55" aria-label="踩踏力度"></label>
      <label class="sl day"><span>时刻<output id="oTime">17:12</output></span><input id="rTime" type="range" min="0" max="1000" value="642" aria-label="一天中的时刻"></label>
      <div class="acts" role="group" aria-label="动作">
        <button type="button" id="bFeed" class="hot">抛鱼</button>
        <button type="button" id="bWing" aria-pressed="false">展翅</button>
        <button type="button" id="bBell">按铃</button>
        <button type="button" id="bHonk">逗它</button>
        <button type="button" id="bPaint">换漆</button>
        <button type="button" id="bSlow" aria-pressed="false">慢放</button>
        <button type="button" id="bDay" aria-pressed="false">昼夜</button>
      </div>
    </div>
  </footer>
</div>
<button type="button" id="bShow">显示界面</button>
<div id="tip" role="status"></div>
<div id="toast" role="status" aria-live="polite"></div>

<div id="loader">
  <div class="sunrise" aria-hidden="true"><i></i></div>
  <h2>鹈鹕环岛</h2>
  <p id="loadTxt">准备中</p>
  <div id="loadBar"></div>
</div>

    fsRough: 'roughnessFactor=mix(.93,.74,line)-.1*sst(.5,.8,g3);',
    fsNormal: 'normal=bumpN(normal,-vViewPosition,(g1*.5+g2*.5)*(1.-.7*line),.0042);',
  });
  const build = () => {
    const cols = [-2.05, -1.9, -1.3, -0.65, 0, 0.65, 1.3, 1.9, 2.05], S = 1200, pos = [], nor = [], uv = [], idx = [], f = {};
    for (let i = 0; i <= S; i++) {
      const s = (i / S) * Path.L; Path.at(s, f);
      for (const d of cols) {
        const ad = Math.abs(d);
        pos.push(f.x + f.nx * d, f.y - 0.012 * d * d * 0.35 - (ad > 2 ? 0.07 : 0), f.z + f.nz * d);
        _va.set(-f.slope * f.tx + f.nx * 0.0084 * d, 1, -f.slope * f.tz + f.nz * 0.0084 * d).normalize();

/* ════════════════════════════════════════════════════════════════════════
   35 · 海面：周期波谱法线（数据纹理）+ 水深取色 + 岸线泡沫 + 日光碎金
   ════════════════════════════════════════════════════════════════════════ */
const Water = (() => {
  /** 用随机相位的整数波数正弦叠加出可无缝平铺的波面，存 (∂h/∂x, ∂h/∂z, h) */
  const waveTexture = () => {
    const N = 256, R = rng(77), waves = [];
    for (let i = 0; i < 64; i++) {
      const k = 1 + Math.floor(Math.pow(R(), 1.7) * 26), ang = (R() - 0.5) * 2.3 + 0.35;
      const kx = Math.round(Math.cos(ang) * k), ky = Math.round(Math.sin(ang) * k);
      if (!kx && !ky) continue;
      waves.push({ kx, ky, p: R() * TAU, a: Math.pow(Math.hypot(kx, ky), -1.35) });
    }
    // 可分离正弦：sin(a+b) 展开，避免 N²·波数 次三角函数
    const tab = waves.map(w => ({
      ...w,
      cx: Float32Array.from({ length: N }, (_, i) => Math.cos((TAU * w.kx * i) / N + w.p)), sx: Float32Array.from({ length: N }, (_, i) => Math.sin((TAU * w.kx * i) / N + w.p)),
      cy: Float32Array.from({ length: N }, (_, i) => Math.cos((TAU * w.ky * i) / N)), sy: Float32Array.from({ length: N }, (_, i) => Math.sin((TAU * w.ky * i) / N)),
    }));
    const d = new Uint8Array(N * N * 4);
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
      let gx = 0, gy = 0, h = 0;
      for (const w of tab) {
        const s = w.sx[x] * w.cy[y] + w.cx[x] * w.sy[y], c = w.cx[x] * w.cy[y] - w.sx[x] * w.sy[y];
        h += w.a * s; gx += w.a * w.kx * c; gy += w.a * w.ky * c;
      }
      const o = (y * N + x) * 4;
      d[o] = clamp(128 + gx * 17, 0, 255); d[o + 1] = clamp(128 + gy * 17, 0, 255); d[o + 2] = clamp(128 + h * 42, 0, 255); d[o + 3] = 255;
    }
    const t = new THREE.DataTexture(d, N, N, THREE.RGBAFormat);
    t.wrapS = t.wrapT = THREE.RepeatWrapping; t.magFilter = THREE.LinearFilter; t.minFilter = THREE.LinearMipmapLinearFilter;
    t.generateMipmaps = true; t.anisotropy = 8; t.needsUpdate = true;
    return t;
  };
  const uni = { ...G, uWave: { value: null }, uHeight: { value: null }, uSunI: { value: 3 }, uFog: { value: 0.0015 }, uRipple: { value: [0, 1, 2, 3].map(() => new Vector4(0, 0, -99, 0)) } };
  const mat = new THREE.ShaderMaterial({
    uniforms: uni, transparent: true, depthWrite: false, fog: false,
    vertexShader: /* glsl */`
      uniform float uTime; varying vec3 vW; ${GLSL_SST}
      void main(){
        vec4 w=modelMatrix*vec4(position,1.);
        float f=sst(900.,60.,length(w.xz));
        w.y+=f*(sin(w.x*.21+uTime*.9)*.045+sin(w.z*.17-uTime*.7+1.3)*.05+sin((w.x+w.z)*.09+uTime*.5)*.05);
        vW=w.xyz; gl_Position=projectionMatrix*viewMatrix*w;
      }`,
    fragmentShader: /* glsl */`
      varying vec3 vW; uniform sampler2D uWave,uHeight; uniform float uSunI,uFog; uniform vec4 uRipple[4];
      ${GLSL_SKY_DECL}${GLSL_NOISE}${GLSL_SKY}
      void main(){
        vec2 p=vW.xz; vec3 V=cameraPosition-vW; float dist=length(V); V/=dist; float t=uTime;
        vec2 huv=p/${Terrain.SIZE.toFixed(1)}+.5;
        float edge=max(abs(huv.x-.5),abs(huv.y-.5));
        float gy=edge<.5?texture2D(uHeight,huv).r:-6.; gy=mix(gy,-6.,sst(.44,.5,edge));
        float depth=max(vW.y-gy,0.);
        // 三层波谱叠加，远处渐隐高频
        vec2 wp=p+9.*vec2(vnoise(p*.021),vnoise(p*.021+37.)); float big=fbm3(p*.0075+t*.006);
        vec2 s1=texture2D(uWave,wp/67.+vec2(t*.0085,t*.004)).xy-.5; s1=s1*.5+(texture2D(uWave,mat2(.31,.95,-.95,.31)*wp/151.-vec2(t*.003,t*.005)).xy-.5)*.5;
        vec2 s2=texture2D(uWave,mat2(.8,.6,-.6,.8)*p/19.+vec2(-t*.013,t*.017)).xy-.5;
        vec2 s3=texture2D(uWave,mat2(.6,-.8,.8,.6)*p/5.3+vec2(t*.045,-t*.03)).xy-.5;
        vec2 s4=texture2D(uWave,p/1.9+vec2(-t*.09,t*.07)).xy-.5;
        float nearK=sst(150.,10.,dist);
        vec2 slope=s1*.2+s2*(.2+.18*big)+s3*.30*sst(420.,20.,dist)+s4*.2*nearK;
        for(int i=0;i<4;i++){ float a=t-uRipple[i].z; if(a>0.&&a<3.5){ vec2 q=p-uRipple[i].xy; float r=length(q);
          float rk=(r-a*1.9)*1.6; float w=exp(-rk*rk)*exp(-a*1.1); slope+=normalize(q+1e-4)*sin((r-a*1.9)*9.)*w*1.4; } }
        slope*=mix(1.,.55,sst(60.,900.,dist))*sst(-.05,.8,depth);
        vec3 N=normalize(vec3(-slope.x,1.,-slope.y));
        float nv=clamp(dot(N,V),0.,1.);
        float F=.02+.98*pow(1.-nv,5.); F=min(F,.62);
        vec3 R=reflect(-V,N); R.y=abs(R.y)*.8+.10+.12*sst(700.,40.,dist); // 波面平均坡度让反射偏向更高的天空
        vec3 refl=skyBase(normalize(R));
        // 水体：浅滩青绿 → 深海蓝，随日光明暗
        float day=1.-uNight; float sy=clamp(uSunDir.y*1.6+.15,0.,1.);
        vec3 amb=(uZenith*.55+uHorizon*.45)*.9+uSunCol*sy*uSunI*.13*day;
        vec3 shallow=vec3(.16,.58,.52), mid=vec3(.022,.25,.32), deep=vec3(.008,.088,.175);
        vec3 body=mix(shallow,mid,1.-exp(-depth*.75)); body=mix(body,deep,1.-exp(-depth*.22)); body*=.82+.42*big;
        float crest=texture2D(uWave,mat2(.8,.6,-.6,.8)*wp/19.+vec2(-t*.013,t*.017)).z; crest=mix(.5,crest,sst(110.,12.,dist));
        body+=vec3(.03,.16,.13)*sst(.5,.95,crest)*.55;
        body*=amb;
        vec3 L=uNight>.5?uMoonDir:uSunDir;
        body+=vec3(.06,.30,.24)*uSunCol*pow(max(dot(-V,L),0.),3.)*sst(.45,.9,crest)*.5*day;
        vec3 col=mix(body,refl,F);
        // 日光（或月光）碎金
        vec3 Hh=normalize(V+L); float nh=clamp(dot(N,Hh),0.,1.);
        float spec=pow(nh,520.)*7.5+pow(nh,90.)*.32;
        vec3 lc=uNight>.5?vec3(.75,.85,1.)*.65*uNight:uSunCol*uSunI*(.4+.6*sst(-.02,.12,uSunDir.y));
        col+=lc*spec*sst(0.,.35,depth);
        // 岸线泡沫
        float fn=fbm3(p*1.3+vec2(t*.12,-t*.09)), fn2=vnoise(p*6.+t*.4);
        float lap=sin(t*.62+fbm3(p*.07)*7.)*.16;
        float d2=depth+lap+(fn-.45)*.5;
        float foam=sst(.30,.03,d2)*sst(.25,.6,fn+fn2*.35);
        float band=sst(.80,.98,sin(depth*5.4+t*.85+fn*5.))*sst(1.35,.15,depth)*sst(.42,.72,fn2*.5+fn*.6);
        foam=clamp(foam+band*.75,0.,1.);
        vec3 foamC=(uZenith*.35+uHorizon*.6+uSunCol*sy*uSunI*.17*day)*.92;
        col=mix(col,foamC,foam*.88);
        float alpha=mix(sst(-.03,1.15,depth)*.86+.1,1.,clamp(F*1.1+sst(.8,3.,depth),0.,1.));
        alpha=max(alpha,foam*.9)*sst(0.,.06,depth);
        // 远处溶进地平线
        vec3 hd=normalize(vec3(-V.x,.004,-V.z)); vec3 hz=skyBase(hd);
        float fog=1.-exp(-pow(dist*uFog*.5,1.5)); fog=max(fog,sst(1300.,3300.,dist));
        col=mix(col,hz,fog);
        gl_FragColor=vec4(col,max(alpha,fog));
      }`,
  });
  const build = () => {
    uni.uWave.value = waveTexture(); uni.uHeight.value = Terrain.heightTexture();
    const pos = [], idx = [], R = [], seg = 144;
    for (let r = 34; r < 3500; r += Math.max(1.6, (r - 30) * 0.045)) R.push(r);
    R.push(3560);
    R.forEach(r => { for (let j = 0; j <= seg; j++) { const a = (j / seg) * TAU; pos.push(Math.cos(a) * r, 0, Math.sin(a) * r); } });
    for (let i = 0; i < R.length - 1; i++) for (let j = 0; j < seg; j++) { const a = i * (seg + 1) + j, b = a + 1, c = a + seg + 1, d = c + 1; idx.push(a, b, c, b, d, c); }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setIndex(idx);
    const m = new Mesh(g, mat);
    m.frustumCulled = false; m.renderOrder = 2;
    scene.add(m);
    return m;
  };
  let ri = 0;
  /** 在海面某点激起一圈涟漪 */
  const ripple = (x, z) => { uni.uRipple.value[ri++ % 4].set(x, z, G.uTime.value, 0); };
  const update = () => { uni.uSunI.value = Atmos.st.sunI; uni.uFog.value = scene.fog.density; };
  return { build, update, ripple };
})();

/* ════════════════════════════════════════════════════════════════════════
   40 · 植被：草、花、灌木、伞松、柏、棕榈、礁石（全部实例化）
   ════════════════════════════════════════════════════════════════════════ */
const Flora = (() => {
  const R = rng(1208), f = {}, o = {}, n = V();
  const quality = { grass: 1, meshes: [], flowers: [] };
  // 与地形着色器同一套噪声的 CPU 版，让草色和地面色斑对得上，又不必在每个草顶点上算噪声
  const fr = x => x - Math.floor(x);
  const gh = (x, y) => { let a = fr(x * 0.1031), b = fr(y * 0.1031), c = a; const d = a * (b + 33.33) + b * (c + 33.33) + c * (a + 33.33); a += d; b += d; c += d; return fr((a + b) * c); };
  const gn = (x, y) => { const i = Math.floor(x), j = Math.floor(y); let u = x - i, v = y - j; u = u * u * (3 - 2 * u); v = v * v * (3 - 2 * v); return lerp(lerp(gh(i, j), gh(i + 1, j), u), lerp(gh(i, j + 1), gh(i + 1, j + 1), u), v); };
  const gf = (x, y) => { let s = 0, a = 0.5; for (let k = 0; k < 3; k++) { s += a * gn(x, y); const nx = 1.6 * x - 1.2 * y + 17.3; y = 1.2 * x + 1.6 * y + 17.3; x = nx; a *= 0.5; } return s; };
  const grassTint = (x, z, out) => { const k = smooth(0.28, 0.72, gf(x * 0.12 + 40, z * 0.12 + 40) + (gn(x * 6.5, z * 6.5) - 0.5) * 0.3), d = smooth(0.55, 0.8, gf(x * 0.23 - 13, z * 0.23 - 13)) * 0.55; return out.setRGB(lerp(lerp(0.105, 0.235, k), 0.3, d), lerp(lerp(0.155, 0.265, k), 0.27, d), lerp(lerp(0.038, 0.075, k), 0.1, d)); };
  const WIND = /* glsl */`
    vec2 gust(vec2 p,float t){ float a=sin(p.x*.31+p.y*.17+t*1.7)+.5*sin(p.x*.13-p.y*.37+t*2.9); float b=.5+.5*sin(p.x*.083-t*.6+1.7*sin(p.y*.061+t*.27)); return vec2(.55+.45*a*.6+b*.9,.35*sin(p.y*.4+t*1.3)); }`;
  /** 公路坐标 → 世界点；返回 false 表示不适合长草 */
  function spot(s, d, out) {
    Path.at(s, f); out.set(f.x + f.nx * d, 0, f.z + f.nz * d); out.y = Terrain.groundY(out.x, out.z);
    return out;
  }
  const blocked = [];
  const isBlocked = (x, z, r = 0) => blocked.some(b => Math.hypot(x - b.x, z - b.z) < b.r + r);

  /* —— 草：每株 6 叶，顶点着色器做风 —— */
  function grass() {
    const pos = [], nor = [], uv = [], idx = [];
    for (let b = 0; b < 6; b++) {
      const a = (b / 6) * TAU + R() * 0.8, r = 0.03 + R() * 0.24, h = 0.55 + R() * 0.55, lean = 0.3 + R() * 0.6, w = 0.026 + R() * 0.014, base = pos.length / 3;
      const bx = Math.cos(a) * r, bz = Math.sin(a) * r, dx = Math.cos(a + 0.6 * (R() - 0.5)), dz = Math.sin(a + 0.6 * (R() - 0.5));
      for (let i = 0; i <= 3; i++) {
        const t = i / 3, ww = w * (1 - t * t * 0.96), cx = bx + dx * lean * t * t * 0.5, cz = bz + dz * lean * t * t * 0.5, y = h * (t - 0.16 * lean * t * t);
        for (const s of i === 3 ? [0] : [-1, 1]) { pos.push(cx - dz * ww * s, y, cz + dx * ww * s); nor.push(dx * 0.35, 0.94, dz * 0.35); uv.push(s * 0.5 + 0.5, t); }
      }
      for (let i = 0; i < 2; i++) { const q = base + i * 2; idx.push(q, q + 1, q + 2, q + 1, q + 3, q + 2); }
      idx.push(base + 4, base + 5, base + 6);
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3)); g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2)); g.setIndex(idx);
    const mat = patch(new THREE.MeshStandardMaterial({ roughness: 0.82, side: THREE.DoubleSide }), {
      decl: 'varying vec2 vFuv; uniform float uTime; uniform vec3 uSunDir,uSunCol; uniform float uNight;',
      vsPars: WIND,
      vsPos: /* glsl */`
        vec3 ip=(modelMatrix*instanceMatrix*vec4(0.,0.,0.,1.)).xyz; float gh=length(instanceMatrix[1].xyz);
        vec2 gw=gust(ip.xz,uTime)*uv.y*uv.y*.21; mat3 im3=mat3(instanceMatrix); vec3 lw=vec3(gw.x,-length(gw)*.28,gw.y);
        transformed+=vec3(dot(im3[0],lw),dot(im3[1],lw),dot(im3[2],lw))/(gh*gh)*gh*.55;`,
      vsEnd: 'vFuv=uv;',
      fsColor: 'if(length(vViewPosition)<2.2 && hash12(gl_FragCoord.xy*.71)>sst(.7,2.2,length(vViewPosition))) discard; diffuseColor.rgb*=mix(.78,1.42,vFuv.y*vFuv.y*.6+vFuv.y*.4);',
      fsNormal: 'normal=normalize(mix(normal*faceDirection,(viewMatrix*vec4(0.,1.,0.,0.)).xyz,.72));',
      fsEmissive: '{ vec3 Vw=normalize((vec4(normalize(-vViewPosition),0.)*viewMatrix).xyz); totalEmissiveRadiance+=vColor.rgb*uSunCol*pow(max(dot(Vw,uSunDir),0.),4.)*vFuv.y*.65*(1.-uNight); }',
    });
    const CH = 40, seg = Path.L / CH, p = V(), m = new Matrix4(), q = new Quaternion(), e = new THREE.Euler(), tc = new Color();
    for (let c = 0; c < CH; c++) {
      const list = [];
      for (let k = 0; k < 2300; k++) {
        const u = R(), d = (R() < 0.5 ? -1 : 1) * (2.28 + Math.pow(R(), 1.75) * 6.4), s = (c + u) * seg;
        spot(s, d, p);
        const ad = Math.abs(d), cl = Terrain.cliffK(Path.degAt(p.x, p.z));
        if (p.y < 0.95 && d < 0 && cl < 0.6) continue;
        if (vnoise(p.x * 0.9, p.z * 0.9) < 0.08 + 0.5 * smooth(2.9, 2.25, ad)) continue;

    }
  }

  /* —— 花 —— */
  function flowers() {
    const petal = (n, r, w, up, col, cc) => {
      const gs = [];
      for (let i = 0; i < n; i++) { const a = (i / n) * TAU, g = new THREE.CircleGeometry(1, 6).scale(r * 0.5, w, 1).rotateX(-PI / 2).translate(r * 0.55, 0, 0).rotateZ(up).rotateY(a); gs.push(paint(g, col)); }
      gs.push(paint(new THREE.SphereGeometry(r * 0.32, 8, 5).scale(1, 0.6, 1), cc));
      return gs;
    };
    const stem = h => paint(rod(V(0, 0, 0), V(0.01, h, 0.006), 0.0045, 0.003, 4, false), C('#4d6a26'));
    const kinds = [
      merge([stem(0.26), ...petal(9, 0.036, 0.011, 0.25, C('#fbf6e6'), C('#eeb41f')).map(g => at(g, 0.01, 0.265, 0.006))]),
      merge([stem(0.3), ...petal(4, 0.042, 0.03, 0.55, C('#e0301c'), C('#2a1a1a')).map(g => at(g, 0.01, 0.3, 0.006))]),
      merge([stem(0.34), ...[...Array(9)].map((_, i) => paint(new THREE.IcosahedronGeometry(0.0145 - i * 0.0007, 0).translate(Math.cos(i * 2.4) * 0.009 + 0.01, 0.2 + i * 0.02, Math.sin(i * 2.4) * 0.009), C('#8a6ad0').lerp(C('#5b45a8'), (i % 3) / 3)))]),
      merge([stem(0.2), ...petal(6, 0.03, 0.013, 0.4, C('#f6c63a'), C('#b5741a')).map(g => at(g, 0.01, 0.205, 0.006))]),
    ];
    const mat = patch(new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.75, side: THREE.DoubleSide }), {
      decl: 'uniform float uTime;', vsPars: WIND, fsColor: 'if(length(vViewPosition)<3.2 && hash12(gl_FragCoord.xy*.71)>sst(1.,3.2,length(vViewPosition))) discard;',
      vsPos: 'vec3 ip=(modelMatrix*instanceMatrix*vec4(0.,0.,0.,1.)).xyz; vec2 gw=gust(ip.xz,uTime)*position.y*.16; transformed.x+=gw.x*cos(ip.x*9.); transformed.z+=gw.x*sin(ip.x*9.)+gw.y;',
    });
    const lists = kinds.map(() => []), p = V();
    for (let c = 0; c < 190; c++) { // 成片生长
      const s0 = R() * Path.L, d0 = (R() < 0.42 ? -1 : 1) * (2.9 + R() * 5.5), k = Math.floor(R() * 4), cnt = 6 + R() * 16;
      for (let i = 0; i < cnt; i++) {

        Path.near(p.x, p.z, o); if (Math.abs(o.d) < 2.6 || (p.y < 1.05 && o.d < 0) || isBlocked(p.x, p.z)) continue;

/* ════════════════════════════════════════════════════════════════════════
   66 · 围巾：颈环随体表放样，两条飘带用 Verlet 布料（风阻 + 与躯干碰撞）

  const bell = () => { for (const t of [0, 0.13, 0.5, 0.63]) { tone('sine', 2093, 2088, 0.9, 0.16, t); tone('sine', 3322, 3318, 0.6, 0.09, t); tone('sine', 5233, 5230, 0.32, 0.05, t); } };
  const honk = () => { for (const [t, f] of [[0, 150], [0.28, 128]]) { tone('sawtooth', f * 1.25, f, 0.26, 0.5, t, 520); tone('square', f * 1.26, f * 0.98, 0.24, 0.16, t, 900); burst(700, 1.4, 0.2, 0.16, t); } };
  const gulp = () => { tone('sine', 320, 95, 0.22, 0.4); tone('sine', 240, 80, 0.2, 0.3, 0.2); };
  const splash = k => { burst(900, 0.6, 0.42, 0.22 * k, 0, 2600); burst(400, 0.8, 0.25, 0.14 * k); };
  const gull = k => { for (let i = 0; i < 3; i++) { tone('triangle', 1500 + Math.random() * 200, 980, 0.26, 0.05 * k, i * 0.34); tone('sawtooth', 1520, 1000, 0.22, 0.018 * k, i * 0.34, 1900); } };
  Fx.on('bell', bell); Fx.on('honk', honk); Fx.on('gulp', gulp); Fx.on('catch', () => burst(1200, 1, 0.12, 0.2)); Fx.on('splash', p => splash(clamp(1.4 - camera.position.distanceTo(_vd.set(p.x, 0, p.z)) / 50, 0.1, 1)));
  Fx.on('throw', () => burst(600, 0.7, 0.35, 0.1, 0, 1500)); Fx.on('happy', () => { tone('triangle', 420, 640, 0.14, 0.14, 0, 900); tone('triangle', 520, 780, 0.16, 0.14, 0.16, 1000); }); Fx.on('spread', v => burst(v ? 300 : 500, 0.6, 0.4, 0.22, 0, v ? 900 : 240));
  function toggle(v = !on) { on = v; if (on && !ac) boot(); if (ac) { if (on) ac.resume(); master.gain.setTargetAtTime(on ? 0.85 : 0, ac.currentTime, 0.18); } Fx.emit('sound', on); }
  Fx.on('toggleSound', () => toggle());
  document.addEventListener('visibilitychange', () => { if (ac && on) document.hidden ? ac.suspend() : ac.resume(); });
  function update(dt, t) {
    if (!on) return;
    const s = Rider.st, now = ac.currentTime, d = Math.max(0, Terrain.shoreK(Path.degAt(camera.position.x, camera.position.z)) - 8), k = clamp(1.15 - d / 30, 0.45, 1), swell = 0.55 + 0.45 * Math.sin(t * 0.62) * Math.sin(t * 0.23 + 1);
    sea.gn.gain.setTargetAtTime(0.2 * k * (0.6 + 0.6 * swell), now, 0.3); sea.hi.gn.gain.setTargetAtTime(0.025 * k * swell * swell, now, 0.3);
    wind.gn.gain.setTargetAtTime(0.01 + 0.0045 * s.v * s.v + s.spread * 0.09, now, 0.2); wind.fl.frequency.setTargetAtTime(340 + s.v * 60 + 60 * Math.sin(t * 1.7), now, 0.3);
    tyre.gn.gain.setTargetAtTime(0.0075 * s.v, now, 0.1); night.gn.gain.setTargetAtTime(Atmos.st.lamp * 0.05 * (Math.sin(t * 21) > 0.2 ? 1 : 0.1), now, 0.02);
    if (s.coast) { tickAcc += (s.v / Bike.R / TAU) * 18 * dt; let n = 0; while (tickAcc > 1 && n < 5) { tickAcc--; burst(3400 + Math.random() * 300, 5, 0.014, 0.12, n * 0.012); n++; } } // 飞轮棘爪
    else { const ph = Math.floor(s.theta / PI); if (ph !== pedalPrev) { pedalPrev = ph; burst(1300, 2.4, 0.05, 0.02 + 0.05 * s.effort); } }
    if ((gullT -= dt) < 0) { gullT = 5 + Math.random() * 9; if (Atmos.st.night < 0.5) gull(0.5 + Math.random() * 0.6); }
  }
  return { toggle, update, get on() { return on; } };
})();

/* ════════════════════════════════════════════════════════════════════════
   94 · 界面：纯 DOM/CSS，无图标资源
   ════════════════════════════════════════════════════════════════════════ */
const UI = (() => {
  const $ = id => document.getElementById(id), st = Rider.st;
  const tip = $('tip'), toast = $('toast');
  let auto = false, tod = 17.2, uT = 0, toastT = 0;
  const fmt = h => `${String(Math.floor(h) % 24).padStart(2, '0')}:${String(Math.floor((h % 1) * 60)).padStart(2, '0')}`;
  const say = s => { toast.textContent = s; toast.classList.add('on'); toastT = 2.2; };
  // 机位
  const cams = $('cams');
  Object.entries(Cam.PRESET).forEach(([k, p], i) => { const b = document.createElement('button'); b.type = 'button'; b.dataset.k = k; b.textContent = p.name; b.title = `机位 ${i + 1}`; b.onclick = () => { Cam.set(k); b.blur(); }; cams.append(b); });
  const mark = k => { for (const b of cams.children) b.setAttribute('aria-pressed', b.dataset.k === k); };
  Fx.on('cam', mark);
  // 滑杆
  const rE = $('rEffort'), rT = $('rTime'), oE = $('oEffort'), oT = $('oTime');
  const setE = v => { rE.value = Math.round(v * 100); rE.style.setProperty('--p', v); oE.textContent = v <= 0.01 ? '滑行' : v < 0.35 ? '悠闲' : v < 0.7 ? '巡航' : v < 0.9 ? '用力' : '冲刺'; };
  rE.oninput = () => { st.effort = rE.value / 100; setE(st.effort); };
  Fx.on('effort', setE);
  const T0 = 5, T1 = 24;
  const setT = h => { tod = h; rT.value = Math.round(((h - T0) / (T1 - T0)) * 1000); rT.style.setProperty('--p', (h - T0) / (T1 - T0)); oT.textContent = fmt(h); };
  rT.oninput = () => { auto = false; $('bDay').setAttribute('aria-pressed', false); goalT = T0 + (rT.value / 1000) * (T1 - T0); setT(goalT); };
  let goalT = tod;
  for (const r of [rE, rT]) r.addEventListener('pointerup', () => r.blur());
  // 按钮
  const bind = (id, fn) => { $(id).addEventListener('click', e => { fn(e.currentTarget); e.currentTarget.blur(); }); };
  bind('bBell', () => Act.bell()); bind('bFeed', () => Act.feed()); bind('bHonk', () => Act.honk()); bind('bPaint', () => Act.paint());
  bind('bWing', () => Act.spread()); bind('bSlow', () => Act.slow()); bind('bPause', () => Act.pause()); bind('bSound', () => Sound.toggle());
  bind('bDay', b => { auto = !auto; b.setAttribute('aria-pressed', auto); say(auto ? '时间流动' : '时间停驻'); });
  bind('bHelp', b => { const o = $('help').classList.toggle('on'); b.setAttribute('aria-expanded', o); });
  bind('bHide', () => hide(true)); bind('bShow', () => hide(false));
  const hide = v => { document.body.classList.toggle('bare', v); };
  Fx.on('toggleUI', () => hide(!document.body.classList.contains('bare')));
  Fx.on('spread', v => $('bWing').setAttribute('aria-pressed', v)); Fx.on('slow', v => { $('bSlow').setAttribute('aria-pressed', v); say(v ? '慢放 ¼ 速' : '常速'); });
  Fx.on('pause', v => { $('bPause').setAttribute('aria-pressed', v); $('bPause').textContent = v ? '继续' : '暂停'; }); Fx.on('sound', v => { $('bSound').setAttribute('aria-pressed', v); $('bSound').textContent = v ? '声音 开' : '声音 关'; });
  Fx.on('paint', n => say(`车漆 · ${n}`)); Fx.on('catch', n => { $('sFish').textContent = n; say(['接住啦', '好身手', '一口闷', '喉囊真能装'][n % 4]); });
  Fx.on('hover', h => { if (h) { tip.textContent = h.text; tip.style.transform = `translate(${Math.min(h.x + 16, innerWidth - tip.offsetWidth - 10)}px,${h.y + 18}px)`; tip.classList.add('on'); } else tip.classList.remove('on'); });
  Fx.on('grab', () => { tip.classList.remove('on'); $('help').classList.remove('on'); $('bHelp').setAttribute('aria-expanded', false); });
  const dial = $('dial'), nd = $('needle');
  function update(dt) {
    if (auto) { goalT += dt * 0.16; if (goalT > T1) goalT = T0; setT(goalT); }
    if (Math.abs(Atmos.st.tod - tod) > 1e-4) { const d = tod - Atmos.st.tod; Atmos.update(Math.abs(d) < 0.004 ? tod : Math.abs(d) > 6 ? tod : Atmos.st.tod + d * (1 - Math.exp(-dt * 5))); }
    nd.style.transform = `rotate(${(st.theta * 180) / PI}deg)`;                 // 仪表指针与真实曲柄同相
    if ((uT -= dt) < 0) {
      uT = 0.15; const rpm = Math.max(0, (st.omega / TAU) * 60);
      $('sSpeed').textContent = (st.v * 3.6).toFixed(1); $('sRpm').textContent = st.coast ? '滑行' : Math.round(rpm); $('sGrade').textContent = `${st.slope >= 0 ? '+' : '−'}${Math.abs(st.slope * 100).toFixed(1)}%`; $('sDist').textContent = (st.dist / 1000).toFixed(2);
      dial.style.setProperty('--v', clamp(st.v * 3.6 / 32));
    }
    if (toastT > 0 && (toastT -= dt) <= 0) toast.classList.remove('on');
  }
  setE(st.effort); setT(tod);
  return { update, setT: h => { goalT = h; setT(h); }, mark, say, get tod() { return tod; } };
})();

/* ════════════════════════════════════════════════════════════════════════
   99 · 装配、自适应画质、主循环
   ════════════════════════════════════════════════════════════════════════ */
const loadBar = document.getElementById('loadBar'), loadTxt = document.getElementById('loadTxt');
const steps = [
  ['堆起一座小岛', async () => { const h = Props.houses(), l = Props.lighthouse(); await Terrain.build(); Road.build(); Water.build(); Atmos.update(UI.tod); h(); l(); }],
  ['沿海岸铺路', () => { Props.streetLamps(); Props.fence(); Props.crossing(); Props.beach(); }],
  ['放下帆船与气球', () => { Props.pier(); Props.islands(); Props.balloons(); Props.gulls(); Props.lavender(); }],
  ['种树', () => { Flora.pines(); Flora.cypresses(Props.spotsC); Flora.palms(); Flora.bushes(); Flora.rocks(); }],
  ['撒草籽', () => { Flora.grass(); Flora.flowers(); }],
  ['给鹈鹕一片片插羽毛', () => { Rider.init(); Cam.init(); }],
];
for (let i = 0; i < steps.length; i++) {
  loadTxt.textContent = steps[i][0]; loadBar.style.setProperty('--p', (0.3 * i) / steps.length);
  await nextFrame(); await nextFrame(); await steps[i][1]();
}
/* —— 后期：调色暗角 → 泛光（HDR 线性空间，随后由渲染器做 ACES）—— */
const bloom = new THREE.UnrealBloomPass(new Vector2(innerWidth, innerHeight), 0.2, 0.5, 2.1);
class GradePass extends THREE.Pass {
  constructor() {
    super();
    this.material = new THREE.ShaderMaterial({
      uniforms: { tDiffuse: { value: null }, uTime: G.uTime, uSat: { value: 1.1 }, uVig: { value: 0.3 }, uAsp: { value: 1.7 } }, depthTest: false, depthWrite: false,
      vertexShader: 'varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.,1.); }',
      fragmentShader: /* glsl */`
        uniform sampler2D tDiffuse; uniform float uTime,uSat,uVig,uAsp; varying vec2 vUv; ${GLSL_SST}
        float h(vec2 p){ vec3 q=fract(vec3(p.xyx)*.1031); q+=dot(q,q.yzx+33.33); return fract((q.x+q.y)*q.z); }
        void main(){
          vec3 c=texture2D(tDiffuse,vUv).rgb;
          c=vec3(c.r>=0.&&c.r<200.?c.r:0.,c.g>=0.&&c.g<200.?c.g:0.,c.b>=0.&&c.b<200.?c.b:0.); // 净化非数，避免被泛光扩散
          float l=dot(c,vec3(.2126,.7152,.0722));
          c=max(mix(vec3(l),c,uSat),0.);
          c*=mix(vec3(.985,.995,1.03),vec3(1.02,1.0,.975),sst(.05,.9,l));        // 暗部偏冷、亮部偏暖
          vec2 q=(vUv-.5)*vec2(mix(1.,uAsp,.55),1.); c*=1.-uVig*sst(.28,.95,length(q)*1.12);
          c+=(h(gl_FragCoord.xy+fract(uTime*7.)*91.)-.5)*.012*(.25+l);
          gl_FragColor=vec4(c,1.);
        }`,
    });
    this.q = new THREE.FullScreenQuad(this.material);
  }
  render(r, w, rd) { this.material.uniforms.tDiffuse.value = rd.texture; r.setRenderTarget(w); this.q.render(r); }
  setSize(w, h) { this.material.uniforms.uAsp.value = w / h; }
}
Fx.on('bell', Props.scare);
const grade = new GradePass();
renderer.setEffects([grade, bloom]);

/* —— 画质：按显卡给初始像素上限，再按实测帧耗时自适应（分辨率 → 草量 / 花 → 远级阴影 / 泛光）—— */
const Quality = (() => {
  const coarse = matchMedia('(pointer: coarse)').matches, gl = renderer.getContext(), info = gl.getExtension('WEBGL_debug_renderer_info');
  const gpu = info ? String(gl.getParameter(info.UNMASKED_RENDERER_WEBGL)) : '';
  const strong = /NVIDIA|GeForce|RTX|Radeon (RX|Pro)|Arc\(TM\)/i.test(gpu), soft = /SwiftShader|llvmpipe|Basic Render/i.test(gpu);
  const maxDpr = Math.min(devicePixelRatio || 1, coarse ? 1.75 : 2), capMP = soft ? 0.5 : coarse ? 2.2 : strong ? 8.4 : 3.7;
  const MODE = ['自动', '高', '中', '低'];
  let scale = 1, tier = 0, mode = 0, acc = 0, n = 0, hold = 1.5, fails = 0, locked = false, prev = null;
  const dpr = () => { const cap = Math.sqrt((capMP * 1e6) / Math.max(innerWidth * innerHeight, 1)); return Math.max(0.5, Math.min(maxDpr, cap) * scale); };
  const apply = () => { renderer.setPixelRatio(dpr()); renderer.setSize(innerWidth, innerHeight); };
  const setTier = t => {
    tier = t;
    Flora.quality.grass = [1, 0.55, 0.25][t];
    for (const m of Flora.quality.flowers) m.visible = t < 2;
    sun.shadow.mapSize.setScalar([2048, 2048, 1024][t]); sun.shadow.cascades = t < 2 ? 2 : 1;
    bloom.enabled = t < 2;
  };
  function resize() {
    camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); apply();
    const p = Cam.PRESET[Cam.st.mode]; if (p.dist && !Cam.st.free) Cam.goal.dist = p.dist * Cam.portrait();
  }
  addEventListener('resize', resize);
  /** 每约 0.8 秒评估一次平均帧间隔 */
  function tick(ms) {
    if (mode || locked || document.hidden) { acc = n = 0; return; }
    ms = Math.min(ms, 400);
    if (hold > 0) { hold -= ms / 1000; return; }
    acc += ms; n++;
    if (n < 4 || acc < 800) return;
    const a = acc / n; acc = n = 0;
    if (prev) { // 上一次降档没有带来改善 → 瓶颈不在这里（例如显示器限帧），恢复并停止
      if (a > prev.a * 0.93) fails++; else fails = 0;
      if (fails >= 2 && a < 60) { scale = prev.s0; setTier(prev.t0); apply(); locked = true; return; }
    }
    const s0 = prev ? prev.s0 : scale, t0 = prev ? prev.t0 : tier;
    if (a > 22 && (scale > 0.5 || tier < 2)) {
      prev = { a, s0, t0 };
      scale = Math.max(0.5, scale * (a > 40 ? 0.7 : 0.85));
      const want = a > 40 ? tier + 1 : scale < 0.62 ? 2 : scale < 0.78 ? 1 : tier;
      if (want > tier && tier < 2) setTier(Math.min(2, want));
      apply(); hold = 0.5;
    } else if (a < 10.5 && scale < 1) { prev = null; scale = Math.min(1, scale * 1.1); apply(); hold = 1.5; }
    else prev = null;
  }
  function setMode(m) { mode = mod(m, 4); fails = 0; prev = null; locked = false; hold = 1; scale = [1, 1, 0.8, 0.6][mode]; setTier([coarse ? 1 : 0, 0, 1, 2][mode]); apply(); return MODE[mode]; }
  setTier(soft ? 2 : coarse ? 1 : 0);
  return { resize, tick, setMode, setTier, get scale() { return scale; }, get tier() { return tier; }, get mode() { return mode; }, get locked() { return locked; }, gpu, capMP };
})();
Fx.on('quality', () => UI.say(`画质 · ${Quality.setMode(Quality.mode + 1)}`));
Quality.resize();

/* —— 主循环 —— */
let last = performance.now(), simT = 0;
function frame(dt) {
  const sim = Act.paused ? 0 : dt * (Act.slowmo ? 0.25 : 1);
  simT += sim; G.uTime.value = simT;
  Input.update(dt); Act.update(sim);
  if (sim > 0) Rider.update(sim);
  Rider.root.updateMatrixWorld(true);
  Props.update(simT, sim); if (sim > 0) Fx.update(simT, sim);
  Cam.update(dt, simT);
  camera.updateMatrixWorld();
  sun.shadow.focus.copy(Rider.root.position).y += 0.85;
  sky.position.copy(camera.position);
  Water.update(); Flora.update(); UI.update(dt); Sound.update(dt, simT);
  renderer.render(scene, camera);
}
loadTxt.textContent = '调好阳光';
await nextFrame();
Cam.set('side');
{ // 预编译须与正式渲染同一目标格式（HDR + MSAA），否则会白编一套；并行编译期间回报进度
  const probe = new THREE.WebGLRenderTarget(4, 4, { type: THREE.HalfFloatType, samples: 4 });
  renderer.setRenderTarget(probe);
  const done = renderer.compileAsync(scene, camera);
  renderer.setRenderTarget(null);
  let wait = true; done.then(() => { wait = false; });
  while (wait) {
    const ps = renderer.info.programs, ok = ps.filter(p => p.isReady()).length;
    loadBar.style.setProperty('--p', 0.3 + 0.65 * (ok / Math.max(ps.length, 1)));
    await new Promise(r => setTimeout(r, 60));
  }
  probe.dispose();
}
for (let i = 0; i < 3; i++) frame(1 / 60);
let manual = false;
renderer.setAnimationLoop(now => {
  const raw = now - last; last = now;
  if (manual) return;
  Quality.tick(raw); frame(clamp(raw / 1000, 0.001, 0.05));
});
loadBar.style.setProperty('--p', 1);
document.body.classList.add('ready');
setTimeout(() => { document.getElementById('loader').remove(); UI.say('拖动环绕，点它试试'); }, 1400);
// 调试/自动化入口：APP.step(秒) 可确定性推进
window.APP = { THREE, scene, camera, renderer, Atmos, Path, Terrain, G, sun, bloom, grade, Bike, Rider, PEL, Body, Legs, Wings, Head, Plumage, plume, quill, Flora, Props, Fx, Cam, Act, Input, UI, Quality, Sound, pause: v => { manual = v; }, step: (sec, h = 1 / 60) => { for (let t = 0; t < sec - 1e-9; t += h) frame(h); } };
})().catch(e => {
  console.error(e);
  const t = document.getElementById('loadTxt');
  if (t) t.textContent = '场景启动失败：' + (e && e.message ? e.message : e);
});
</script>
</body>
</html>
