<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WebSocket 测试 · WhaleTool</title><meta name="description" content="在线 WebSocket 调试工具，支持 ws/wss、实时消息收发、定时发送与 JSON 格式化。"><link rel="canonical" href="https://imalasong.github.io/whaletool/tools/websocket.html"><style>
*{box-sizing:border-box}body{margin:0;padding:24px;font:14px/1.6 system-ui,'Microsoft YaHei',sans-serif;color:#263238;background:linear-gradient(135deg,#e0f7fa,#e8eaf6);min-height:100vh}main{max-width:1000px;margin:auto}a{color:#00695c}header{text-align:center;margin:24px}h1{color:#00695c;margin-bottom:4px}header p,.hint{color:#607d8b}.panel{background:white;padding:24px;border-radius:16px;margin:20px 0;box-shadow:0 6px 20px #00000012}h2{font-size:17px;margin:0 0 16px}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}input,textarea,button{font:inherit;border-radius:8px;border:1px solid #cfd8dc;padding:10px}input[type=url]{flex:1;min-width:200px}textarea{width:100%;height:140px;resize:vertical;font-family:monospace;margin:12px 0}button{cursor:pointer;background:#00695c;color:white;border-color:transparent}button.secondary{background:#edf4f4;color:#00695c}button:disabled{opacity:.45;cursor:default}input[type=number]{width:90px}#status{border-radius:20px;background:#edf4f4;padding:4px 12px}#logs{height:350px;overflow:auto;background:#f6f9fa;border-radius:8px;padding:12px;margin-top:16px;font-family:monospace}.entry{border-bottom:1px solid #e0e7e9;padding:8px 0}.entry pre{white-space:pre-wrap;overflow-wrap:anywhere;margin:4px 0}.meta{font-size:12px;color:#607d8b}.received{color:#00695c}.sent{color:#3657b2}.error{color:#b3261e}@media(max-width:600px){body{padding:12px}.panel{padding:16px}header{margin:20px 0}}
</style></head><body><main><a href="../index.html">← 返回工具合辑</a><header><h1>🔌 WebSocket 测试</h1><p>连接服务，实时收发，轻松调试</p></header>
<section class="panel"><h2>服务器配置 <span id="status" role="status">尚未连接</span></h2><div class="row"><label for="url">服务地址</label><input id="url" type="url" placeholder="wss://example.com/socket" autocomplete="off"><button id="connect">连接</button><button id="disconnect" class="secondary" disabled>断开</button></div><p class="hint">支持 ws:// 和 wss://。HTTPS 页面通常需要使用 wss://；浏览器连接不支持自定义请求头。</p></section>
<section class="panel"><h2>发包设置</h2><div class="row"><label><input id="auto" type="checkbox"> 定时发送</label><label>每隔 <input id="interval" type="number" min="0.1" step="0.1" value="1"> 秒</label></div><label for="message">消息内容</label><textarea id="message" spellcheck="false">Hello WebSocket!</textarea><div class="row"><button id="send" disabled>发送消息</button><button id="clearInput" class="secondary">清空输入</button></div></section>
<section class="panel"><div class="row"><h2 style="margin:0;flex:1">调试消息</h2><button id="clear" class="secondary">清空消息</button><button id="pause" class="secondary">暂停显示</button><label><input id="json" type="checkbox" checked> JSON 格式化</label></div><p class="hint">最多保留 500 条记录。暂停仅停止记录接收消息，连接保持正常。</p><div id="logs" role="log" aria-label="消息记录"></div></section></main><script src="../assets/websocket.js"></script></body></html>
