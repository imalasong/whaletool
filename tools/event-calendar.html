<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>演出日历 · WhaleTool</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎫</text></svg>">
<link rel="stylesheet" href="../assets/style.css">
<style>
/* ============================================================
 * 演出日历 —— 苹果风格皮肤
 * 色板 / 字重 / 圆角 / 留白 均照 Apple 官网规范
 * ============================================================ */
:root{
  --ink:#1d1d1f;
  --ink-2:#424245;
  --gray:#86868b;
  --gray-2:#a1a1a6;
  --line:#d2d2d7;
  --line-2:#e8e8ed;
  --paper:#ffffff;
  --paper-2:#f5f5f7;
  --blue:#0071e3;
  --blue-h:#0077ed;
  --blue-bg:#eaf3ff;
  --orange:#ff9500;
  --red:#e30000;
  --green:#00a862;
  --sh-sm:0 1px 3px rgba(0,0,0,.04), 0 4px 12px rgba(0,0,0,.05);
  --sh-md:0 2px 8px rgba(0,0,0,.05), 0 12px 32px rgba(0,0,0,.08);
  --sh-lg:0 4px 16px rgba(0,0,0,.06), 0 24px 60px rgba(0,0,0,.12);
  --r-md:12px; --r-lg:18px; --r-xl:24px;
  --ease:cubic-bezier(.4,0,.2,1);
}
html,body{
  background-color:#f5f5f7 !important;
  background-image:
    radial-gradient(1100px 520px at 16% -10%, rgba(0,113,227,.07), transparent 62%),
    radial-gradient(980px 480px at 88% -8%, rgba(255,149,0,.06), transparent 60%) !important;
  background-repeat:no-repeat;
}
body{
  font-family:-apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI",
              "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  color:var(--ink); letter-spacing:-.01em;
}

/* ---------------- 顶栏 ---------------- */
.ev-nav{
  position:sticky; top:0; z-index:60;
  background:rgba(245,245,247,.78);
  backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid rgba(0,0,0,.06);
}
.ev-nav-in{max-width:1320px;margin:0 auto;padding:0 24px;height:52px;display:flex;align-items:center;gap:14px}
.ev-back{font-size:13px;color:var(--gray);font-weight:500;transition:color .18s var(--ease)}
.ev-back:hover{color:var(--blue)}
.ev-nav-t{font-size:14px;font-weight:600;letter-spacing:-.01em}
.ev-nav-r{margin-left:auto;display:flex;align-items:center;gap:12px}
.ev-sync{font-size:12px;color:var(--gray-2);font-variant-numeric:tabular-nums}
.ev-ibtn{
  font:inherit;font-size:12.5px;font-weight:500;color:var(--ink);
  background:var(--paper-2);border:none;border-radius:980px;
  padding:6px 14px;cursor:pointer;transition:background .18s var(--ease);
}
.ev-ibtn:hover{background:#eaeaef}
.ev-ibtn:disabled{opacity:.45;cursor:default}
.ev-ibtn.spin::before{content:"";display:inline-block;width:9px;height:9px;margin-right:6px;
  border:1.5px solid var(--gray-2);border-top-color:var(--blue);border-radius:50%;
  animation:evspin .7s linear infinite;vertical-align:0}
@keyframes evspin{to{transform:rotate(360deg)}}

/* ---------------- Hero ---------------- */
.ev-hero{max-width:1320px;margin:0 auto;padding:60px 24px 0}
.ev-kicker{font-size:12px;font-weight:600;letter-spacing:.09em;color:var(--blue);text-transform:uppercase}
.ev-hero h1{
  margin-top:10px;font-size:clamp(34px,5.4vw,56px);font-weight:700;
  letter-spacing:-.028em;line-height:1.05;
}
.ev-sub{margin-top:16px;font-size:15px;line-height:1.65;color:var(--gray);max-width:620px;letter-spacing:0}

.ev-stats{display:flex;gap:12px;flex-wrap:wrap;margin-top:34px}
.ev-stat{
  flex:1 1 158px;background:var(--paper);border-radius:var(--r-lg);
  padding:18px 20px 16px;box-shadow:var(--sh-sm);
}
.ev-stat b{display:block;font-size:27px;font-weight:600;letter-spacing:-.03em;line-height:1.15;font-variant-numeric:tabular-nums}
.ev-stat b i{font-style:normal;font-size:14px;font-weight:500;color:var(--gray);margin-left:3px}
.ev-stat u{display:block;text-decoration:none;font-size:11.5px;color:var(--gray);margin-top:5px;letter-spacing:0}

/* ---------------- 工具栏 ---------------- */
.ev-main{max-width:1320px;margin:0 auto;padding:40px 24px 64px}
.ev-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.ev-bar-nav{display:flex;align-items:center;gap:10px}
.ev-areapick{
  display:flex;align-items:center;gap:7px;background:var(--paper);
  border-radius:980px;padding:3px 4px 3px 15px;box-shadow:var(--sh-sm);
  transition:box-shadow .18s var(--ease);
}
.ev-areapick span{
  font-size:11.5px;font-weight:600;color:var(--gray-2);white-space:nowrap;
}
.ev-areapick select{
  font:inherit;font-size:13.5px;font-weight:600;letter-spacing:-.01em;
  color:var(--ink);background:transparent;border:none;outline:none;cursor:pointer;
  padding:6px 4px 6px 0;max-width:158px;
}
.ev-areapick:focus-within{box-shadow:0 0 0 3.5px var(--blue-bg)}
.ev-mnav{display:flex;align-items:center;gap:4px;background:var(--paper);border-radius:980px;padding:4px;box-shadow:var(--sh-sm)}
.ev-mnav button{
  font:inherit;width:30px;height:30px;border:none;background:transparent;border-radius:50%;
  cursor:pointer;color:var(--ink-2);font-size:16px;line-height:1;transition:background .18s var(--ease);
}
.ev-mnav button:hover{background:var(--paper-2)}
.ev-mlabel{padding:0 10px;min-width:118px;text-align:center;line-height:1.25}
.ev-mlabel b{display:block;font-size:15px;font-weight:600;letter-spacing:-.02em}
.ev-mlabel small{display:block;font-size:10.5px;font-weight:500;color:var(--gray-2);letter-spacing:0}
.ev-pill{
  font:inherit;font-size:12.5px;font-weight:500;border:none;border-radius:980px;
  padding:7px 15px;cursor:pointer;background:var(--paper-2);color:var(--ink);
  transition:background .18s var(--ease);
}
.ev-pill:hover{background:#eaeaef}
.ev-pill.on{background:var(--ink);color:#fff}

.ev-seg{display:flex;background:var(--paper-2);border-radius:980px;padding:3px}
.ev-seg button{
  font:inherit;font-size:12.5px;font-weight:500;border:none;background:transparent;
  padding:6px 16px;border-radius:980px;cursor:pointer;color:var(--ink-2);
  transition:all .2s var(--ease);
}
.ev-seg button.on{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
/* 维度切换：和「月历 / 列表」同形，但它是页面的主开关，所以站在左边、用纸白底 */
.ev-dim{background:var(--paper);box-shadow:var(--sh-sm)}
.ev-dim button{padding:6px 15px}
/* 每个维度按钮前一个色点，直接预告这一档日历的点色 */
.ev-dim button::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px;vertical-align:0}
.ev-dim button[data-d="sell"]::before{background:var(--blue)}
.ev-dim button[data-d="show"]::before{background:var(--orange)}
/* 工具栏分组：地区|维度 在左，「视图+月份导航+今天」这一组浏览控件整体靠右 */
.ev-browse{margin-left:auto;display:flex;align-items:center;gap:12px}
.ev-lsep{width:1px;height:22px;background:var(--line);flex:none;margin:0 2px}

.ev-filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.ev-search{
  flex:1 1 200px;min-width:170px;font:inherit;font-size:13.5px;
  padding:9px 15px;border:1px solid var(--line-2);border-radius:980px;
  background:var(--paper);outline:none;transition:border-color .18s var(--ease),box-shadow .18s var(--ease);
}
.ev-search:focus{border-color:var(--blue);box-shadow:0 0 0 3.5px var(--blue-bg)}
.ev-sel{
  font:inherit;font-size:13px;padding:9px 14px;border:1px solid var(--line-2);
  border-radius:980px;background:var(--paper);outline:none;cursor:pointer;color:var(--ink);
}
.ev-sel:focus{border-color:var(--blue);box-shadow:0 0 0 3.5px var(--blue-bg)}
/* ---------------- 主体两栏：活动信息在左，日历在右 ---------------- */
.ev-body{display:grid;grid-template-columns:318px minmax(0,1fr);gap:20px;align-items:start}
/* 窄屏单列：日历在上、活动信息在下（点日期后滚到下方看详情） */
@media (max-width:960px){
  .ev-body{grid-template-columns:1fr}
  #colMain{order:1}
  .ev-side{order:2}
}

/* ---------------- 月历 ---------------- */
.ev-cal{background:var(--paper);border-radius:var(--r-xl);padding:16px;box-shadow:var(--sh-sm)}
/* 表格式日历：表头色带 + 细网格线（gap:1px 露出底色 = 网格线），万年历式结构 */
.ev-week{
  display:grid;grid-template-columns:repeat(7,1fr);gap:1px;
  background:var(--line-2);border:1px solid var(--line-2);
  border-radius:10px 10px 0 0;overflow:hidden;
}
.ev-week span{
  background:#ffeeb8;text-align:center;padding:7px 4px;
  font-size:12px;font-weight:700;color:var(--ink-2);letter-spacing:.02em;
}
.ev-week span:nth-child(6),.ev-week span:nth-child(7){color:#c8402f}  /* 周六/周日红字 */
/* 月份快捷条（万年历式）：1~12 月一键直达，当前月高亮，有日程的月份带点 */
.ev-mstrip{
  display:flex;align-items:center;gap:3px;margin-bottom:12px;
  background:var(--paper-2);border:1px solid var(--line-2);border-radius:12px;
  padding:5px 7px;overflow-x:auto;scrollbar-width:none;
}
.ev-mstrip::-webkit-scrollbar{display:none}
.ev-mstrip .ev-my{
  flex:none;font-size:12px;font-weight:700;color:var(--ink-2);letter-spacing:-.01em;
  padding:0 10px 0 5px;border-right:1px solid var(--line);white-space:nowrap;
}
.ev-mstrip button{
  font:inherit;flex:none;font-size:12.5px;font-weight:600;color:var(--gray-2);
  background:transparent;border:none;border-radius:8px;padding:6px 11px;cursor:pointer;
  transition:background .15s var(--ease),color .15s var(--ease);line-height:1;position:relative;
}
.ev-mstrip button:hover{background:#fff;color:var(--ink)}
.ev-mstrip button.on{background:var(--blue);color:#fff}
.ev-mstrip button.has{color:var(--ink)}
.ev-mstrip button i{
  position:absolute;bottom:2px;left:50%;transform:translateX(-50%);
  width:4px;height:4px;border-radius:50%;background:var(--blue);opacity:0;
}
.ev-mstrip button.has i{opacity:1}
.ev-mstrip button.on i{background:#fff}
.ev-grid{
  display:grid;grid-template-columns:repeat(7,1fr);gap:1px;
  background:var(--line-2);border:1px solid var(--line-2);border-top:none;
  border-radius:0 0 10px 10px;overflow:hidden;
}
/* 日期格 = 「定位哪天有事」的入口，不承担罗列职责（详情在右侧面板）。
   表格式布局：每格白底，格与格之间靠 gap 露出网格线。 */
.ev-cell{
  min-height:64px;padding:6px 8px;
  background:var(--paper);cursor:pointer;
  transition:background .18s var(--ease),box-shadow .18s var(--ease);
  overflow:hidden;position:relative;
  display:flex;flex-direction:column;
}
.ev-cell:hover{background:#f7f7f9}
.ev-cell.pad{background:#fafafc;cursor:default;pointer-events:none}
.ev-cell.pad .ev-dn{color:#c9c9d0}
.ev-cell.sel{box-shadow:inset 0 0 0 2px var(--blue);z-index:1}
.ev-dn{
  align-self:flex-start;
  font-size:15.5px;font-weight:700;line-height:1.15;
  color:var(--ink-2);font-variant-numeric:tabular-nums;letter-spacing:-.02em;
}
.ev-cell.has .ev-dn{color:var(--ink)}
/* 休息日红字（中国日历惯例）：法定节假日深一档，普通周末浅一档 */
.ev-cell.wknd .ev-dn{color:#cd6f66}
.ev-cell.holi .ev-dn{color:#c8402f}
/* 调休上班日本质是「工作日」—— 数字回到中性色，靠角标「班」区分 */
.ev-cell.shif .ev-dn{color:var(--gray-2)}
/* 数字下的节日名副行（万年历式：大数字 + 节日名） */
.ev-fn{
  align-self:flex-start;margin-top:1px;
  font-size:10px;font-weight:600;line-height:1.2;color:#c8402f;letter-spacing:.03em;
}
/* 今天：整格实底蓝（万年历的「今天」格），格内全部反白 */
.ev-cell.today{background:var(--blue);box-shadow:var(--sh-sm)}
.ev-cell.today:hover{background:var(--blue)}
.ev-cell.today .ev-dn{color:#fff}
.ev-cell.today .ev-fn{color:rgba(255,255,255,.92)}
.ev-cell.today .ev-name i{background:#fff}
.ev-cell.today .ev-name i.ring{background:transparent;box-shadow:inset 0 0 0 1.5px #fff}
.ev-cell.today .ev-name i.mis,.ev-cell.today .ev-name i.over{background:rgba(255,255,255,.45)}
.ev-cell.today .ev-name b{color:#fff}
.ev-cell.today .ev-more{color:rgba(255,255,255,.85)}
.ev-cell.today.sel{box-shadow:inset 0 0 0 2px #fff}
/* 右上角斜角标：法定假红「休」/ 调休橙「班」（万年历式的斜角丝带） */
.ev-badge{
  position:absolute;top:9px;right:-21px;transform:rotate(45deg);
  width:58px;text-align:center;font-size:9px;font-weight:700;line-height:1;
  color:#fff;background:#c8402f;letter-spacing:.14em;text-indent:.14em;
  padding:3.5px 0;box-shadow:0 1px 2px rgba(0,0,0,.18);
}
.ev-badge.work{background:#e2942b}
/* 活动名称列表：每行「色点 + 名称」，按活动去重，最多 8 个，超出 +N。
   格子高度随活动数动态拉伸（flex column 自然撑高，行高由该行最高格决定）。 */
.ev-names{margin-top:6px;display:flex;flex-direction:column;gap:4px;min-width:0}
.ev-name{
  display:flex;align-items:center;gap:5px;min-width:0;
  font-size:10.5px;font-weight:500;color:var(--ink-2);line-height:1.3;letter-spacing:-.01em;
}
.ev-name i{width:6px;height:6px;border-radius:50%;background:var(--blue);flex:none}
.ev-name i.ring{background:transparent;box-shadow:inset 0 0 0 1.5px var(--blue)}
.ev-name i.mis{background:#c9c9d0}
.ev-name i.over{background:#dedee4}
.ev-name b{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
/* 演出日程换橙系：实心 = 还没开卖，空心 = 已在售，浅灰 = 演出已过 */
.ev-cal[data-dim="show"] .ev-name i{background:var(--orange)}
.ev-cal[data-dim="show"] .ev-name i.ring{box-shadow:inset 0 0 0 1.5px var(--orange)}
.ev-more{
  margin-top:1px;font-size:10px;font-weight:600;color:var(--gray-2);
  font-variant-numeric:tabular-nums;letter-spacing:-.02em;
}
.ev-cell.has:hover .ev-name b{color:var(--ink)}

/* 图例：解释点色与红字 / 「班」的含义 */
.ev-legend{
  display:flex;align-items:center;flex-wrap:wrap;gap:6px 14px;
  margin-top:12px;font-size:11.5px;color:var(--gray);letter-spacing:0;
}
.ev-legend u{text-decoration:none;display:inline-flex;align-items:center;gap:5px}
.ev-legend i{width:7px;height:7px;border-radius:50%;background:var(--blue);flex:none}
.ev-legend i.ring{background:transparent;box-shadow:inset 0 0 0 1.5px var(--blue)}
.ev-legend i.mis{background:#c9c9d0}
.ev-legend i.over{background:#dedee4}
.ev-legend i.hb{background:#c8402f}
.ev-legend i.hw{width:15px;height:14px;border-radius:4px;background:#ececf0}
.ev-legend em{margin-left:auto;font-style:normal;font-size:11px;color:var(--gray-2)}
.ev-cal[data-dim="show"] .ev-legend i{background:var(--orange)}
.ev-cal[data-dim="show"] .ev-legend i.ring{box-shadow:inset 0 0 0 1.5px var(--orange)}
/* 图例分组：小标签 + 竖分隔线（「日程」口径 ｜ 「日期」口径） */
.ev-legend .ev-lg{font-size:10px;font-weight:600;letter-spacing:.05em;color:var(--gray-2);margin-right:2px}
.ev-legend .ev-lsep{width:1px;height:13px;background:var(--line);margin:0 10px;flex:none}

/* 日历下方提示（如：有 N 场开售时间待定，不上日历） */
.ev-tip{
  margin-top:10px;padding:9px 14px;border-radius:10px;
  background:rgba(255,255,255,.72);font-size:12px;color:var(--gray);
  letter-spacing:0;line-height:1.6;
}
.ev-tip b{color:var(--ink-2);font-weight:600}
.ev-tip a{color:var(--blue);font-weight:500;margin-left:4px}
.ev-tip a:hover{text-decoration:underline}

/* ---------------- 列表时间轴 ---------------- */
.ev-list{background:var(--paper);border-radius:var(--r-xl);padding:8px 20px 20px;box-shadow:var(--sh-sm)}
.ev-grp{padding:18px 0 4px;border-top:1px solid var(--line-2);margin-top:14px}
.ev-grp:first-child{border-top:none;margin-top:6px}
.ev-grp-h{display:flex;align-items:baseline;gap:9px;margin-bottom:12px}
.ev-grp-h b{font-size:15px;font-weight:600;letter-spacing:-.02em}
.ev-grp-h span{font-size:12px;color:var(--gray-2)}
.ev-row{
  display:flex;gap:14px;align-items:center;padding:11px 10px;border-radius:14px;
  cursor:pointer;transition:background .16s var(--ease);
}
.ev-row:hover{background:var(--paper-2)}
.ev-row img{width:46px;height:46px;border-radius:11px;object-fit:cover;flex:none;background:var(--paper-2)}
.ev-row-m{min-width:0;flex:1}
.ev-row-m b{display:block;font-size:13.5px;font-weight:500;letter-spacing:-.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev-row-m span{display:block;font-size:11.5px;color:var(--gray);margin-top:3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev-rtags{display:flex;gap:5px;margin-top:5px;flex-wrap:wrap;text-decoration:none}
.ev-rtags i{
  font-style:normal;font-size:10px;font-weight:600;letter-spacing:0;
  padding:2px 7px;border-radius:980px;background:var(--blue-bg);color:var(--blue);
}
.ev-row-r{text-align:right;flex:none}
.ev-row-r b{display:block;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.ev-row-r span{display:block;font-size:11px;color:var(--gray-2);margin-top:3px}

/* ---------------- 侧栏 ---------------- */
.ev-side{
  position:sticky;top:72px;display:flex;flex-direction:column;gap:14px;
  max-height:calc(100vh - 88px);overflow-y:auto;overflow-x:hidden;
  overscroll-behavior:contain;padding-right:4px;margin-right:-4px;
  scrollbar-width:thin;scrollbar-color:rgba(0,0,0,.16) transparent;
}
.ev-side::-webkit-scrollbar{width:8px}
.ev-side::-webkit-scrollbar-thumb{background:rgba(0,0,0,.16);border-radius:4px;border:2px solid transparent;background-clip:padding-box}
.ev-side::-webkit-scrollbar-thumb:hover{background:rgba(0,0,0,.3);background-clip:padding-box}
.ev-side::-webkit-scrollbar-track{background:transparent}
/* 关键：flex 子项默认会被压缩到容器高以内（卡片被压扁、内容溢出），
   必须钉住「子项保持内容高度」，限高才有「内部滚动」而不是「挤成一团」 */
.ev-side>*{flex:none}
@media (max-width:960px){ .ev-side{position:static;max-height:none;overflow:visible;padding-right:0;margin-right:0} }
.ev-side-h{display:flex;align-items:baseline;gap:8px;padding:0 4px}
.ev-side-h b{font-size:15px;font-weight:600;letter-spacing:-.02em}
.ev-side-h span{font-size:12px;color:var(--gray-2);margin-left:auto}

.ev-card{
  background:var(--paper);border-radius:var(--r-lg);overflow:hidden;
  box-shadow:var(--sh-sm);transition:box-shadow .22s var(--ease),transform .22s var(--ease);
}
.ev-card:hover{box-shadow:var(--sh-md);transform:translateY(-2px)}
.ev-card-pic{position:relative;aspect-ratio:3/4;background:var(--paper-2);overflow:hidden}
.ev-card-pic img{width:100%;height:100%;object-fit:cover;display:block}
.ev-card-tags{position:absolute;left:10px;top:10px;display:flex;gap:5px;flex-wrap:wrap}
.ev-tag{
  font-size:10.5px;font-weight:600;letter-spacing:.01em;padding:3.5px 9px;border-radius:980px;
  background:rgba(255,255,255,.92);color:var(--ink);backdrop-filter:blur(8px);
}
