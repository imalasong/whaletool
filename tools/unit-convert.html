<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>单位换算 · WhaleTool</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐳</text></svg>">
<link rel="stylesheet" href="../assets/style.css">
</head>
<body>

<div class="wt-back"><a href="../">← 工具合辑</a></div>

<div class="tool-head">
  <h1>📏 单位换算</h1>
  <p>长度 / 面积 / 重量 / 体积 / 温度 / 数据存储 / 时间 / 速度，输入一次直接列出全部等价结果。</p>
</div>

<div class="wrap">
  <div class="panel">
    <div class="panel-title"><span>类别</span></div>
    <div class="row tight" id="cats"></div>
  </div>

  <div class="panel">
    <div class="panel-title"><span>输入</span><span class="spacer"></span>
      <span class="pill" id="catHint">—</span></div>
    <div class="row">
      <input class="wt mono" id="value" type="text" value="1" style="flex:1 1 200px">
      <select class="wt" id="from" style="width:auto;min-width:150px"></select>
      <button class="btn btn-ghost" id="btnSwap">⇄ 反转</button>
    </div>
  </div>

  <div class="panel">
    <div class="panel-title"><span>全部换算结果</span><span class="spacer"></span>
      <span class="hint">点击任意一行复制</span></div>
    <table class="wt" id="out">
      <thead><tr><th style="width:30%">单位</th><th class="num" style="width:44%">数值</th><th>简写</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>

  <div class="panel">
    <div class="panel-title"><span>常用速查</span></div>
    <div class="grid3" id="quick"></div>
  </div>
</div>

<div class="tool-foot">换算在浏览器本地完成 · <a href="../">返回工具合辑</a></div>

<script>
(function () {
  "use strict";

  var CATS = {
    length: {
      label: "长度", icon: "📐",
      units: [
        ["毫米", "mm", 0.001], ["厘米", "cm", 0.01], ["分米", "dm", 0.1], ["米", "m", 1],
        ["千米", "km", 1000], ["英寸", "in", 0.0254], ["英尺", "ft", 0.3048],
        ["码", "yd", 0.9144], ["英里", "mi", 1609.344], ["海里", "nmi", 1852],
        ["里", "li", 500], ["尺", "chi", 1 / 3]
      ]
    },
    area: {
      label: "面积", icon: "⬜",
      units: [
        ["平方毫米", "mm²", 1e-6], ["平方厘米", "cm²", 1e-4], ["平方米", "m²", 1],
        ["平方千米", "km²", 1e6], ["公顷", "ha", 10000], ["亩", "mu", 666.6667],
        ["平方英尺", "ft²", 0.092903], ["平方英里", "mi²", 2589988.11], ["英亩", "ac", 4046.8564]
      ]
    },
    weight: {
      label: "重量", icon: "⚖️",
      units: [
        ["毫克", "mg", 1e-6], ["克", "g", 0.001], ["千克", "kg", 1], ["吨", "t", 1000],
        ["斤", "jin", 0.5], ["两", "liang", 0.05], ["盎司", "oz", 0.0283495],
        ["磅", "lb", 0.453592], ["克拉", "ct", 0.0002]
      ]
    },
    volume: {
      label: "体积", icon: "🧪",
      units: [
        ["毫升", "mL", 0.001], ["升", "L", 1], ["立方米", "m³", 1000],
        ["立方厘米", "cm³", 0.001], ["加仑（美）", "gal", 3.785412],
        ["加仑（英）", "galUK", 4.546092], ["品脱（美）", "pt", 0.473176]
      ]
    },
    data: {
      label: "数据存储", icon: "💾",
      units: [
        ["比特", "bit", 1 / 8], ["字节", "B", 1], ["千字节", "KB", 1024],
        ["兆字节", "MB", 1048576], ["吉字节", "GB", 1073741824],
        ["太字节", "TB", 1099511627776], ["PB", "PB", 1125899906842624]
      ]
    },
    time: {
      label: "时间", icon: "⏳",
      units: [
        ["毫秒", "ms", 0.001], ["秒", "s", 1], ["分钟", "min", 60], ["小时", "h", 3600],
        ["天", "d", 86400], ["周", "wk", 604800], ["月（30 天）", "mo", 2592000],
        ["年（365 天）", "yr", 31536000]
      ]
    },
    speed: {
      label: "速度", icon: "🚀",
      units: [
        ["米/秒", "m/s", 1], ["千米/小时", "km/h", 1 / 3.6],
        ["英里/小时", "mph", 0.44704], ["节", "kn", 0.514444], ["马赫", "Ma", 340.29]
      ]
    },
    temp: {
      label: "温度", icon: "🌡",
      special: "temp",
      units: [["摄氏度", "°C", 1], ["华氏度", "°F", 1], ["开尔文", "K", 1]]
    }
  };

  var cat = "length";
  var $cats = document.getElementById("cats"), $value = document.getElementById("value"),
      $from = document.getElementById("from"), $body = document.querySelector("#out tbody"),
      $catHint = document.getElementById("catHint"), $quick = document.getElementById("quick");

  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function buildCats() {
    $cats.innerHTML = "";
    Object.keys(CATS).forEach(function (k) {
      var b = document.createElement("button");
      b.className = "btn " + (k === cat ? "btn-primary" : "btn-ghost") + " btn-sm";
      b.textContent = CATS[k].icon + " " + CATS[k].label;
      b.addEventListener("click", function () {
        cat = k;
        buildCats(); buildUnits(); render();
      });
      $cats.appendChild(b);
    });
  }

  function buildUnits() {
    var c = CATS[cat];
    $from.innerHTML = c.units.map(function (u, i) {
      return '<option value="' + u[1] + '">' + u[0] + " (" + u[1] + ")</option>";
    }).join("");
    $catHint.textContent = c.units.length + " 个单位";
  }

  function unitByCode(code) {
    var us = CATS[cat].units;
    for (var i = 0; i < us.length; i++) if (us[i][1] === code) return us[i];
    return us[0];
  }

  function fmtNum(n) {
    if (!isFinite(n)) return "—";
    var abs = Math.abs(n);
    if (abs === 0) return "0";
    if (abs >= 1e15 || abs < 1e-9) return n.toExponential(6);
    if (abs >= 1e6) return n.toLocaleString("zh-CN", { maximumFractionDigits: 4 });
    var s = n.toPrecision(10).replace(/\.?0+$/, "");
    var num = Number(s);
    if (Math.abs(num - Math.round(num)) < 1e-12 && abs < 1e12) return String(Math.round(num));
    return s;
  }

  function convert(val, fromCode, toCode) {
    var c = CATS[cat];
    if (c.special === "temp") {
      var cels;
      if (fromCode === "°C") cels = val;
      else if (fromCode === "°F") cels = (val - 32) * 5 / 9;
      else cels = val - 273.15;
      if (toCode === "°C") return cels;
      if (toCode === "°F") return cels * 9 / 5 + 32;
      return cels + 273.15;
    }
    var f = unitByCode(fromCode)[2], t = unitByCode(toCode)[2];
    return val * f / t;
  }

  function render() {
    var raw = $value.value.trim();
    if (raw === "") { $body.innerHTML = '<tr><td colspan="3" class="muted">输入一个数值。</td></tr>'; return; }
    var v = Number(raw);
    if (!isFinite(v)) { $body.innerHTML = '<tr><td colspan="3" class="muted err">不是合法数字。</td></tr>'; return; }
    var from = $from.value;
    $body.innerHTML = CATS[cat].units.map(function (u) {
      var r = convert(v, from, u[1]);
      return "<tr data-v=\"" + esc(fmtNum(r)) + " " + esc(u[1]) + '" style="cursor:pointer"' +
        (u[1] === from ? ' class="hl"' : "") + ">" +
        "<td>" + u[0] + '</td><td class="num" style="font-weight:600">' + esc(fmtNum(r)) + "</td>" +
        '<td class="muted">' + u[1] + "</td></tr>";
    }).join("");

    Array.prototype.forEach.call($body.querySelectorAll("tr[data-v]"), function (tr) {
      tr.addEventListener("click", function () {
        var txt = tr.getAttribute("data-v");
        var done = function () { $catHint.textContent = "已复制 " + txt; };
        if (navigator.clipboard && location.protocol !== "file:") {
          navigator.clipboard.writeText(txt).then(done, function () { fb(txt, done); });
        } else { fb(txt, done); }
      });
    });
  }

  function fb(v, cb) {
    var ta = document.createElement("textarea");
    ta.value = v; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); cb(); } catch (e) {}
    document.body.removeChild(ta);
  }

  var QUICK = [
    ["1 英寸", "长度", "in", 1], ["1 英尺", "长度", "ft", 1],
    ["1 英里", "长度", "mi", 1], ["1 斤", "重量", "jin", 1],
    ["1 磅", "重量", "lb", 1], ["1 亩", "面积", "mu", 1],
    ["1 加仑", "体积", "gal", 1], ["1 GB", "数据存储", "GB", 1],
    ["1 天", "时间", "d", 1], ["100 km/h", "速度", "km/h", 100],
    ["0 °C", "温度", "°C", 0], ["98.6 °F", "温度", "°F", 98.6]
  ];
  $quick.innerHTML = QUICK.map(function (q, i) {
    return '<button class="btn btn-ghost btn-sm" data-q="' + i + '">' + q[0] + "</button>";
  }).join("");
  Array.prototype.forEach.call($quick.querySelectorAll("[data-q]"), function (b) {
    b.addEventListener("click", function () {
      var q = QUICK[+this.dataset.q];
      Object.keys(CATS).forEach(function (k) { if (CATS[k].label === q[1]) cat = k; });
      buildCats(); buildUnits();
      $from.value = q[2];
      $value.value = q[3];
      render();
      document.getElementById("out").scrollIntoView({ behavior: "smooth", block: "center" });
    });
  });

  document.getElementById("btnSwap").addEventListener("click", function () {
    var us = CATS[cat].units;
    $from.value = us[(us.findIndex(function (u) { return u[1] === $from.value; }) + 1) % us.length][1];
    render();
  });

  $value.addEventListener("input", render);
  $from.addEventListener("change", render);

  buildCats(); buildUnits(); render();
})();
</script>
</body>
</html>
