<svg id="scene" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid meet" width="100%" height="100%"

<style>

.t-title{font-family:"PeppaDisplay","Noto Sans SC",sans-serif;font-size:76px;letter-spacing:2px;fill:#F4563F}

.t-hint{font-family:"PeppaText","Noto Sans SC",sans-serif;font-size:24px;letter-spacing:1px;fill:#9A8768}
.halo{fill:none;stroke:#FFFFFF;stroke-linejoin:round;stroke-linecap:round}
.halo-title{stroke-width:15}
.halo-sub{stroke-width:9}
.t-sys{font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif}
.badge{opacity:0;transition:opacity .25s ease}
#scene.paused .badge{opacity:1}
#startBtn{cursor:pointer}
#startHint{fill:#6A5640}
</style>

    <stop offset="1" stop-color="#F2FAFF"/>

</defs>

<script>
(function () {
  var svg = document.getElementById('scene');
  if (!svg) return;
  var NS = 'http://www.w3.org/2000/svg';
  var FONT = 'Microsoft YaHei, PingFang SC, sans-serif';
  var GOAL = 300;
  var METER = 24;
  var BASE_SPEED = 440;

  var AX = 601;
  var AY = 672;

  var FRONT_X = 677;
  var WHEEL_R = 43;
  var CLEAR_Y = -40;
  var GRAVITY = 1200;
  var JUMP_V = -820;
  var FCOLORS = ['#FF9DBE', '#FFFFFF', '#FFB74D', '#D7B4FF'];
  var BCOLORS = ['#F4563F', '#FFD265', '#7EC8F0', '#B6E38A'];

  function el(tag, attrs, parent) {
    var n = document.createElementNS(NS, tag);
    if (attrs) {
      for (var k in attrs) {
        if (Object.prototype.hasOwnProperty.call(attrs, k) && attrs[k] != null) n.setAttribute(k, attrs[k]);
      }
    }
    if (parent) parent.appendChild(n);
    return n;
  }
  function text(str, attrs, parent) {
    var n = el('text', attrs, parent);
    n.textContent = str;
    return n;
  }
  function actOf(node) {
    while (node && node !== svg) {
      if (node.getAttribute && node.getAttribute('data-act')) return node.getAttribute('data-act');
      node = node.parentNode;
    }
    return '';
  }
  function show(node) { if (node) node.removeAttribute('display'); }
  function hide(node) { if (node) node.setAttribute('display', 'none'); }

  var layers = [
    {el: document.getElementById('scrollCloud'), k: 0.08},
    {el: document.getElementById('scrollHillFar'), k: 0.16},
    {el: document.getElementById('scrollHillNear'), k: 0.28},
    {el: document.getElementById('scrollTree'), k: 0.48},
    {el: document.getElementById('scrollGround'), k: 1}
  ];
  var rider = document.getElementById('rider');
  var shadow = document.getElementById('shadow');
  var dust = document.getElementById('dust');
  var actors = document.getElementById('actors');
  var fx = document.getElementById('fx');
  var ui = document.getElementById('ui');
  var intro = document.getElementById('introText');
  var startBtn = document.getElementById('startBtn');
  var startHint = document.getElementById('startHint');

  var hud = el('g', {id: 'hud'}, ui);
  hide(hud);
  var HEART = 'M0,8 C0,8 -13,-4 -13,-10 C-13,-16 -6,-16 0,-10 C6,-16 13,-16 13,-10 C13,-4 0,8 0,8 Z';
  var heartEls = [];
  for (var hi = 0; hi < 3; hi++) {
    var hg = el('g', {transform: 'translate(' + (40 + hi * 48) + ',54)'}, hud);
    heartEls.push(el('path', {d: HEART, fill: '#F4563F', stroke: '#FFFFFF', 'stroke-width': 3, 'stroke-linejoin': 'round'}, hg));
  }
  var distText = text('0 / 300 米', {x: 188, y: 62, fill: '#3F7C8C', 'font-size': 30, 'font-weight': 700, 'font-family': FONT}, hud);
  el('rect', {x: 188, y: 76, width: 240, height: 14, rx: 7, fill: '#FFFFFF', opacity: 0.85}, hud);
  var bar = el('rect', {x: 188, y: 76, width: 8, height: 14, rx: 7, fill: '#F4563F'}, hud);
  text('乔治', {x: 438, y: 88, fill: '#3F7C8C', 'font-size': 20, 'font-weight': 700, 'font-family': FONT}, hud);
  var basketWrap = el('g', {}, hud);
  el('rect', {x: -86, y: -34, width: 172, height: 50, rx: 25, fill: '#FFFFFF', opacity: 0.94}, basketWrap);
  var basketText = text('车筐 0', {x: 0, y: 2, 'text-anchor': 'middle', fill: '#C4577F', 'font-size': 28, 'font-weight': 700, 'font-family': FONT}, basketWrap);
  var pauseBtn = el('g', {'data-act': 'pause', role: 'button', 'aria-label': '暂停'}, hud);
  pauseBtn.style.cursor = 'pointer';
  el('rect', {x: 860, y: 28, width: 116, height: 52, rx: 26, fill: '#FFFFFF', opacity: 0.92}, pauseBtn);
  var pauseLabel = text('暂停', {x: 918, y: 62, 'text-anchor': 'middle', fill: '#3F7C8C', 'font-size': 26, 'font-weight': 700, 'font-family': FONT}, pauseBtn);
  var tip = text('点一下跳起来', {x: 188, y: 122, fill: '#9A8768', 'font-size': 24, 'font-family': FONT, opacity: 0}, hud);

  var panel = el('g', {id: 'endPanel'}, ui);
  hide(panel);
  el('rect', {x: 56, y: 20, width: 860, height: 150, rx: 36, fill: '#FFFFFF', stroke: '#F7C9D6', 'stroke-width': 7}, panel);
  var endTitle = text('', {x: 92, y: 82, fill: '#F4563F', 'font-size': 46, 'font-weight': 700, 'font-family': FONT}, panel);
  var endSub = text('', {x: 92, y: 128, fill: '#3F7C8C', 'font-size': 28, 'font-family': FONT}, panel);
  var endBtn = el('g', {'data-act': 'restart', role: 'button', 'aria-label': '再骑一次'}, panel);
  endBtn.style.cursor = 'pointer';
  el('rect', {x: 650, y: 50, width: 220, height: 86, rx: 43, fill: '#EE5A4C'}, endBtn);
  text('再骑一次', {x: 760, y: 104, 'text-anchor': 'middle', fill: '#FFFFFF', 'font-size': 32, 'font-weight': 700, 'font-family': FONT}, endBtn);

  var mud = el('g', {opacity: 0, 'pointer-events': 'none'}, rider);
  el('ellipse', {cx: 510, cy: 430, rx: 34, ry: 16, fill: '#8A6844'}, mud);
  el('ellipse', {cx: 560, cy: 400, rx: 16, ry: 11, fill: '#A88858'}, mud);
  el('ellipse', {cx: 470, cy: 400, rx: 14, ry: 9, fill: '#C4A574'}, mud);
  el('ellipse', {cx: 530, cy: 348, rx: 11, ry: 8, fill: '#8A6844'}, mud);

  var state = 'ready';
  var stateBefore = 'play';
  var worldX = 0;
  var runStart = 0;
  var racing = false;
  var speed = 180;
  var y = 0;
  var vy = 0;
  var onGround = true;
  var hearts = 3;
  var basket = 0;
  var inv = 0;
  var shake = 0;
  var stain = 0;
  var fallT = 0;
  var tipT = 0;
  var basketScale = 1;
  var objects = [];
  var parts = [];
  var george = null;
  var t = 0;
  var last = 0;
  var frameDt = 0.016;
  var overlayAt = 0;
  var animPaused = false;
  var actx = null;
  var taught = {};
  var colorI = 0;
  var puddleCount = 0;

  function applyScroll(x) {
    for (var i = 0; i < layers.length; i++) {
      if (!layers[i].el) continue;
      var m = (x * layers[i].k) % 1280;
      if (m < 0) m += 1280;
      layers[i].el.setAttribute('transform', 'translate(' + (-m).toFixed(2) + ',0)');
    }
  }
  function meters() {
    if (!racing) return 0;
    return Math.max(0, Math.min(GOAL, Math.floor((worldX - runStart) / METER)));
  }
  function tone(freq, dur, type, vol) {
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      if (!actx) actx = new AC();
      if (actx.state === 'suspended') actx.resume();
      var o = actx.createOscillator();
      var g = actx.createGain();
      o.type = type || 'sine';
      o.frequency.value = freq;
      g.gain.setValueAtTime(vol || 0.04, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
      o.connect(g);
      g.connect(actx.destination);
      o.start();
      o.stop(actx.currentTime + dur);
    } catch (err) {}
  }
  function chime() {
    tone(523, 0.14, 'sine', 0.04);
    setTimeout(function () { tone(659, 0.14, 'sine', 0.04); }, 120);
    setTimeout(function () { tone(784, 0.22, 'sine', 0.045); }, 240);
  }
  function burst(x, y0, color, count) {
    var n = count || 8;
    for (var i = 0; i < n; i++) {
      var c = el('circle', {cx: x, cy: y0, r: 3 + Math.random() * 5, fill: color}, fx);
      var a = Math.random() * Math.PI * 2;
      var v = 70 + Math.random() * 170;
      parts.push({n: c, x: x, y: y0, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 30, life: 0.4 + Math.random() * 0.25, text: false});
    }
  }
  function popup(x, y0, str) {
    var n = text(str, {x: x, y: y0, 'text-anchor': 'middle', fill: '#F4563F', 'font-size': 32, 'font-weight': 700, 'font-family': FONT}, fx);
    parts.push({n: n, x: x, y: y0, vx: 0, vy: -52, life: 0.7, text: true});
  }
  function stepParts(dt) {
    for (var i = parts.length - 1; i >= 0; i--) {
      var p = parts[i];
      p.life -= dt;
      if (p.life <= 0) {
        if (p.n.parentNode) p.n.parentNode.removeChild(p.n);
        parts.splice(i, 1);
        continue;
      }
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 380 * dt;
      var op = Math.max(0, Math.min(1, p.life * 2.2));
      if (p.text) {
        p.n.setAttribute('x', p.x.toFixed(1));
        p.n.setAttribute('y', p.y.toFixed(1));
      } else {
        p.n.setAttribute('cx', p.x.toFixed(1));
        p.n.setAttribute('cy', p.y.toFixed(1));
      }
      p.n.setAttribute('opacity', op.toFixed(3));
    }
  }
  function syncHud() {
    var m = meters();
    distText.textContent = m + ' / ' + GOAL + ' 米';
    basketText.textContent = '车筐 ' + basket;
    var w = 240 * m / GOAL;
    if (w < 2) hide(bar);
    else { show(bar); bar.setAttribute('width', w.toFixed(1)); }
    for (var i = 0; i < heartEls.length; i++) heartEls[i].setAttribute('fill', i < hearts ? '#F4563F' : '#E4D3C6');
    svg.setAttribute('data-state', state);
    svg.setAttribute('data-basket', String(basket));
    svg.setAttribute('data-hearts', String(hearts));
    svg.setAttribute('data-meters', String(m));
    svg.setAttribute('data-y', y.toFixed(1));
  }
  function syncRider() {
    var shx = shake > 0 ? Math.sin(t * 48) * 12 : 0;
    var tilt = y * 0.012;
    if (state === 'fall') tilt += Math.min(14, fallT * 20);
    rider.setAttribute('transform', 'translate(' + (AX + shx).toFixed(1) + ',' + (AY + y).toFixed(1) + ') rotate(' + tilt.toFixed(2) + ') scale(' + BIKE_SCALE + ') translate(' + (-AX) + ',' + (-AY) + ')');
    var lift = Math.max(0, -y);
    var sc = Math.max(0.45, 1 - lift / 420);
    shadow.setAttribute('rx', (132 * sc).toFixed(1));
    shadow.setAttribute('opacity', (0.22 * sc).toFixed(3));
    var moving = (state === 'ready' || state === 'play' || state === 'finish') && onGround && (state === 'ready' || speed > 40);
    dust.setAttribute('opacity', moving ? '1' : '0');
    if (inv > 0) rider.setAttribute('opacity', (Math.floor(inv * 14) % 2 === 0) ? '1' : '0.42');
    else rider.setAttribute('opacity', '1');
    basketWrap.setAttribute('transform', 'translate(640,56) scale(' + basketScale.toFixed(3) + ')');
    tip.setAttribute('opacity', tipT <= 0 ? '0' : (tipT < 0.7 ? (tipT / 0.7).toFixed(3) : '1'));
  }
  function pauseAnim() {
    if (!animPaused && svg.pauseAnimations) { svg.pauseAnimations(); animPaused = true; }
  }
  function resumeAnim() {
    if (animPaused && svg.unpauseAnimations) { svg.unpauseAnimations(); animPaused = false; }
  }
  function stepBody(dt) {
    if (!onGround) {
      vy += GRAVITY * dt;
      y += vy * dt;
      if (y >= 0) {
        y = 0;
        vy = 0;
        onGround = true;
        if (state === 'play' || state === 'finish') burst(600, 668, '#EADFC6', 4);
      }
    }
  }
  function addLabel(g, label, ly) {
    if (!label) return;
    el('circle', {cx: 0, cy: ly, r: 20, fill: '#FFFFFF', opacity: 0.92}, g);
    text(label, {x: 0, y: ly + 8, 'text-anchor': 'middle', fill: '#F4563F', 'font-size': 26, 'font-weight': 700, 'font-family': FONT}, g);
  }
  function drawFlower(color, label) {
    var g = el('g');
    el('path', {d: 'M 0 12 C -3 30 5 44 0 58', fill: 'none', stroke: '#5EAE70', 'stroke-width': 5, 'stroke-linecap': 'round'}, g);
    el('ellipse', {cx: -16, cy: 32, rx: 11, ry: 5, fill: '#74C687', transform: 'rotate(-35 -16 32)'}, g);
    for (var i = 0; i < 5; i++) {
      var a = -Math.PI / 2 + i * Math.PI * 2 / 5;
      var attrs = {cx: (Math.cos(a) * 15).toFixed(1), cy: (Math.sin(a) * 15).toFixed(1), r: 10, fill: color};
      if (color === '#FFFFFF') { attrs.stroke = '#E7B7C6'; attrs['stroke-width'] = 2; }
      el('circle', attrs, g);
    }
    el('circle', {cx: 0, cy: 0, r: 7, fill: '#FFD265', stroke: '#E0A820', 'stroke-width': 2}, g);
    addLabel(g, label, -38);
    return g;
  }
  function drawBalloon(color, label) {
    var g = el('g');
    el('path', {d: 'M 0 30 C 4 50 -2 66 0 82', fill: 'none', stroke: '#C9A24A', 'stroke-width': 3, 'stroke-linecap': 'round'}, g);
    el('ellipse', {cx: 0, cy: 0, rx: 26, ry: 32, fill: color}, g);
    el('ellipse', {cx: -8, cy: -10, rx: 8, ry: 12, fill: '#FFFFFF', opacity: 0.4}, g);
    el('path', {d: 'M -6 28 L 6 28 L 0 38 Z', fill: color}, g);
    addLabel(g, label, -50);
    return g;
  }
  function drawPuddle(label, wide) {
    var g = el('g');
    var rx = wide ? 58 : 42;
    var ry = wide ? 14 : 12;
    el('ellipse', {cx: 0, cy: 5, rx: rx + 10, ry: ry + 6, fill: '#6AA8C8', opacity: 0.35}, g);
    el('ellipse', {cx: 0, cy: 0, rx: rx, ry: ry, fill: '#9FD4EA', stroke: '#6AA8C8', 'stroke-width': 4}, g);
    el('ellipse', {cx: wide ? -30 : -22, cy: -4, rx: wide ? 34 : 24, ry: 6, fill: '#FFFFFF', opacity: 0.6}, g);
    addLabel(g, label, -(ry + 28));
    return g;
  }
  function drawRock(label) {
    var g = el('g');
    el('ellipse', {cx: 0, cy: 14, rx: 26, ry: 7, fill: '#E4D3B4', opacity: 0.95}, g);
    el('path', {d: 'M -24 10 C -30 -6 -12 -24 0 -20 C 16 -26 32 -4 24 12 C 12 16 -10 16 -24 10 Z', fill: '#8A847C', stroke: '#5C574F', 'stroke-width': 4, 'stroke-linejoin': 'round'}, g);
    el('path', {d: 'M -10 -2 C -2 -12 8 -8 10 0', fill: 'none', stroke: '#D0CBC4', 'stroke-width': 3, 'stroke-linecap': 'round'}, g);
    addLabel(g, label, -40);
    return g;
  }
  function drawGeorge() {
    var g = el('g');
    el('ellipse', {cx: 0, cy: 8, rx: 48, ry: 12, fill: '#7BA98A', opacity: 0.3}, g);
    el('path', {d: 'M -14 -2 L -16 -48', stroke: '#E88FB2', 'stroke-width': 16, fill: 'none', 'stroke-linecap': 'round'}, g);
    el('path', {d: 'M 12 -2 L 16 -48', stroke: '#F9A7C6', 'stroke-width': 16, fill: 'none', 'stroke-linecap': 'round'}, g);
    el('rect', {x: -34, y: -14, width: 26, height: 14, rx: 6, fill: '#3B4A55'}, g);
    el('rect', {x: 6, y: -14, width: 26, height: 14, rx: 6, fill: '#3B4A55'}, g);
    el('path', {d: 'M 18 -76 C 48 -64 54 -44 38 -38', stroke: '#E88FB2', 'stroke-width': 14, fill: 'none', 'stroke-linecap': 'round'}, g);
    el('path', {d: 'M -36 -96 C -46 -54 -28 -34 0 -32 C 32 -34 46 -54 36 -96 C 16 -112 -16 -112 -36 -96 Z', fill: '#5EB0E0', stroke: '#3A86B8', 'stroke-width': 4, 'stroke-linejoin': 'round'}, g);
    var arm = el('g', {}, g);
    el('path', {d: 'M -14 -82 C -48 -120 -82 -112 -66 -80', stroke: '#F9A7C6', 'stroke-width': 14, fill: 'none', 'stroke-linecap': 'round'}, arm);
    var dino = el('g', {transform: 'translate(-78,-88)'}, arm);
    el('ellipse', {cx: 8, cy: 4, rx: 20, ry: 12, fill: '#7BC67E', stroke: '#3E8F4A', 'stroke-width': 3}, dino);
    el('circle', {cx: -12, cy: -4, r: 10, fill: '#7BC67E', stroke: '#3E8F4A', 'stroke-width': 3}, dino);
    el('circle', {cx: -15, cy: -6, r: 2.2, fill: '#2C2418'}, dino);
    el('path', {d: 'M 24 2 C 36 -2 38 -10 30 -8', stroke: '#3E8F4A', 'stroke-width': 4, fill: 'none', 'stroke-linecap': 'round'}, dino);
    el('ellipse', {cx: 4, cy: -158, rx: 8, ry: 12, fill: '#F9A7C6', stroke: '#C4577F', 'stroke-width': 3}, g);
    el('ellipse', {cx: 2, cy: -124, rx: 34, ry: 30, fill: '#F9A7C6', stroke: '#C4577F', 'stroke-width': 4}, g);
    el('ellipse', {cx: -28, cy: -118, rx: 13, ry: 9, fill: '#F9A7C6', stroke: '#C4577F', 'stroke-width': 4}, g);
    el('circle', {cx: -6, cy: -130, r: 4.5, fill: '#3A2B33'}, g);
    el('circle', {cx: -32, cy: -118, r: 2.4, fill: '#C4577F'}, g);
    el('path', {d: 'M -22 -110 Q -32 -104 -40 -112', fill: 'none', stroke: '#7A4A5C', 'stroke-width': 3, 'stroke-linecap': 'round'}, g);
    el('circle', {cx: 14, cy: -116, r: 6, fill: '#FF9DBE', opacity: 0.75}, g);
    var bubble = el('g', {opacity: 0}, g);
    el('rect', {x: -70, y: -232, width: 140, height: 44, rx: 22, fill: '#FFFFFF', stroke: '#F6C9D4', 'stroke-width': 4}, bubble);
    text('佩奇！', {x: 0, y: -202, 'text-anchor': 'middle', fill: '#F4563F', 'font-size': 22, 'font-weight': 700, 'font-family': FONT}, bubble);
    g._arm = arm;
    g._bubble = bubble;
    return g;
  }
  function spawn(type, x) {
    var color = '#FF9DBE';
    var label = '';
    var wide = false;
    var node;
    if (type === 'george') node = drawGeorge();
    else {
      if (type === 'flower') color = FCOLORS[colorI++ % FCOLORS.length];
      if (type === 'balloon') color = BCOLORS[colorI++ % BCOLORS.length];
      if (!taught[type]) {
        taught[type] = true;
        label = (type === 'puddle' || type === 'rock') ? '跳' : '收';
      }
      if (type === 'puddle') { puddleCount++; wide = puddleCount >= 3; }
      if (type === 'flower') node = drawFlower(color, label);
      else if (type === 'balloon') node = drawBalloon(color, label);
      else if (type === 'puddle') node = drawPuddle(label, wide);
      else node = drawRock(label);
    }
    actors.appendChild(node);
    var o = {
      type: type, x: x, node: node, color: color,
      hw: type === 'puddle' ? (wide ? 50 : 36) : type === 'rock' ? 24 : 46,
      sy: type === 'balloon' ? 500 : type === 'flower' ? 582 : type === 'puddle' ? 678 : type === 'rock' ? 646 : 688,
      hit: false, closed: false, cleared: false, got: false,
      phase: Math.random() * 6.28,
      arm: node._arm || null,
      bubble: node._bubble || null
    };
    objects.push(o);
    if (type === 'george') george = o;
    return o;
  }
  function removeObj(i) {
    var n = objects[i].node;
    if (n.parentNode) n.parentNode.removeChild(n);
    objects.splice(i, 1);
  }
  function clearObjects() {
    for (var i = 0; i < objects.length; i++) {
      if (objects[i].node.parentNode) objects[i].node.parentNode.removeChild(objects[i].node);
    }
    objects = [];
    george = null;
  }
  function clearFx() {
    for (var i = 0; i < parts.length; i++) {
      if (parts[i].n.parentNode) parts[i].n.parentNode.removeChild(parts[i].n);
    }
    parts = [];
  }
  function buildSpawns() {
    taught = {};
    colorI = 0;
    puddleCount = 0;
    var x0 = worldX + 1280;
    var seq = [
      ['flower', 0],
      ['flower', 360],
      ['balloon', 740],
      ['puddle', 1140],
      ['flower', 1560],
      ['balloon', 1920]
    ];
    var rel = 2140;
    var hazards = ['rock', 'puddle', 'rock', 'puddle', 'rock', 'puddle', 'rock'];
    for (var n = 0; n < hazards.length; n++) {
      seq.push(['flower', rel]);
      seq.push([hazards[n], rel + 420]);
      seq.push([n % 2 === 0 ? 'balloon' : 'flower', rel + 800]);
      rel += 1020;
    }
    var maxHit = GOAL * METER - 400;
    for (var i = 0; i < seq.length; i++) {
      var x = x0 + seq[i][1];
      if ((x - runStart) - FRONT_X > maxHit) continue;
      spawn(seq[i][0], x);
    }
  }
  function collect(o, sx) {
    o.got = true;
    basket += 1;
    basketScale = 1.32;
    o.node.setAttribute('display', 'none');
    popup(sx, o.sy - 24, '+1');
    burst(sx, o.sy, o.color, 7);
    tone(basket % 2 ? 760 : 940, 0.07, 'sine', 0.032);
  }
  function hurt() {
    hearts -= 1;
    if (hearts < 0) hearts = 0;
    inv = 1.75;
    shake = 0.3;
    stain = Math.min(1, stain + 0.4);
    mud.setAttribute('opacity', String(stain));
    speed = Math.max(400, speed * 0.82);
    vy = -400;
    onGround = false;
    burst(640, 658, '#8A6844', 10);
    burst(680, 650, '#9FD4EA', 6);
    tone(150, 0.18, 'sine', 0.045);
    try { if (navigator.vibrate) navigator.vibrate(28); } catch (err) {}
    if (hearts <= 0) {
      stain = 1;
      mud.setAttribute('opacity', '1');
      state = 'fall';
      fallT = 0;
      vy = -260;
    }
    syncHud();
  }
  function jump() {
    if ((state === 'play' || state === 'finish') && onGround) {
      onGround = false;
      vy = JUMP_V;
      tone(520, 0.08, 'triangle', 0.03);
    }
  }
  function updateObjects(move) {
    for (var i = objects.length - 1; i >= 0; i--) {
      var o = objects[i];
      var sx = o.x - worldX;
      if (o.type === 'george') {
        o.node.setAttribute('transform', 'translate(' + sx.toFixed(1) + ',670) scale(1.15)');
        continue;
      }
      if (o.got) {
        if (sx < -240) removeObj(i);
        continue;
      }
      var bob = o.type === 'balloon' ? Math.sin(t * 2.3 + o.phase) * 8 : (o.type === 'flower' ? Math.sin(t * 1.7 + o.phase) * 2 : 0);
      o.node.setAttribute('transform', 'translate(' + sx.toFixed(1) + ',' + (o.sy + bob).toFixed(1) + ')');
      var prev = sx + move;
      var spanL = REAR_X - WHEEL_R - o.hw;
      var spanR = FRONT_X + WHEEL_R + o.hw;
      var overBike = sx < spanR && prev > spanL;
      if (o.type === 'flower' || o.type === 'balloon') {
        if (overBike) collect(o, sx);
      } else if (!o.closed && (o.type === 'puddle' || o.type === 'rock') && (state === 'play' || state === 'finish')) {
        var high = y < CLEAR_Y;
        if (overBike && inv > 0) { o.closed = true; o.hit = true; }
        else if (overBike && !high) {
          o.closed = true;
          o.hit = true;
          hurt();
        }
        if (!o.closed && sx < spanL) {
          o.closed = true;
          if (!o.hit) speed = Math.min(MAX_SPEED, speed + 32);
        }
      }
      if (sx < -280) removeObj(i);
    }
  }
  function waveGeorge() {
    if (!george || !george.arm) return;
    var ang = Math.sin(t * 6.5) * 18;
    george.arm.setAttribute('transform', 'rotate(' + ang.toFixed(2) + ' -14 -82)');
    if (george.bubble) {
      var gsx = george.x - worldX;
      george.bubble.setAttribute('opacity', (state === 'win' || gsx < 1340) ? '1' : '0');
    }
  }
  function beginFinish() {
    state = 'finish';
    spawn('george', worldX + 1520);
  }
  function updateFinish() {
    if (!george) return;
    var stopAt = 880;
    var dist = (george.x - worldX) - stopAt;
    if (dist < 700) {
      var cap = Math.max(0, dist * 0.9);
      if (speed > cap) speed = Math.max(cap, speed - 520 * frameDt);
    }
    if (dist <= 10) {
      worldX = george.x - stopAt;
      speed = 0;
      state = 'win';
      applyScroll(worldX);
      showEnd('win');
      pauseAnim();
    }
  }
  function updateFall(dt) {
    fallT += dt;
    speed = Math.max(0, speed - 680 * dt);
    if (fallT > 0.95 && speed < 70 && onGround) {
      speed = 0;
      state = 'over';
      showEnd('over');
      pauseAnim();
    }
  }
  function showEnd(kind) {
    overlayAt = performance.now();
    if (kind === 'win') {
      endTitle.textContent = '见到乔治啦';
      endSub.textContent = '车筐里收了 ' + basket + ' 样';
      chime();
      burst(980, 520, '#FF9DBE', 8);
      burst(1040, 560, '#FFD265', 6);
    } else {
      endTitle.textContent = '哎呀，一身泥';
      endSub.textContent = '骑了 ' + meters() + ' 米，车筐里有 ' + basket + ' 样';
      tone(196, 0.2, 'sine', 0.04);
    }
    show(panel);
    hide(hud);
    syncHud();
  }
  function startGame() {
    clearObjects();
    clearFx();
    hearts = 3;
    basket = 0;
    inv = 0;
    shake = 0;
    stain = 0;
    fallT = 0;
    y = 0;
    vy = 0;
    onGround = true;
    basketScale = 1;
    speed = BASE_SPEED;
    runStart = worldX;
    racing = true;
    state = 'play';
    tipT = 3.5;
    mud.setAttribute('opacity', '0');
    rider.setAttribute('opacity', '1');
    hide(intro);
    show(hud);
    hide(panel);
    show(pauseBtn);
    pauseLabel.textContent = '暂停';
    svg.removeAttribute('class');
    resumeAnim();
    buildSpawns();
    syncHud();
    syncRider();
  }
  function togglePause() {
    if (state === 'play' || state === 'finish') {
      stateBefore = state;
      state = 'paused';
      pauseAnim();
      svg.setAttribute('class', 'paused');
      pauseLabel.textContent = '继续';
    } else if (state === 'paused') {
      state = stateBefore;
      resumeAnim();
      svg.removeAttribute('class');
      pauseLabel.textContent = '暂停';
    }
  }
  function press() {
    if (state === 'ready') { startGame(); return; }
    if (state === 'paused') { togglePause(); return; }
    if (state === 'win' || state === 'over') {
      if (performance.now() - overlayAt > 450) startGame();
      return;
    }
    jump();
  }
  function onPointer(e) {
    if (e.preventDefault) e.preventDefault();
    var act = actOf(e.target);
    if (act === 'pause') { togglePause(); return; }
    if (act === 'start' || act === 'restart') { startGame(); return; }
    press();
  }
  function frame(ts) {
    frameDt = last ? Math.min(0.034, (ts - last) / 1000) : 0.016;
    last = ts;
    if (state !== 'paused') t += frameDt;
    var dt = frameDt;
    if (state === 'paused') { requestAnimationFrame(frame); return; }
    if (state === 'ready') {
      worldX += 180 * dt;
      applyScroll(worldX);
      var pulse = 0.5 + 0.5 * Math.sin(t * 3.2);
      if (startBtn) startBtn.setAttribute('opacity', (0.84 + 0.16 * pulse).toFixed(3));
      if (startHint) startHint.setAttribute('opacity', (0.78 + 0.22 * pulse).toFixed(3));
      syncRider();
      svg.setAttribute('data-state', 'ready');
      requestAnimationFrame(frame);
      return;
    }
    if (state === 'win' || state === 'over') {
      if (!onGround) stepBody(dt);
      waveGeorge();
      stepParts(dt);
      syncRider();
      requestAnimationFrame(frame);
      return;
    }
    stepBody(dt);
    var move = speed * dt;
    worldX += move;
    applyScroll(worldX);
    updateObjects(move);
    if (state === 'play' && (worldX - runStart) >= GOAL * METER) beginFinish();
    if (state === 'finish') updateFinish();
    if (state === 'fall') updateFall(dt);
    if (inv > 0) inv = Math.max(0, inv - dt);
    if (shake > 0) shake = Math.max(0, shake - dt);
    if (tipT > 0) tipT = Math.max(0, tipT - dt);
    basketScale += (1 - basketScale) * Math.min(1, dt * 9);
    stepParts(dt);
    waveGeorge();
    syncRider();
    syncHud();
    requestAnimationFrame(frame);
  }

  svg.addEventListener('pointerdown', onPointer);
  svg.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  document.addEventListener('keydown', function (e) {
    if (e.repeat) return;
    if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W' || e.key === 'Enter') {
      e.preventDefault();
      press();
    } else if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') {
      e.preventDefault();
      if (state === 'play' || state === 'finish' || state === 'paused') togglePause();
    }
  });
  requestAnimationFrame(frame);
})();
</script>
</svg>
